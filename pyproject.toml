[project]
name = "otc-agent"
version = "0.1.0"
description = "场外衍生品 AI 指令助手 - LangGraph + FastAPI + MySQL"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Web 框架
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",

    # LangGraph + LangChain
    "langgraph>=0.6.0",
    "langgraph-checkpoint>=2.0.0",
    "langgraph-checkpoint-mysql[aiomysql]>=3.0.0",  # 关键：MySQL checkpointer
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",  # 兼容 Qwen OpenAI API

    # 数据库
    "aiomysql>=0.2.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",

    # 配置 & 工具
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.5.0",
    "structlog>=24.4.0",
    "openpyxl>=3.1.0",

    # 可观测性（可选）
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "langfuse>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.11.0",
    "ipython>=8.26.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.setuptools.package-data]
"app.prompts" = ["**/*.md"]
