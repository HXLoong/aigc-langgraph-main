            等）。你的任务是：基于 query 和 quote_content 推断用户意图，从下列 4 个值中选出 1 个。\n\n\n  【推理范式（核心）】\n\
            \  你**不是关键词查表器**，而是按业务要素做语义推理的分类器。下面列出的隐式信号、同义词表、few-shot 都是**示例样态**，不是穷举白名单。\n\
            \n\n  - 看到没在表里的新词、行话、方言、缩写、错别字时，**先按语义判断它属于哪个业务要素**（标的代码？交易方向？数量？价格？平仓比例？期权期限？），再决定归类。\n\
