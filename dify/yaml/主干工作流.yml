    - data:
        code: "import openpyxl\nimport json\nimport requests\nimport tempfile\nimport\
          \ os\n\n\ndef main(excel_file):\n    \"\"\"\n    解析Excel文件并将\"产品\"列名改为\"\
          交易对手\"\n\n    Args:\n        excel_file: 包含文件信息的字典数组，格式如：\n            \
          \       [{\"remote_url\": \"http://...\", \"url\": \"http://...\", ...}]\n\
          \n    Returns:\n        列表的字符串化形式\n    \"\"\"\n    temp_file = None\n\n\
          \    try:\n        # 从数组中获取第一个元素\n        file_info = excel_file[0]\n\n\
          \        # 获取远程URL\n        url = file_info.get('remote_url') or file_info.get('url')\n\
          \n        # 下载文件到临时目录\n        response = requests.get(url)\n        response.raise_for_status()\n\
          \n        # 创建临时文件\n        temp_file = tempfile.NamedTemporaryFile(delete=False,\
          \ suffix='.xlsx')\n        temp_file.write(response.content)\n        temp_file.close()\n\
          \n        # 加载Excel文件\n        workbook = openpyxl.load_workbook(temp_file.name)\n\
          \        sheet = workbook.active\n\n        # 检查Excel是否为空\n        if sheet.max_row\
          \ == 0:\n            return {\"result\": []}\n\n        # 获取表头（第一行）\n  \
          \      headers = []\n        for cell in sheet[1]:\n            if cell.value:\n\
          \                # 清理表头中的换行符和空格\n                header = str(cell.value).strip().replace('\\\
          n', '')\n                headers.append(header)\n\n        # 检查是否只有表头没有信息\n\
          \        if sheet.max_row <= 1:\n            return {\"result\": []}\n\n\
          \        # 将\"产品\"替换为\"交易对手\"\n        headers = [\"交易对手\" if h == \"产品\"\
          \ else h for h in headers]\n\n        # 解析数据行\n        result = []\n   \
          \     序号 = 1  # 初始化序号\n        for row in sheet.iter_rows(min_row=2, values_only=True):\n\
          \            # 跳过空行\n            if not any(row):\n                continue\n\
          \n            # 创建对象，确保所有字段都存在\n            obj = {\"序号\": 序号}  # 添加序号属性\n\
          \            for i, header in enumerate(headers):\n                # 如果该列存在值则使用，否则设为None\n\
          \                obj[header] = row[i] if i < len(row) else None\n\n    \
          \        # 将字典对象转换为JSON字符串\n            result.append(json.dumps(obj, ensure_ascii=False))\n\
          \            序号 += 1  # 序号自增\n\n        return {\n                \"result\"\
          : result,\n                \"total\": len(result)\n            }\n\n   \
          \ finally:\n        # 清理临时文件\n        if temp_file and os.path.exists(temp_file.name):\n\
          \            try:\n                os.unlink(temp_file.name)\n         \
          \   except:\n                pass\n"
