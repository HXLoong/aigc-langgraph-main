    - data:
        code: "# -*- coding: utf-8 -*-\n\"\"\"\nDify code 节点 —— 互换开仓（所有互换交易操作）\n================================================================\n\
          替换主干节点：tool 1775726557182（场外交易-互换工具）\n并入下游「互换工具-返回JSON解析」(1755074096425)\
          \ 逻辑 => 直接输出最终字段，删掉该解析节点。\n\n⚠️ 入参用「模型解析数据转字符串」(1764752703564) 的上一个节点\n\
          \   —— 「互换-将提取出的标的列表拼接原数据」(1775199495108) 的 result（object，含 type/orderList），\n\
          \   不再经过转字符串节点（已是对象，无需 json.loads）。\n\n输出变量（5 个，对齐原返回解析节点；互换 productType=1）：\n\
          \  code         number\n  result       string\n  intent       string\n \
          \ orderList    array[object]\n  productType  number\n\n输入变量：\n  swapData\
          \       <- 互换-将提取出的标的列表拼接原数据 / result  (1775199495108.result，object，含 type/orderList)\n\
          \  conversationId <- 开始 / conversation_id              (1755072621769)\n\
          \  messageId      <- 开始 / message_id\n  query          <- sys.query\n  rawContent\
          \     <- 开始 / raw_content\n  quoteContent   <- 开始 / quote_content\n  quoteAppinfo\
          \   <- 开始 / quote_appinfo\n  userId         <- sys.user_id\n  roomId   \
          \      <- 开始 / room_id\n  guid           <- 开始 / guid\n  apiUrl        \
          \ <- env.api_url\n  otc_secret     <- env.otc_secret\n\n注意：\n  - 互换接口是 /admin-api/swap-order/operate（不是\
          \ financial-orders）。\n  - payload 无 operate 字段（照搬互换工具内部实现）；timeout=60；Authorization\
          \ 无 Bearer 前缀。\n  - 互换工具 end 原本不输出 orderList，故原返回解析的 orderList 恒为 None；这里同样保持\
          \ None\n    （如需输出本次请求的订单列表，把 orderList=None 改为 orderList=req_order_list\
          \ 即可）。\n\"\"\"\nimport json\nimport requests\n\n\ndef main(\n        swapData,\n\
          \        conversationId,\n        messageId,\n        query,\n        rawContent,\n\
          \        quoteContent,\n        quoteAppinfo,\n        userId,\n       \
          \ roomId,\n        guid,\n        apiUrl,\n        otc_secret,\n       \
          \ operatorUserId) -> dict:\n    # swapData = 上游拼接后的对象（含 type / orderList），无需\
          \ json.loads；若万一传字符串也兼容。\n    if isinstance(swapData, str):\n        try:\n\
          \            swapData = json.loads(swapData) if swapData.strip() else {}\n\
          \        except Exception:\n            swapData = {}\n    swapData = swapData\
          \ or {}\n\n    intent = swapData.get(\"type\")\n    req_order_list = swapData.get(\"\
          orderList\") or []\n\n    url = f\"{apiUrl}/admin-api/swap-order/operate\"\
          \n    headers = {\"Content-Type\": \"application/json\", \"Authorization\"\
          : otc_secret}\n    payload = {\n        \"conversationId\": conversationId,\n\
          \        \"messageId\": messageId,\n        \"messageContent\": query,\n\
          \        \"rawContent\": rawContent,\n        \"quoteContent\": quoteContent,\n\
          \        \"quoteAppinfo\": quoteAppinfo,\n        \"userId\": userId,\n\
          \        \"roomId\": roomId,\n        \"guid\": guid,\n        \"type\"\
          : intent,\n        \"orderList\": req_order_list,\n        \"operatorUserId\"\
          : operatorUserId,\n    }\n\n    code = None\n    result = \"\"\n    try:\n\
          \        resp = requests.post(url, json=payload, headers=headers, timeout=60)\n\
          \        resp.raise_for_status()\n        parsed = resp.json()\n       \
          \ code = parsed.get(\"code\")\n        if code == 0:\n            result\
          \ = parsed.get(\"data\", \"\")\n        elif code == 500:\n            result\
          \ = \"交易指令服务暂不可用\"\n        else:\n            result = parsed.get(\"msg\"\
          , \"未知错误\")\n    except Exception:\n        code = 500\n        result =\
          \ \"交易指令服务暂不可用\"\n\n    # 并入原「互换工具-返回JSON解析」逻辑，直接输出最终字段（互换 productType=1）\n\
          \    return {\n        \"code\": code,\n        \"result\": result,\n  \
          \      \"intent\": intent,\n        \"productType\": 1,\n    }\n"
        code_language: python3
        outputs:
          code:
