            \ 100%\" → \"参与型看涨\"（参与型关键词优先）\n   - 完全没有期权类型相关词且无其他线索 → null\n\n\n\n\
            3. tenor(期限):\n   - 【输出格式严格要求 — 极其重要】tenor 字段输出**必须是 \"XM\" 格式**（X 为正整数月份，M\
            \ 必须大写）；询价接口**仅支持 M 单位**，不接受 Y/y/年/月/m\n   - 单位归一化规则（必须在输出前完成，不允许把 Y/y/年/m\
            \ 直接写到 tenor）:\n     · 年 → 月（× 12）：\"1Y\"/\"1y\"/\"1年\" → \"12M\"；\"2Y\"\
            /\"2年\" → \"24M\"；\"3年\" → \"36M\"；以此类推\n     · 月：\"1M\"/\"1个月\"/\"一个月\"\
            \ → \"1M\"；\"3M\"/\"三个月\" → \"3M\"；\"6M\"/\"半年\" → \"6M\"；\"12M\"/\"一年\"\
            \ → \"12M\"\n     · 纯数字（如 \"1\"、\"12\"，无单位）→ 补 M 后缀：→ \"1M\"、\"12M\"\n\
            \     · 小写 m → 大写 M：\"1m\"/\"12m\" → \"1M\"/\"12M\"\n   - 中文期限识别（结果已归一化为\
            \ M）: \"一个月\"=\"1M\"、\"两个月\"=\"2M\"、\"三个月\"=\"3M\"、\"半年\"=\"6M\"、\"一年\"\
            =\"12M\"、\"两年\"=\"24M\"、\"三年\"=\"36M\"\n   - 【输出反例 — 绝对禁止】:\n     · ❌\
            \ tenor=\"1Y\" / \"1y\" / \"1年\"（必须先按 ×12 转 \"12M\" 再输出，绝不允许保留 Y）\n  \
            \   · ❌ tenor=\"1\" / \"12\"（必须补 M 后缀）\n     · ❌ tenor=\"1m\" / \"12m\"\
            （必须大写 M）\n     · ❌ tenor=\"1.5M\" / \"0.5M\"（期权期限只能为正整数月份，不允许小数）\n\n\n\
            \   【多期限 \"/\" 详细规则】\n   \"/\"符号表示多个独立期限的组合,绝不是数学运算符:\n   - \"1/2M\" →\
            \ 两个独立期限 \"1M\" 和 \"2M\", 创建两个 orderList 对象\n   - \"1/3M\" → \"1M\" 和\
            \ \"3M\"\n   - \"2/6M\" → \"2M\" 和 \"6M\"\n   - \"1M/3M\" → \"1M\" 和 \"\
            3M\"\n   每个独立期限对应 orderList 中的一个完整对象(其他参数相同)。\n\n\n   【绝对禁止】\n   - 把\"\
            1/2M\"解释为\"0.5M\"或\"1.5M\"等小数期限\n   - 生成任何小数期限,期权期限只能是整数月份/周数/年数\n\n\n\
            \n4. strikePercentage(行权价格百分比):\n   - 【输出格式严格要求 — 极其重要】strikePercentage\
            \ 字段输出**必须是数字**（如 100、95、103.5），**绝对不允许带百分号 %** 或以字符串形式输出\n   - 数字+%:\
            \ \"100%\"、\"95%\"、\"103%\" → 提取**数字**部分（输出 100、95、103，不允许输出 \"100%\"\
            \ 字符串）\n   - 多执行价\"数字/数字+%\": \"100/103%\" → 两个值 100/103 拆解为两个 orderList\
            \ 对象\n   - 【平值/平直关键词】: 若输入包含\"平值\"或\"平直\"(含紧黏写法如\"平直看涨\"、\"平值雪球\"),\n\
            \     必须识别为 strikePercentage: 100.00\n     · \"平直看涨 1M\" → strikePercentage:\
