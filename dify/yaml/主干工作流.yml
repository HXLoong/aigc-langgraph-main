          \ 或其他明确数字不改变该判断。\\n\"\n        f\"- 当用户原始输入包含{keywords}，且未出现具体跟量比例时 → `{field}:\
          \ true`。\\n\"\n        f\"- 仅出现普通‘跟量’或‘市价跟量’，且未出现‘最大跟量’或其他明确快速执行语义时 → `{field}:\
          \ false`；普通跟量仍可独立识别 placeOrderAlgorithmType=POV，但不代表最大跟量。\\n\"\n       \
          \ f\"- 用户给出具体跟量比例（如跟量后紧跟数字或百分比）时 → `{field}: false`，让显式比例走原通路；若同时包含‘最大跟量’，按前一条判断为\
