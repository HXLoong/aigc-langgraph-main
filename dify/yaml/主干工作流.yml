        code: "# -*- coding: utf-8 -*-\n\"\"\"\nDify code 节点 3 —— 期权平仓（持仓查询 / 下单 /\
          \ 撤单 的统一接口）\n================================================================\n\
          替换主干节点：http 1772594763508  ->  POST {apiUrl}/admin-api/financial-orders/operate\n\
          并入下游「期权平仓-返回JSON解析」(1772594251735) 逻辑 => 直接输出最终字段，删掉该解析节点。\n输出变量（3 个，对齐原返回解析节点；平仓只有这\
          \ 3 个，没有 code/orderList）：\n  intent       string\n  productType  number\n\
          \  result       string\n\n输入变量：\n  conversationId  <- 开始 / conversation_id\
          \           (1755072621769)\n  messageId       <- 开始 / message_id\n  query\
          \           <- sys.query\n  quoteAppinfo    <- 开始 / quote_appinfo\n  roomId\
          \          <- 开始 / room_id\n  guid            <- 开始 / guid\n  userId   \
          \       <- sys.user_id\n  type            <- 期权平仓-意图识别 / text          (1772589205439.text，close_order_xxx)\n\
          \  closeOrderReqVO <- 期权平仓-参数聚合 / result        (1772606114116.result，Object)\n\
          \  apiUrl          <- env.api_url\n  otc_secret      <- env.otc_secret\n\
          \  rawContent      <- 开始 / raw_content\n  quoteContent    <- 开始 / quote_content\n\
          \n注意：Authorization 无 Bearer 前缀（照搬原 http 节点 headers）。\n      平仓的 /query-close-orders\
          \ 订单查询接口不在内联范围（另一个独立接口，保持原 http 节点不动）。\n\"\"\"\nimport json\nimport requests\n\
          \n\ndef main(\n        conversationId,\n        messageId,\n        query,\n\
          \        quoteAppinfo,\n        roomId,\n        guid,\n        userId,\n\
          \        type,\n        closeOrderReqVO,\n        apiUrl,\n        otc_secret,\n\
          \        rawContent,\n        quoteContent,\n        operatorUserId) ->\
          \ dict:\n    # closeOrderReqVO 可能以字符串传入，做一次容错解析\n    if isinstance(closeOrderReqVO,\
          \ str):\n        try:\n            closeOrderReqVO = json.loads(closeOrderReqVO)\n\
          \        except Exception:\n            closeOrderReqVO = {}\n\n    url\
          \ = f\"{apiUrl}/admin-api/financial-orders/operate\"\n    headers = {\"\
          Content-Type\": \"application/json\", \"Authorization\": otc_secret}\n \
          \   payload = {\n        \"conversationId\": conversationId,\n        \"\
          messageId\": messageId,\n        \"messageContent\": query,\n        \"\
          quoteAppinfo\": quoteAppinfo,\n        \"roomId\": roomId,\n        \"guid\"\
          : guid,\n        \"userId\": userId,\n        \"type\": type,\n        \"\
          closeOrderReqVO\": closeOrderReqVO,\n        \"operatorUserId\": operatorUserId,\n\
          \        \"operate\": \"\",\n        \"orderList\": [],\n        \"optionRfq\"\
          : {},\n        \"rawContent\": rawContent,\n        \"quoteContent\": quoteContent,\n\
          \    }\n    # 调接口 + 并入原「期权平仓-返回JSON解析」逻辑；错误处理对齐开仓\n    result = \"\"\n \
          \   try:\n        resp = requests.post(url, json=payload, headers=headers,\
          \ timeout=60)\n        resp.raise_for_status()\n        parsed = resp.json()\n\
          \        code = parsed.get(\"code\")\n        if code == 0:\n          \
          \  result = parsed.get(\"data\", \"\")\n        elif code == 500:\n    \
          \        result = \"交易指令服务暂不可用\"\n        else:\n            result = parsed.get(\"\
          msg\", \"未知错误\")\n    except Exception:\n        result = \"交易指令服务暂不可用\"\
          \n\n    return {\n        \"intent\": type,        # 平仓意图（= 入参 type，原透传\
          \ 1772589205439.text）\n        \"productType\": 0,\n        \"result\":\
          \ result,\n    }\n"
