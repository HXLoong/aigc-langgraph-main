            \ optionType: \"雪球\"\n     · \"中国平安平直看涨\" → stockCode: \"中国平安\", strikePercentage:\
            \ 100, optionType: \"欧式看涨\"\n   - 平值识别优先于 stockCode 排除法: \"平值\"/\"平直\"\
            \ 必须被识别为已知字段(strikePercentage 关键词),\n     不能污染 stockCode 候选\n   - 没有明确提供且无平值关键词\
            \ → null\n\n\n\n5. notionalAmount(名义本金):\n   - 从raw_content中提取\n   - 格式:\
            \ 数字字符串(单位转换后),如\"1000000\"\n   - 单位识别:\n     · \"100万\" → 1000000\n \
            \    · \"1W\" / \"1w\" → 10000\n     · \"1000w\" / \"1000W\" → 10000000\n\
            \     · \"1KW\" / \"1kw\" → 10000\n     · \"1千万\" → 10000000\n     · \"\
            1亿\" / \"1E\" / \"1e\" → 100000000\n     · 中文数字: \"两千万\" → 20000000、\"\
            三千万\" → 30000000\n   - 用户可能分批补充参数,需要从历史中累积已补充的参数\n\n\n\n6. participationRate(参与率):\n\
            \   - 识别关键词: \"参与率\"、\"参与比例\" 及其后数字\n   - \"参与率: 90%\" → 90.0\n   - \"\
            参与比例 80%\" → 80.0\n   - 【极重要】严格区分: \"POV25\" 是 povRatio(本节点询价场景一般不涉及),\n\
            \     不是 participationRate; 不要把 POV 数字识别为参与率\n\n\n\n7. shortName(交易对手):\n\
            \   - 【识别关键词】\"交易对手:\" / \"交易对手\" / \"账号\" / \"交易账号\" / \"交易账户\" 后接的完整标识符\n\
            \   - 【典型标识符格式】数字+中文名+可选括号内容，如 \"11125测试短名（张天琪专用）\"、\"10074测试短名\"、\"0099123\"\
            \n   - 【无显式关键词也能识别】分隔符（中英文逗号/顿号/空格/换行）后剩余的\"数字+中文\"模式片段，即使没有\"交易对手:\"\
            前缀，也应识别为 shortName（典型示例：\"博时央调ETF, 欧式看涨 1M, 80%, 11125测试短名（张天琪专用）\" →\
            \ 最后一个片段就是 shortName）\n\n\n   【完整性保证 — 极其重要】\n   - 必须保留括号（中文括号（） / 英文括号()）及其内全部内容，逐字符原样不动\n\
            \   - 数字前缀必须完整保留（如 \"11125\"），不能拆走\n   - 中英文括号类型必须与原始输入一致，绝不互换\n   - ✅\
            \ 正例：\n     · \"11125测试短名（张天琪专用）\" → shortName: \"11125测试短名（张天琪专用）\"\n\
            \     · \"11125测试短名(张天琪专用)\" → shortName: \"11125测试短名(张天琪专用)\"\n     ·\
            \ \"交易对手:11125测试短名（张天琪专用）\" → shortName: \"11125测试短名（张天琪专用）\"（去掉\"交易对手:\"\
            前缀，保留完整内容）\n     · \"交易对手 11125测试短名(张天琪专用)\" → shortName: \"11125测试短名(张天琪专用)\"\
            \n     · \"账号 0099123\" → shortName: \"0099123\"\n   - ❌ 反例（绝对禁止）：\n \
            \    · \"11125测试短名（张天琪专用）\" → shortName: \"11125测试短名\"（截断括号内容，错误）\n  \
            \   · \"11125测试短名（张天琪专用）\" → notionalAmount: \"11125测试短名（张天琪专用）\"（含中文/括号绝不是名义本金，严重错误）\n\
            \     · \"11125测试短名（张天琪专用）\" → participationRate: 11125（数字前缀单独拆出当参与率，严重错误）\n\
            \     · \"交易对手:11125测试短名（张天琪专用）\" → shortName: null（显式关键词存在却没识别，错误）\n\n\
            \n   【与 notionalAmount / participationRate 的严格区分】\n   - 含中文字符或括号的片段 →\
            \ 绝不能写入 notionalAmount（notionalAmount 只接受\"纯数字+万/W/kw/千万/亿\"等单位格式）\n \
            \  - 含中文字符或括号的片段 → 绝不能拆出数字部分写入 participationRate\n   - 一旦识别为 shortName\
            \ 模式，整个片段（数字前缀+中文名+括号）必须**整体**写入 shortName 字段，不可拆解\n\n\n   【选项格式 — 字母/序号回复】\n\
            \   - 用户回复单字母（A/B/C）或序号（\"第1个\"/\"第二个\"）→ 从 quote_content 查找候选交易对手列表\n\
            \   - 提取对应选项的完整名称（含所有括号内容），原样写入 shortName\n\n\n   【未提供时】\n   - 用户没明确提供交易对手\
            \ → shortName: null\n\n\n   【与 strikePercentage / participationRate 字段的边界\
            \ — 极其重要】\n   - shortName 段的新增规则**不影响** strikePercentage 与 participationRate\
            \ 各自的提取逻辑：\n     · \"80%\" / \"100%\" / \"95%\" 等**数字+%** 格式 → 严格走 strikePercentage（按上面第\
            \ 4 节规则），**绝不**写入 participationRate\n     · 只有当用户明确出现 \"参与率\" 或 \"参与比例\"\
            \ 关键词时，相关数字才写入 participationRate；否则 participationRate 必须为 null\n   - ❌\
            \ 反例：用户输入 \"博时央调ETF，欧式看涨 1M, 80%, 11125测试短名（张天琪专用）\"\n     · 错误识别：strikePercentage=null,\
            \ participationRate=80（把 80% 错塞给参与率）\n     · 正确识别：strikePercentage=80,\
            \ participationRate=null, shortName=\"11125测试短名（张天琪专用）\"\n\n\n\n【换标场景处理】\n\
            当用户输入单个字母(A、B、C等)或序号(第1个、第2个):\n- 从quote_content中查找候选标的列表\n- 提取对应的完整标的代码和名称\n\
            \n\n\n【补充参数场景】\n当用户在补充之前缺失的参数时:\n- 仅用raw_content中的新参数覆盖对应字段\n- 保留历史中已提供的参数\n\
            \n\n\n【关键规则】\n- 如果用户或上下文未明确提供 stockCode,该字段必须为 null\n- 禁止通过模型知识库进行任何代码-名称映射或推断\n\
            - 多次询价: 只解析最后一次的输入,忽略之前的所有询价内容\n- 没有明确提供的字段设为null\n\n\n\n【多订单展开 - 最高优先级，先于输出格式执行】\n\
            当 tenor 或 strikePercentage 出现 \"/\" 分隔的多个值时，必须按笛卡尔积展开为多个 orderList 对象：\n\
            - orderList 对象数 = (tenor 值个数) × (strikePercentage 值个数)\n- 每个对象除被展开的 tenor/strike\
            \ 外，其余字段完全相同\n- 展开示例（务必逐条产出，不得合并或丢失任何一单）：\n  · \"茅台 1M/3M 100%\"    →\
            \ 2 个对象：{tenor:\"1M\",strikePercentage:100}、{tenor:\"3M\",strikePercentage:100}\n\
            \  · \"茅台 1M 100/103%\"   → 2 个对象：{tenor:\"1M\",strikePercentage:100}、{tenor:\"\
            1M\",strikePercentage:103}\n  · \"茅台 1/3M 100/103%\" → 4 个对象（2×2 笛卡尔积）\n\
            \n\n\n【输出前强制订单数自检 - 必须执行】\n1. 数 tenor 串中 \"/\" 分隔出的期限个数 = T（无 \"/\" 则\
            \ T=1）\n2. 数 strikePercentage 串中 \"/\" 分隔出的执行价个数 = S（无 \"/\" 则 S=1）\n\
