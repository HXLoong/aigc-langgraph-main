    - data:
        code: "import json\n\n# ============================================================\n\
          # 节点：互换-标的对手覆盖聚合（纯数据聚合，无业务规则）\n#   只做一件事：把 LLM-C 抽好的 orderList，用 LLM-A(标的指针)、LLM-B(对手指针)的结果\n\
          #   确定性查表覆盖 placeOrderWindCode / placeOrderShortname 两个字段，其余字段原样保留。\n# 【输入】\n\
          #   cOut          : 互换-节点-下单(LLM-C).structured_output = {type, orderList:[{...}]}\n\
          #   aRes          : 互换-选择标的(LLM-A).structured_output  = {picks:[{orderId,orderSeq,idx,seq,directRef}]}\n\
          #   bRes          : 互换-选择交易对手(LLM-B).structured_output = {hasSignal, picks:[{orderId,orderSeq,idx,letter,ordinal,directName}]}\n\
          #   candidateList : 候选标的提取.candidateList = [{orderId,orderSeq,candidates:[{seq,code,name}]}]\n\
          #   trsList       : 候选标的提取.trsList = [{ctptyId,shortName,longName,sort}]\n\
          # 【输出】result = {type, orderList}；仅 windCode/shortname 被覆盖\n# ============================================================\n\
          \n\ndef load_obj(x, default):\n    if x is None:\n        return default\n\
          \    if isinstance(x, (dict, list)):\n        return x\n    try:\n     \
          \   return json.loads(x)\n    except Exception:\n        return default\n\
          \n\ndef as_int(x):\n    try:\n        return int(x)\n    except Exception:\n\
          \        return None\n\n\ndef build_id_to_seq(candidate_list):\n    mapping\
          \ = {}\n    for blk in candidate_list:\n        if blk.get(\"orderId\")\
          \ is not None:\n            mapping[blk[\"orderId\"]] = blk.get(\"orderSeq\"\
          )\n    return mapping\n\n\ndef match_order_index(pick, order_list, id_to_seq,\
          \ single):\n    \"\"\"pick 落到 order_list 哪个下标：orderId > orderSeq(反查) > idx；单订单=0；对不上=-1。\"\
          \"\"\n    if single:\n        return 0\n    order_id = pick.get(\"orderId\"\
          )\n    if order_id is not None:\n        for i, o in enumerate(order_list):\n\
          \            if o.get(\"orderId\") == order_id:\n                return\
          \ i\n    order_seq = as_int(pick.get(\"orderSeq\"))\n    if order_seq is\
          \ not None:\n        for i, o in enumerate(order_list):\n            if\
          \ o.get(\"orderId\") is not None and id_to_seq.get(o.get(\"orderId\")) ==\
          \ order_seq:\n                return i\n    idx = pick.get(\"idx\")\n  \
          \  if isinstance(idx, int) and 0 <= idx < len(order_list):\n        return\
          \ idx\n    return -1\n\n\ndef resolve_candidate_block(pick, candidate_list):\n\
          \    order_id = pick.get(\"orderId\")\n    order_seq = as_int(pick.get(\"\
          orderSeq\"))\n    idx = pick.get(\"idx\")\n    for blk in candidate_list:\n\
          \        if order_id is not None and blk.get(\"orderId\") == order_id:\n\
          \            return blk\n    for blk in candidate_list:\n        if order_seq\
          \ is not None and blk.get(\"orderSeq\") == order_seq:\n            return\
          \ blk\n    if isinstance(idx, int) and 0 <= idx < len(candidate_list):\n\
          \        return candidate_list[idx]\n    if len(candidate_list) == 1:\n\
          \        return candidate_list[0]\n    return None\n\n\ndef windcode_from_pick(pick,\
          \ candidate_list):\n    \"\"\"LLM-A 指针→真实 windCode：seq→candidates.code；directRef→匹配候选\
          \ canonical，匹配不到原样。\"\"\"\n    blk = resolve_candidate_block(pick, candidate_list)\n\
          \    seq = as_int(pick.get(\"seq\"))\n    if seq is not None and blk:\n\
          \        for ca in blk.get(\"candidates\", []):\n            if ca.get(\"\
          seq\") == seq:\n                return ca.get(\"code\")\n        return\
          \ None\n    ref = pick.get(\"directRef\")\n    if ref:\n        ref = str(ref).strip()\n\
          \        if blk:\n            for ca in blk.get(\"candidates\", []):\n \
          \               name = ca.get(\"name\") or \"\"\n                if ca.get(\"\
          code\") == ref or name == ref or (name and (ref in name or name in ref)):\n\
          \                    return ca.get(\"code\")\n        return ref\n    return\
          \ None\n\n\ndef shortname_from_pick(pick, trs_list):\n    \"\"\"LLM-B 指针→真实\
          \ shortName：directName 按名匹配；letter/ordinal→sort→shortName；查不到 None。\"\"\"\
          \n    name = pick.get(\"directName\")\n    if name:\n        name = str(name).strip()\n\
          \        for t in trs_list:\n            if t.get(\"shortName\") == name:\n\
          \                return t.get(\"shortName\")\n        for t in trs_list:\n\
          \            sn = t.get(\"shortName\") or \"\"\n            if sn and (name\
          \ in sn or sn in name):\n                return t.get(\"shortName\")\n \
          \       return None\n    sort = None\n    if pick.get(\"letter\") is not\
          \ None:\n        sort = str(pick[\"letter\"]).upper()\n    elif pick.get(\"\
          ordinal\") is not None:\n        x = as_int(pick.get(\"ordinal\"))\n   \
          \     if x is not None and 1 <= x <= len(trs_list):\n            sort =\
          \ chr(64 + x)\n        else:\n            return None\n    if sort is None:\n\
          \        return None\n    for t in trs_list:\n        if str(t.get(\"sort\"\
          )).upper() == sort:\n            return t.get(\"shortName\")\n    return\
          \ None\n\n\ndef apply_underlying(order_list, a_picks, candidate_list, id_to_seq,\
          \ single):\n    \"\"\"标的覆盖(非破坏)：LLM-A 解析到非空 windCode 才覆盖该订单；解析为空/未选中 → 保留\
          \ LLM-C 原值，绝不置 None。\"\"\"\n    grouped = {}\n    for p in a_picks:\n  \
          \      i = match_order_index(p, order_list, id_to_seq, single)\n       \
          \ if i >= 0:\n            grouped.setdefault(i, []).append(p)\n    for i,\
          \ picks in grouped.items():\n        code = None\n        for p in picks:\n\
          \            v = windcode_from_pick(p, candidate_list)\n            if v\
          \ is not None:\n                code = v\n                break\n      \
          \  if code is not None:\n            order_list[i][\"placeOrderWindCode\"\
          ] = code\n\n\ndef apply_counterparty(order_list, b_picks, trs_list, id_to_seq,\
          \ single):\n    \"\"\"对手覆盖(非破坏)：LLM-B 解析到非空 shortName 才覆盖该订单；解析为空 → 保留 LLM-C\
          \ 原值，绝不置 None。\"\"\"\n    grouped = {}\n    for p in b_picks:\n        i\
          \ = 0 if single else match_order_index(p, order_list, id_to_seq, single)\n\
          \        if i >= 0:\n            grouped.setdefault(i, []).append(p)\n \
          \   for i, picks in grouped.items():\n        sn = None\n        for p in\
          \ picks:\n            v = shortname_from_pick(p, trs_list)\n           \
          \ if v is not None:\n                sn = v\n                break\n   \
          \     if sn is not None:\n            order_list[i][\"placeOrderShortname\"\
          ] = sn\n\n\ndef main(cOut, aRes, bRes, candidateList, trsList):\n    \"\"\
          \"纯聚合：LLM-A/B 指针确定性查表覆盖 LLM-C 的 windCode/shortname；异常 fail-safe 返回 LLM-C\
          \ 原值。\"\"\"\n    try:\n        c = load_obj(cOut, {}) or {}\n        order_list\
          \ = c.get(\"orderList\") if isinstance(c.get(\"orderList\"), list) else\
          \ []\n        order_type = c.get(\"type\")\n        if not order_list:\n\
          \            return {\"result\": {\"type\": order_type, \"orderList\": order_list}}\n\
          \n        a = load_obj(aRes, {}) or {}\n        b = load_obj(bRes, {}) or\
          \ {}\n        a_picks = a.get(\"picks\") if isinstance(a.get(\"picks\"),\
          \ list) else []\n        b_has_signal = bool(b.get(\"hasSignal\"))\n   \
          \     b_picks = b.get(\"picks\") if (b_has_signal and isinstance(b.get(\"\
          picks\"), list)) else []\n        candidate_list = candidateList if isinstance(candidateList,\
          \ list) else load_obj(candidateList, [])\n        trs_list = trsList if\
          \ isinstance(trsList, list) else load_obj(trsList, [])\n        single =\
          \ len(order_list) == 1\n        id_to_seq = build_id_to_seq(candidate_list)\n\
          \n        # 标的：候选语境(candidate_list 非空)时用 LLM-A 指针覆盖；解析到非空才覆盖、否则保留 LLM-C(兜底)\n\
          \        if candidate_list:\n            apply_underlying(order_list, a_picks,\
          \ candidate_list, id_to_seq, single)\n\n        # 对手：LLM-B 解析到非空才覆盖；无信号/解析空\
          \ → 保留 LLM-C 提取的对手(兜底)，不再清空\n        if b_has_signal:\n            apply_counterparty(order_list,\
          \ b_picks, trs_list, id_to_seq, single)\n\n        return {\"result\": {\"\
          type\": order_type, \"orderList\": order_list}}\n    except Exception:\n\
          \        c = load_obj(cOut, {}) or {}\n        return {\"result\": c if\
          \ c else {\"type\": None, \"orderList\": []}}\n"
        code_language: python3
        outputs:
          result:
            children: null
            type: object
