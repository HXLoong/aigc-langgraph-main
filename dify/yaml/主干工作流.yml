            \n  * \"做空\" → \"SHORT_OPEN\"\n\n- **【极其重要】开平仓是完整术语,绝对禁止按字面拆分**:\n  *\
            \ \"卖出开仓\"、\"卖出平仓\"、\"买入平仓\"、\"买入开仓\"各自是**不可拆分的完整方向术语**\n  * **绝对禁止**拆成\"\
            卖出\"+\"开仓\"或\"买入\"+\"平仓\"再分别理解\n  * **绝对禁止**自行拼造枚举值(如\"BUY_CLOSE\"、\"\
            SELL_OPEN\"等)\n- **【严重错误示例】**:\n  * \"卖出开仓\" → \"SELL\"(严重错误!应为\"SHORT_OPEN\"\
            )\n  * \"卖出平仓\" → \"SELL\"(严重错误!应为\"SHORT_CLOSE\")\n  * \"卖空\" → \"SELL\"\
            (严重错误!应为\"SHORT_OPEN\")\n- **【极其重要】委托方向位置无关规则**:\n  * 委托方向关键词可以出现在输入文本的**任何位置**(开头、中间、末尾),都必须正确识别\n\
            \  * **绝对禁止**因为方向词出现在末尾就截断匹配(如\"卖出平仓\"在末尾时只匹配到\"卖出\")\n  * **强制要求**: 提取方向时,必须先**扫描完整输入文本**找出所有方向候选词,然后对每个候选词执行分步匹配流程\n\
            \  * **正确示例**(方向词在不同位置,结果必须一致):\n    - \"0700.HK 100股 限价50 卖出平仓\" → \"\
            SHORT_CLOSE\"(末尾)\n    - \"卖出平仓 0700.HK 100股 限价50\" → \"SHORT_CLOSE\"\
            (开头)\n  * **严重错误**: \"0700.HK 100股 限价50 卖出平仓\" → \"SELL\"(因为在末尾就只匹配了\"\
            卖出\",应为\"SHORT_CLOSE\")\n- 未提供则为null\n\nplaceOrderPriceType(价格类型,字符串):\n\
            - 从第一行(文本模式)或参数列/参数行(表格模式)提取价格类型\n- \"限价\"或\"限价委托\"或符合【@限价记号保护规则】的 `@数字`\
            \ →\"LimitOrder\";\"市价\"或\"市价委托\"→\"MarketOrder\"\n- **零默认规则**: 如果用户未明确提供价格类型(既无\"\
            限价\"也无\"市价\"),placeOrderPriceType=null，由后端按交易品种兜底\n- 未提供时为null，由后端按交易品种兜底\n\
            \nplaceOrderPrice(价格,数字):\n- 当placeOrderPriceType=\"LimitOrder\"时必需\n\
            - 从\"限价X\"或\"限价X.X\"中提取数字,支持小数\n- 也支持从符合【@限价记号保护规则】的 `@数字` 中提取价格；如 `@N,NNN`、`@\
            \ N,NNN` → placeOrderPrice = 去逗号后的数字\n- `@数字` 的价格提取优先级高于数量提取；一旦识别为价格，该数字不得再作为任何数量字段候选\n\
            - **识别格式**:\n  * \"限价2\" → placeOrderPrice=2\n  * \"限价10\" → placeOrderPrice=10\n\
            \  * \"限价82.2\" → placeOrderPrice=82.2\n  * \"限价 2\" → placeOrderPrice=2(有空格也要提取)\n\
            \  * \"限价\" → placeOrderPrice=null(确实没有数字)\n- 否则为null\n\nplaceOrderAlgorithmType(算法类型,字符串):\n\
            - 识别\"POV\"、\"TWAP\"、\"VWAP\"、\"ICEBERG\"、\"SNIPER\"并映射为同名枚举值\n- **POV算法自动识别规则**:当用户使用以下表达时,自动识别为POV算法:\n\
            \  * \"占XX%\"(如\"占35%\") → placeOrderAlgorithmType=\"POV\", placeOrderPovPercent=35\n\
            \  * \"跟量XX%\"(如\"跟量3%\") → placeOrderAlgorithmType=\"POV\", placeOrderPovPercent=3\n\
            \  * \"占比XX%\"(如\"占比25%\") → placeOrderAlgorithmType=\"POV\", placeOrderPovPercent=25\n\
            \  * \"POV XX%\"或\"POVXX%\"或\"POV XX%\"(如\"POV25%\"或\"pov50%\"或\"POV 15%\"\
            ) → placeOrderAlgorithmType=\"POV\", placeOrderPovPercent=25或50或15\n \
            \ * **【修正】**: \"POV 15%\"中POV后有空格,但\"15%\"是独立的百分比(条件2),仍然应当提取为15\n- 未提供则为null\n\
            \nplaceOrderPovPercent(POV算法比例,数字):\n- **字段说明**:每个交易对手实际执行的POV比例\n- **使用场景**:\n\
            \  * 总单场景(有总量):设为null,由后处理脚本自动计算\n  * 普通场景(无总量):直接从用户输入提取\n- **前提条件**:仅当算法类型为POV时解析,否则为null\n\
            \n- **识别规则**(必须满足以下任一条件):\n  1. **POV紧跟数字/百分比(有无空格都可以)**: \"pov50%\"→50,\
            \ \"POV25\"→25, **\"POV 15%\"→15**\n  2. **独立的百分比符号**: \"50%\"→50 | \"\
            限价50%\"✗, \"10\"✗, \"限价10\"✗\n  3. **占/跟量+百分比**: \"占35%\"→35, \"跟量25%\"\
            →25\n\n- **不提取的情况**(全部为null):\n  * 紧跟其他参数的%: \"限价50%\"\n  * 无%符号的纯数字:\
            \ \"10\"、\"限价10\"、\"1\"、\"2\"\n  * ~~POV后有空格: \"POV 50%\"~~ **【修正】**:\
            \ \"POV 15%\"有空格但有%符号→应提取15\n  * 时间格式: \"13:00\"\n  * 数量: \"2100股\"\n\n\
            - 未提供或不适用则为null\n\nplaceOrderStartTime(算法开始时间,字符串,格式HH:MM):\nplaceOrderEndTime(算法结束时间,字符串,格式HH:MM):\n\
            - 从第一行提取时间窗信息\n- **强制格式**: 必须严格按照HH:MM格式输出(小时和分钟都必须是2位数)\n- **补零规则**:\n\
            \  - 单位数小时必须补0: \"9:00\" → \"09:00\", \"9:30\" → \"09:30\"\n  - 单位数分钟必须补0:\
            \ \"15:5\" → \"15:05\", \"9:5\" → \"09:05\"\n- 支持\"HH:MM-HH:MM\"或\"HH:MM到HH:MM\"\
            格式:\n  - 输入: \"9:30-10:30\" → 输出: placeOrderStartTime=\"09:30\", placeOrderEndTime=\"\
            10:30\"\n  - 输入: \"14:00到15:30\" → 输出: placeOrderStartTime=\"14:00\",\
            \ placeOrderEndTime=\"15:30\"\n- 未提供则为null\n\nplaceOrderShortname(交易对手简称,字符串):\n\
            - 从数据行(第2行及以后)提取交易对手名称\n- 每行格式: \"交易对手名称 数量\"\n- 第一个空格前的内容为交易对手名称,第一个空格后的数字为委托数量\n\
            - **必须保留交易对手名称中的所有空格**\n- **交易对手跟随规则**(仅表格模式适用):\n  * **触发条件**: 第1数据行存在交易对手名称（非空、非`-`）\n\
            \  * **规则**: 第2-N行中,凡是交易对手名称为空或`-`的行,placeOrderShortname跟随第1行的值;已明确填写了交易对手的行保持原值不变\n\
            \  * **不触发**: 如果第1数据行交易对手名称为空或`-`,则不进行任何跟随,空行输出null\n  * **例子1**: 第1行为\"\
            千惠盛景一号\",第2-5行都为空 → 第2-5行均填\"千惠盛景一号\"\n  * **例子2**: 第1行为\"对手A\",第2行为空,第3行为\"\
            对手B\",第4行为空 → 第2行=\"对手A\",第3行=\"对手B\",第4行=\"对手A\"\n- 未提供则为null(除跟随规则适用情况外)\n\
            \n【表格格式解析规则】（仅当第0步判定为表格模式时使用）\n\n**步骤1 - 表格模式类型判定**:\n按以下固定优先级判定:\n\n\
            **步骤1A - 按行表格判定**:\n- 将第一行按`|`分割,统计其中命中的已知字段名数量:\n  * \"产品全称\"/\"产品\"\
            /\"产品名称\"\n  * \"卖出数量\"/\"卖出\"\n  * \"买入数量\"/\"买入\"\n  * \"证券代码\"/\"代码\"\
            /\"股票代码\"\n  * 名称类表头: \"证券名称\"/\"股票名称\"/\"标的名称\"/\"证券简称\"/\"股票简称\"/\"\
            标的简称\"/\"名称\"/\"简称\"/\"name\"/\"security name\"/\"stock name\"/\"ticker\
            \ name\"\n- 如果**第一行命中2个及以上字段名** → 判定为**按行表格**\n\n**步骤1B - 按列表格判定**:\n\
            - 仅当步骤1A未命中时执行\n- 从上到下扫描每一行的**第一列**,统计命中的字段名数量:\n  * \"产品全称\"/\"产品\"/\"\
            产品名称\"\n  * \"卖出数量\"/\"卖出\"\n  * \"买入数量\"/\"买入\"\n  * \"证券代码\"/\"代码\"\
            /\"股票代码\"/\"ticker\"\n  * 名称类表头: \"证券名称\"/\"股票名称\"/\"标的名称\"/\"证券简称\"/\"\
            股票简称\"/\"标的简称\"/\"名称\"/\"简称\"/\"name\"/\"security name\"/\"stock name\"\
            /\"ticker name\"\n  * \"价格方式\"/\"价格类型\"/\"价格\"/\"参数\"/\"算法参数\"\n  * \"\
            时间窗\"/\"时间范围\"/\"窗口\"\n  * \"备注\"/\"说明\"/\"remark\"\n- 如果**第一列命中2个及以上字段名**\
            \ → 判定为**按列表格**\n\n**名称类表头归一化规则**:\n- 表头命中\"产品\"/\"产品全称\"/\"账户\"/\"策略\"\
            /\"组合\"/\"对手\"时,优先视为placeOrderShortname相关表头,不归入名称类表头\n- 同一表头若同时命中代码语义与名称语义,代码语义优先\n\
            \n**步骤1C - 无字段名值块判定**:\n- 仅当步骤1A和步骤1B都未命中时执行\n- 此时图片中**不允许**同时存在纵向值块和横向值串两种有效布局\n\
            \n- **特殊情况 — 输入不含任何 `|` 分隔符**:\n  * 将整个输入视为**1个纵向值块**\n  * 每一个非空行视为该值块内的**1个单元格**\n\
            \  * 直接进入步骤2C的字段识别,按**纵向值块模式**处理\n  * 不再扫描行/列方向,不进入横向值串判定\n  * 无 `|` 情况必然归入纵向值块模式\n\
            \n- **行扫描**（仅当输入含 `|` 分隔符时执行）: 将每一个非空行视为一个候选订单块,忽略值为`-`的单元格。若该行满足以下条件,则该行记为1个有效横向值串块:\n\
            \  * 至少识别到以下两类中的两类:\n    - 代码样式值\n    - 证券名称样式值\n    - 数量样式值\n    - 参数样式值或方向样式值\n\
            \    - 文本样式值\n  * 且至少识别到**代码样式值、证券名称样式值、数量样式值中的一种**\n- **列扫描**（仅当输入含 `|`\
            \ 分隔符时执行）: 将每一个非空列视为一个候选订单块,忽略值为`-`的单元格。若该列满足以下条件,则该列记为1个有效纵向值块:\n  *\
            \ 至少识别到以下两类中的两类:\n    - 代码样式值\n    - 证券名称样式值\n    - 数量样式值\n    - 参数样式值或方向样式值\n\
            \    - 文本样式值\n  * 且至少识别到**代码样式值、证券名称样式值、数量样式值中的一种**\n- **方向选择规则**:\n \
            \ * 行有效块数 > 0 且列有效块数 = 0 → 判定为**无字段名横向值串模式**\n  * 列有效块数 > 0 且行有效块数 = 0\
            \ → 判定为**无字段名纵向值块模式**\n  * 行有效块数 > 0 且列有效块数 > 0 → 视为布局混合或方向歧义,不进入无字段名值块模式\n\
            \  * 行有效块数 = 0 且列有效块数 = 0 → 视为未稳定识别到无字段名值块模式\n- **关键**: 现有按行表格、按列表格的优先级高于无字段名值块模式;无字段名模式只能作为最后兜底分支\n\
            \n**步骤2A - 按行表格: 表头解析**:\n将第一行按`|`分割,逐列识别语义:\n- 含\"产品全称\"/\"产品\"/\"产品名称\"\
            \ → **对手名列** → placeOrderShortname\n- 含\"卖出数量\"/\"卖出\" → **数量列** + 委托方向固定为\"\
            SELL\"\n- 含\"买入数量\"/\"买入\" → **数量列** + 委托方向固定为\"BUY\"\n- 含\"证券代码\"/\"\
            代码\"/\"股票代码\" → **标的代码列** → placeOrderWindCode\n- 含名称类表头 → **标的名称列**;\
            \ 当同一行的标的代码列缺失、为空或为`-`时,placeOrderWindCode回退为该列原文; 若代码存在则名称不得覆盖代码\n- 其余列(含`-`或其他)\
            \ → **参数列**,可能包含价格类型、算法、POV比例等信息\n\n**步骤2B - 按列表格: 字段行解析**:\n将每一行按`|`分割,第1列视为字段名,第2列及以后视为订单列:\n\
            - 含\"产品全称\"/\"产品\"/\"产品名称\" → **对手名行** → placeOrderShortname\n- 含\"卖出数量\"\
            /\"卖出\" → **数量行** + 该行非`-`单元格的委托方向固定为\"SELL\"\n- 含\"买入数量\"/\"买入\" → **数量行**\
            \ + 该行非`-`单元格的委托方向固定为\"BUY\"\n- 含\"证券代码\"/\"代码\"/\"股票代码\"/\"ticker\" →\
            \ **标的代码行** → placeOrderWindCode\n- 含名称类表头 → **标的名称行**; 当同一列的标的代码行缺失、为空或为`-`时,placeOrderWindCode回退为该行原文;\
            \ 若代码存在则名称不得覆盖代码\n- 含\"价格方式\"/\"价格类型\"/\"价格\"/\"参数\"/\"算法参数\"/\"时间窗\"\
            /\"时间范围\"/\"窗口\"/\"备注\"/\"说明\"/\"remark\" → **参数行**\n- 其余未命中的行 → 也按**参数行**处理,仅从该行单元格中提取已知参数\n\
            \n**步骤2C - 无字段名值块: 块内字段识别规则**:\n- 根据步骤1C选出的唯一方向处理:\n  * **无字段名横向值串模式**:\
            \ 每个有效非空行 = 1个候选订单块\n  * **无字段名纵向值块模式**: 每个有效非空列 = 1个候选订单块\n- 每个候选订单块内,先忽略所有值为`-`的单元格,再按值型态识别字段:\n\
            \  * **代码样式值**:\n    - 形如\"000001.SZ\"、\"0700.HK\"、\"BABA.N\"、\"COHR.N\"\
            \n    - 或纯大写字母/数字代码如\"COHR\"、\"WDC\"\n    - 但必须排除\"POV\"、\"TWAP\"、\"VWAP\"\
            、\"ICEBERG\"、\"SNIPER\"等算法词\n  * **证券名称样式值**:\n    - 不符合代码/数量/参数/方向规则,且不像产品名/账户名/交易对手名的中文证券名称,如\"\
            贵州茅台\"、\"宁德时代\"、\"招商银行\"\n    - 或中文公司/证券名词样式,如含\"股份\"、\"科技\"、\"集团\"、\"\
            银行\"、\"药业\"、\"电子\"、\"能源\"、\"控股\"等词\n    - 或英文公司名/证券名称样式,如含\"Group\"、\"\
            Corp\"、\"Inc\"、\"Ltd\"、\"Holdings\"、\"Pharma\"、\"Bank\"、\"Tech\"等词\n \
            \   - 命中\"产品\"、\"账户\"、\"策略\"、\"组合\"、\"对手\"、\"计划\"、\"专用\"等产品/账户词时,不得识别为证券名称样式值\n\
            \  * **数量样式值**:\n    - 纯整数,或带千分位逗号的整数,如\"3500\"、\"12,500\"\n    - 可带\"\
            股\"后缀\n    - **不能**包含小数点、百分号、冒号,避免与价格、比例、时间混淆\n  * **方向样式值**:\n    - 含\"\
            买入\"、\"卖出\"、\"卖空\"、\"平空\"\n  * **参数样式值**:\n    - 含\"市价\"、\"限价\"、\"POV\"\
            (包括\"POV 15%\"这样的有空格形式)、\"TWAP\"、\"VWAP\"、\"ICEBERG\"、\"SNIPER\"、\"跟量\"\
            、\"占\"、时间窗等\n    - **【关键】\"POV 15%\"虽然POV后有空格,但整体仍然是参数样式值,应当识别为单个参数,拆解为\
            \ placeOrderAlgorithmType=\"POV\", placeOrderPovPercent=15**\n    - 如果参数行包含多个参数(如\"\
            买入，POV 15%，11:00-15:00\"),逐一拆解后都属于同一个订单\n  * **文本样式值**:\n    - 其余非空文本\n\
            - **候选值收集规则**:\n  * 对每个字段维度收集**去重后的候选值列表**\n  * 标的维度必须分两层收集:\n    - 第一层:\
            \ 代码样式值候选\n    - 第二层: 证券名称样式值候选,只有当代码候选为空时才启用\n  * 出现重复值不算冲突,只有同一维度出现**2个及以上不同候选值**才算该维度冲突\n\
            \  * **【极其重要】参数拆解的同源性检查**:\n    - **必须区分候选值的来源**: 是来自**不同的行/列/单元格**,还是来自**同一行/单元格的参数拆解**\n\
            \    - 当一个单元格(如\"买入，POV 15%，11:00-15:00\")经过参数拆解,得到多个不同维度的值(如\"买入\"→方向维度,\"\
            POV 15%\"→算法维度,\"11:00-15:00\"→时间窗维度)时,这些值**不产生任何冲突**,而是**必须合并到同一个订单对象**\n\
            \    - 只有来自**不同行/列/单元格的不同值**才可能触发冲突维度判定\n    - **冲突维度必须满足**: 同一维度出现2个及以上来自**不同源**的不同候选值\n\
            \  * 字段维度包括:\n    - **标的维度** → placeOrderWindCode(代码候选优先;无代码时使用证券名称候选)\n\
            \    - **数量维度** → placeOrderQuantity\n    - **方向维度** → placeOrderOrderDirection\n\
            \    - **交易对手维度** → placeOrderShortname\n    - **价格维度** → (placeOrderPriceType,\
            \ placeOrderPrice) 作为一组候选\n    - **算法维度** → (placeOrderAlgorithmType,\
            \ placeOrderPovPercent, placeOrderDisplayQty) 作为一组候选\n    - **时间窗维度**\
            \ → (placeOrderStartTime, placeOrderEndTime) 作为一组候选\n- **冲突维度定义**:\n \
            \ * 同一字段维度识别到2个及以上**来自不同源**的不同候选值 → 该维度发生冲突\n  * **来源必须不同**: 来自不同的行,或不同的列,或不同的单元格\n\
            \  * **来源相同的多个值不产生冲突**: 如果多个值来自同一行/同一单元格的参数拆解,它们不是冲突,而是该单元格的**完整描述**\n\
            \  * 例如:\n    - 两行分别有两个不同代码 → 标的维度冲突\n    - 两行分别有两个不同数量 → 数量维度冲突\n   \
            \ - 两行分别有两个不同价格 → 价格维度冲突\n    - 两行分别有两个不同时间窗 → 时间窗维度冲突\n    - 两行分别有两个不同方向\
            \ → 方向维度冲突\n    - **反例**: 同一行中\"买入，POV 15%，11:00-15:00\"虽然包含方向、算法、时间窗,但这些来自同一源,不产生冲突\n\
            \  * 缺失字段**不是冲突**,只表示该字段候选值为空\n- **placeOrderShortname识别规则**:\n  * 文本样式值中,含\"\
            号\"、\"产品\"、\"账户\"、\"策略\"、\"组合\"、\"对手\"、\"计划\"、\"专用\"、\"测试\"、\"增强\"、\"\
            精选\"、\"套利\"、\"配置\"、\"盛景\"、\"臻选\"等产品/账户词 → 优先识别为placeOrderShortname\n \
            \ * 英文公司名、常见证券名称样式(如\"Alibaba Group\"、\"Coherent Corp\") → 视为证券名称样式值;如果同块没有代码,可作为placeOrderWindCode的后备来源\n\
            \  * 如果同一文本既像产品名又像证券名称,优先按placeOrderShortname处理\n  * 如果没有明显产品名文本,placeOrderShortname允许为null\n\
            \n**步骤3A - 按行表格: 数据行解析**:\n从第2行开始,每行按`|`分割,根据表头列映射提取字段,每行创建一个独立订单对象。\n\
            \n**【逐行独立判断 — placeOrderWindCode】**（高频遗漏点,必须严格执行）:\n- **每一行的placeOrderWindCode必须独立判断,严禁从上一行或其他行复制**\n\
            - 同一行若标的代码列非空且非`-` → placeOrderWindCode取**该行自己的**代码列值\n- 否则若标的名称列非空且非`-`\
            \ → placeOrderWindCode取**该行自己的**名称列原文（这就是名称fallback规则）\n- 否则 → placeOrderWindCode\
            \ = null\n- **典型场景**: 同一张表中前几行有代码,最后一行代码为`-`但证券名称列有值 → 最后一行必须fallback到名称,不得复制前一行的代码\n\
            \n**步骤3B - 按列表格: 订单列解析**:\n从第2列开始,每一列创建一个独立订单对象:\n- 同一列中的各字段行值,合并到同一个订单对象\n\
            - 同一列若标的代码行非空且非`-` → placeOrderWindCode取代码行\n- 否则若标的名称行非空且非`-` → placeOrderWindCode取名称行原文\n\
            - 否则 → placeOrderWindCode = null\n- 单元格值为`-`时,表示该字段在该订单中未提供\n- 如果某一整列除字段名外全部为`-`,则该列不创建订单对象\n\
            \n**步骤3C - 无字段名值块: 订单创建规则**:\n- 每个通过步骤2C校验的候选订单块,默认先构造1个基础订单对象\n- **缺失字段规则**:\n\
            \  * 某字段候选值为空 → 该字段设为null,但订单对象仍然保留\n- **【极其重要】参数行中的多个参数不构成冲突**:\n  *\
            \ 参数行如\"买入，POV 15%，11:00-15:00\"中的多个参数是**逐一拆解后的结果**,而非冲突\n  * \"买入\"是方向、\"\
            POV 15%\"是算法、\"11:00-15:00\"是时间窗\n  * 这些来自**同一行**,应当**合并到同一订单**,不得作为冲突展开\n\
            \  * **绝对禁止**将参数行中的不同参数视为冲突维度而展开成多个订单\n- **单维冲突展开规则**:\n  * **前置条件**:\
            \ 冲突候选值必须来自**不同的行/列/单元格**（来源不同）\n  * **不满足前置条件的情况**（来源相同）→ **绝对禁止展开**,必须合并到同一订单\n\
            \  * 如果一个块内只有**1个字段维度**发生冲突(且冲突来源不同),且其他字段维度都是唯一值或缺失值 → 将该块展开成N笔订单\n \
            \ * N = 该冲突维度的候选值数量\n  * 展开后的每笔订单共享所有非冲突字段,只在该冲突维度上取不同值\n  * 示例:\n   \
            \ - 两个价格(来自两行或两个单元格) → 生成两笔订单,只是placeOrderPrice不同\n    - 两个代码(来自两行或两个单元格)\
            \ → 生成两笔订单,只是placeOrderWindCode不同\n    - 两个数量(来自两行或两个单元格) → 生成两笔订单,只是placeOrderQuantity不同\n\
            \    - 两个时间窗(来自两行或两个单元格) → 生成两笔订单,只是placeOrderStartTime/placeOrderEndTime不同\n\
            \  * **反例（禁止展开）**: \n    - 同一参数行中的多个参数(如\"买入，POV 15%，11:00-15:00\")虽然包含不同维度的值,但来源相同→\
            \ **合并到1笔订单,不展开**\n    - 单个单元格\"限价100\"虽然产生价格维度的候选值,但只有1个来源→ **不展开**\n\
            - **多维冲突回退规则**:\n  * **前置条件**: 冲突必须来自**不同的行/列/单元格**（多维冲突的定义同单维）\n  * 如果同一块内有**2类及以上字段维度**同时冲突(且冲突来源都不同)\
            \ → 不展开,仍只创建1笔订单\n  * 所有发生冲突的字段统一设为null\n  * 未冲突字段按唯一值正常写入\n  * **注意**:\
            \ 来源相同的多个值(如同一行的参数拆解)不产生任何冲突(单维或多维)\n- **字段写入规则**:\n  * 标的维度:\n    - 唯一代码候选值\
            \ → placeOrderWindCode = 该代码\n    - 代码候选为空且唯一证券名称候选值 → placeOrderWindCode\
            \ = 该名称原文\n    - 代码和名称都缺失 → placeOrderWindCode = null\n    - 单维冲突且触发展开\
            \ → 每笔订单分别使用不同代码;若无代码则分别使用不同证券名称\n    - 多维冲突中的冲突维度 → placeOrderWindCode\
            \ = null\n  * 数量维度:\n    - 唯一候选值 → placeOrderQuantity = 该值\n    - 缺失 →\
            \ placeOrderQuantity = null\n    - 单维冲突且触发展开 → 每笔订单分别使用不同数量\n    - 多维冲突中的冲突维度\
            \ → placeOrderQuantity = null\n  * 方向维度:\n    - 唯一候选值 → 按\"买入\"/\"卖出\"\
            /\"卖空\"/\"平空\"映射\n    - 缺失 → placeOrderOrderDirection = null\n    - 单维冲突且触发展开\
            \ → 每笔订单分别使用不同方向\n    - 多维冲突中的冲突维度 → placeOrderOrderDirection = null\n\
            \  * 交易对手维度:\n    - 唯一候选值 → placeOrderShortname = 该值\n    - 缺失 → placeOrderShortname\
            \ = null\n    - 单维冲突且触发展开 → 每笔订单分别使用不同交易对手\n    - 多维冲突中的冲突维度 → placeOrderShortname\
            \ = null\n  * 价格维度:\n    - 唯一候选值组 → placeOrderPriceType / placeOrderPrice\
            \ 使用该组\n    - 缺失 → placeOrderPriceType = null, placeOrderPrice = null\n\
            \    - 单维冲突且触发展开 → 每笔订单分别使用不同价格组\n    - 多维冲突中的冲突维度 → placeOrderPriceType\
            \ = null, placeOrderPrice = null\n  * 算法维度:\n    - 唯一候选值组 → placeOrderAlgorithmType\
            \ / placeOrderPovPercent / placeOrderDisplayQty 使用该组\n    - 缺失 → 相关字段为null\n\
            \    - 单维冲突且触发展开 → 每笔订单分别使用不同算法组\n    - 多维冲突中的冲突维度 → 相关字段为null\n  * 时间窗维度:\n\
            \    - 唯一候选值组 → placeOrderStartTime / placeOrderEndTime 使用该组\n    - 缺失\
            \ → 相关字段为null\n    - 单维冲突且触发展开 → 每笔订单分别使用不同时间窗组\n    - 多维冲突中的冲突维度 → placeOrderStartTime\
            \ = null, placeOrderEndTime = null\n- **绝对禁止**跨块继承、跨行继承、跨列继承\n\n**步骤4\
            \ - 表格参数解析**:\n对按行表格的参数列内容、按列表格的参数行单元格内容、以及无字段名值块中的参数样式值(如\"市价，跟量5%\"\
            ),按以下规则拆解:\n- \"市价\"/\"市价委托\" → placeOrderPriceType = \"MarketOrder\"\n\
            - \"限价\"/\"限价委托\" → placeOrderPriceType = \"LimitOrder\"\n- \"限价X\"/\"\
            限价X.X\" → placeOrderPriceType = \"LimitOrder\", placeOrderPrice = X\n\
            - \"跟量X%\"/\"占X%\"/\"POV X%\"/\"povX%\"/\"POVX%\" → placeOrderAlgorithmType\
            \ = \"POV\", placeOrderPovPercent = X\n  * **关键**: \"POV 15%\"中的15%(独立百分比)应提取为15,不因空格而拒绝\n\
            \  * 包括以下所有模式: \"POV15%\"✓, \"POV 15%\"✓, \"pov15%\"✓, \"pov 15%\"✓\n\
            - \"TWAP\"/\"VWAP\" 等 → placeOrderAlgorithmType = 对应值\n- **ICEBERG冰山算法显示数量识别**:\n\
            \  * \"ICEBERG，X\" 或 \"ICEBERG X\"（X为不带%不带\"股\"的纯数字） → placeOrderAlgorithmType\
            \ = \"ICEBERG\", placeOrderDisplayQty = X\n  * 紧跟在 ICEBERG 后面的数字是冰山算法的**显示数量**,不是总委托数量\n\
            \  * 此时该数字不得再被识别为数量样式值,也不得与其他位置的数量形成冲突\n- \"HH:MM-HH:MM\" → placeOrderStartTime,\
            \ placeOrderEndTime\n- 多个参数可能用逗号(，)或空格连接,需逐一拆解(如\"市价，跟量5%\"拆为\"市价\"+\"\
            跟量5%\"; \"买入，POV 15%，11:00-15:00\"拆为\"买入\"+\"POV 15%\"+\"11:00-15:00\"\
            )\n- **【极其重要】参数拆解后的多个参数来自同一行/单元格,应合并到同一订单**:\n  * 示例: \"买入，POV 15%，11:00-15:00\"\
            拆解为三个参数\n    - \"买入\" → placeOrderOrderDirection = \"BUY\"\n    - \"POV\
            \ 15%\" → placeOrderAlgorithmType = \"POV\", placeOrderPovPercent = 15\n\
            \    - \"11:00-15:00\" → placeOrderStartTime = \"11:00\", placeOrderEndTime\
            \ = \"15:00\"\n  * 这些参数都写入**同一个订单对象**,不产生冲突或展开\n- **无字段名值块模式特别规则**:\n\
            \  * 不要只取第一个命中的参数值,必须收集该块内每个字段维度的全部候选值\n  * \"限价88.2\" 会同时产生一个价格维度候选值组:\
            \ (LimitOrder, 88.2)\n  * \"市价\" 会产生一个价格维度候选值组: (MarketOrder, null)\n\
            \  * \"TWAP\"、\"POV 15%\" 等会产生算法维度候选值组(注意: \"POV 15%\"中的空格不影响识别)\n  *\
            \ 每一个\"HH:MM-HH:MM\"都产生一个时间窗维度候选值组\n  * **关键**: 同一行/单元格中拆解出的多个参数应合并,不作为冲突\n\
            \n**步骤5A - 按行表格共享参数继承规则**:\n当某数据行的参数列值为`-`时:\n- **继承第1数据行同列的解析结果**(价格类型、限价、算法类型、POV比例、算法开始时间、算法结束时间)\n\
            - **不继承的列**: 产品全称、数量、证券名称类列、证券代码列(这些是每行独有的)\n\n**步骤5A+ - 按行表格交易对手名称继承规则**:\n\
            当某数据行的产品全称(交易对手名称)字段为空或`-`时:\n- **若第1数据行存在交易对手名称（非空、非`-`）**,则该行placeOrderShortname跟随第1数据行的值\n\
            - **若第1数据行交易对手名称为空或`-`**,则该行placeOrderShortname = null\n\n**步骤5B - 按列表格共享参数继承规则**:\n\
            当某订单列的参数行单元格值为`-`时:\n- **继承该参数行左侧最近一个非`-`单元格的解析结果**(价格类型、限价、算法类型、POV比例、算法开始时间、算法结束时间)\n\
            - **不继承的行**: 产品全称、数量、证券名称类行、证券代码行(这些是每列独有的)\n\n**步骤5B+ - 按列表格交易对手名称继承规则**:\n\
            当某订单列的产品全称(交易对手名称)行单元格为空或`-`时:\n- **若产品全称行的第1订单列（最左列）存在交易对手名称（非空、非`-`）**,则该列placeOrderShortname跟随第1订单列的值\n\
            - **若第1订单列交易对手名称为空或`-`**,则该列placeOrderShortname = null\n\n**步骤5C - 无字段名值块模式继承规则**:\n\
            - 无字段名值块模式**不允许任何继承**\n- 某个块里没出现的字段,直接输出null\n- 不得因为相邻块出现了价格/算法/方向,就自动补给当前块\n\
            \n**步骤6 - 数量格式处理**:\n- 去除千分位逗号: \"2,212\" → 2212\n- 去除\"股\"等单位后缀\n- 确保为整数\n\
            - 执行数量格式处理前必须先排除符合【@限价记号保护规则】的 `@数字` 片段；该数字只用于价格，不参与数量格式化\n\n**步骤7 - 表格模式下不适用的字段(固定为null)**:\n\
            - placeOrderQuantityTotal → null（表格模式无总量概念,每行/每列/每块独立）\n- placeOrderTotalPovPercent\
            \ → null（同上）\n- placeOrderTransactionType → null（除非表头、数据或值块中明确包含\"A股\"\
            /\"港股\"等标识）\n\n**步骤7+ - 表格模式下价格类型的零默认规则**:\n- 如果参数列/参数行/值块中**既无\"限价\"\
            也无\"市价\"**明确提供,则 **placeOrderPriceType=null**，由后端按交易品种兜底\n- 示例: 表格某行为\"\
            -\"(无参数)或完全空白 → placeOrderPriceType = null\n\n---\n\n【文本内容解析规则】（仅当第0步判定为文本模式时使用）\n\
            \n**文本模式入口前提**:\n- 仅当**首个非空行**命中文本总单候选时,才能进入文本模式\n- 命中文本模式后,`|` 只视为OCR行内分隔残留,**不是**表格证据\n\
            - 如果第2行及以后再次出现新的文本总单候选行,说明OCR顺序异常; **本次不自动重排**,该输入不满足文本模式前提\n\n**文本总单候选行定义**:\n\
            - 仅检查**首个非空行**（以下简称\"该行\"）\n- 如果该行包含 `|`,先以**第一个 `|` 左侧主串**作为文本总单候选判断主体;\
            \ 右侧部分按后续规则处理\n- **关键: 仅凭该行自身内容判断,严禁借用第2行及以后的任何信号**\n\n- **第一步 — 零信号快速排除**:\n\
            \  先扫描该行,统计其命中的**订单信号类别数**（类别定义见下方）。\n  如果该行命中的订单信号类别数 = 0,则**直接判定为非文本总单候选,立即排除**,无需继续后续判断。\n\
            \  这是最关键的防线——任何不含订单关键词的首行（无论是交易对手名称、股票简称、还是其他任意文本）都会在这一步被拦截。\n\n- **第二步\
            \ — 信号丰度检查（必须同时满足全部3个子条件）**:\n  * **子条件A**: 该行的订单信号类别数 **>= 3**\n  * **子条件B**:\
            \ 至少命中 **标的信号** 或 **总量信号**\n  * **子条件C**: 至少命中以下执行控制信号中的 **1类**: 交易方向\
            \ / 价格信号 / 算法信号 / 时间窗信号\n\n- **订单信号类别定义**（共6类,用于上述各步的信号计数）:\n  * 交易方向:\
            \ \"买入\"、\"卖出\"、\"卖空\"、\"平空\"\n  * 总量信号: 带\"股\"的数量（如\"900股\"、\"35000股\"\
            ）\n  * 标的信号: 明确标的代码（如000560.SZ、0700.HK、AAPL）,或市场类型+标的代码（如\"A股000560.SZ\"\
            ）\n  * 价格信号: \"市价\"、\"限价\"、\"限价X\"（X为数字）\n  * 算法信号: \"POV\"、\"TWAP\"、\"\
            VWAP\"、\"ICEBERG\"、\"SNIPER\"、\"跟量\"、\"占\"\n  * 时间窗信号: \"HH:MM-HH:MM\"\
            \ 等时间范围格式\n  **注意**: 不带\"股\"的纯数字（如\"1300\"）**不算**总量信号; 不在上述关键词列表中的普通中文词（如\"\
            测试短名\"、\"专用\"、\"臻选\"）**不算**任何信号\n\n- **第三步 — 数据行排除**:\n  * 如果该行形如 `短名\
            \ | 数量`、`短名 | -`、`短名 数量`,且左侧主串本身不满足上述至少2类订单信号 → 不是文本总单候选\n  * 仅有交易对手简称+数量,或仅有简称/账户名的首行,都不是文本总单候选\n\
            \  * 只有\"标的代码 + 数量\"、只有\"方向 + 数量\"、只有\"价格 + 数量\"等两类信号的首行,默认也不是文本总单候选;\
            \ 文本模式首行应表现为**多参数总单行**\n\n- **判断流程总结**: 第一步(零信号?) → 第二步(信号>=3且满足子条件?)\
            \ → 第三步(数据行?) → 全部通过才是文本总单候选\n\n**反例 — 首行不含订单信号的输入**:\n\n输入:\n```\n11125测试短名（张天琪专用）\n\
            1300\nLKQ\nLKQ\n限价10\n买入，ICEBERG，10，14:00-15:00\n```\n\n判断过程:\n- 首个非空行:\
            \ `11125测试短名（张天琪专用）`\n- 第一步: 扫描该行,命中的订单信号类别数 = 0（无买入/卖出、无\"X股\"、无标的代码、无市价/限价、无算法关键词、无时间窗）→\
            \ **命中零信号快速排除,直接判定为非文本总单候选**\n- 结论: 不进入文本模式,转入表格模式判定\n\n**正例 — 合法的总单候选首行**:\n\
            - `限价10 卖出000560.SZ 35000股，跟量3%` → 信号: 价格信号+方向+标的+总量+算法 = 5类 ✓\n- `市价\
            \ 买入000001.SZ 700股，跟量3%，17:00-17:20` → 信号: 价格+方向+标的+总量+算法+时间窗 = 6类 ✓\n\
            - `A股000560.SZ 买入 600股 限价 1` → 信号: 标的+方向+总量+价格 = 4类 ✓\n\n**输入格式结构**:\n\
            ```\n首个非空行(总单信息): 标的代码 方向 总量 价格类型/价格 算法类型 POV比例 时间窗\n第2行及以后(数据行): 交易对手1\
