    - data:
        code: "/**\n * 平仓参数提取 - 合并输出（代码节点2）\n *\n * 将代码节点1解析出的成功订单与LLM提取的用户订单合并为最终输出。\n\
          \ *\n * 输入：\n *   - messageType: \"holding_list\" | \"close_result\"\n *\
          \   - successOrders: 成功订单数组（含完整参数）\n *   - closeOrderList: LLM节点输出的订单数组\n\
          \ */\nfunction main({ messageType, successOrders, closeOrderList }) {\n\t\
          // 解析closeOrderList（可能是字符串，含 ```json\\n...\\n``` 包裹格式）\n\tlet llmOrders\
          \ = closeOrderList;\n\tif (typeof closeOrderList === \"string\") {\n\t\t\
          try {\n\t\t\t// 去除 think/tool_call 块（含残缺标签）\n\t\t\tlet cleaned = closeOrderList\n\
          \t\t\t\t.replace(/<think>[\\s\\S]*?<\\/think>/g, \"\")\n\t\t\t\t.replace(/<tool_call>[\\\
          s\\S]*?<\\/tool_call>/g, \"\")\n\t\t\t\t.replace(/<\\/?(think|tool_call)>/g,\
          \ \"\")\n\t\t\t\t.trim();\n\t\t\t// 提取 markdown 代码块，或直接定位 JSON\n\t\t\tconst\
          \ fenceMatch = cleaned.match(/```(?:json)?\\s*([\\s\\S]*?)\\s*```/);\n\t\
          \t\tlet jsonStr;\n\t\t\tif (fenceMatch) {\n\t\t\t\tjsonStr = fenceMatch[1];\n\
          \t\t\t} else {\n\t\t\t\tconst jsonStart = cleaned.indexOf('{\"closeOrderList\"\
          ');\n\t\t\t\tjsonStr = jsonStart >= 0 ? cleaned.slice(jsonStart) : cleaned;\n\
          \t\t\t}\n\t\t\tconst parsed = JSON.parse(jsonStr.trim());\n\t\t\tllmOrders\
          \ = Array.isArray(parsed) ? parsed : (parsed.closeOrderList ?? []);\n\t\t\
          } catch (e) {\n\t\t\tllmOrders = [];\n\t\t}\n\t}\n\tif (!Array.isArray(llmOrders))\
          \ {\n\t\tllmOrders = [];\n\t}\n\n\t// 解析successOrders（可能是字符串）\n\tlet parsedSuccessOrders\
          \ = successOrders;\n\tif (typeof successOrders === \"string\") {\n\t\ttry\
          \ {\n\t\t\tparsedSuccessOrders = JSON.parse(successOrders);\n\t\t} catch\
          \ (e) {\n\t\t\tparsedSuccessOrders = [];\n\t\t}\n\t}\n\tif (!Array.isArray(parsedSuccessOrders))\
          \ {\n\t\tparsedSuccessOrders = [];\n\t}\n\n\t// 路径A（持仓列表）：直接使用LLM输出\n\t\
          if (messageType !== \"close_result\") {\n\t\treturn {\n\t\t\tcloseOrderList:\
          \ llmOrders.filter(\n\t\t\t\t(o) => o.internalTradeId || o.orderId,\n\t\t\
          \t),\n\t\t};\n\t}\n\n\t// 路径B（平仓结果消息）：成功订单 + LLM提取的用户订单\n\t// 同ID时以LLM版本为准（LLM包含用户修改的参数，successOrders除orderId外均为null）\n\
          \tconst llmOrderIds = new Set(llmOrders.map((o) => o.orderId));\n\tconst\
          \ remainingSuccessOrders = parsedSuccessOrders.filter(\n\t\t(o) => !llmOrderIds.has(o.orderId),\n\
          \t);\n\n\tconst mergedList = [...remainingSuccessOrders, ...llmOrders].filter(\n\
          \t\t(o) => o.orderId || o.internalTradeId,\n\t);\n\n\treturn {\n\t\tcloseOrderList:\
          \ mergedList,\n\t};\n}\n"
        code_language: javascript
        outputs:
          closeOrderList:
            children: null
            type: array[object]
