    - data:
        code: "\nfunction main({closeOrderList = [], insFamilyList = [], contractTypeList\
          \ = [],closeable_only,confirmOrderNoList = [],cancelOrderNoList = [],confirmCancelOrderNoList\
          \ = [],internalTradeIdList = [],queryOrderNoList = [],keyCtptyIdList = [],underlyingInsIdList\
          \ = [],underlyingInsNameList = []}) {\n    const cleanunderlyingInsId =\
          \ Array.isArray(underlyingInsIdList)\n        ? underlyingInsIdList.filter(v\
          \ => typeof v === 'string' && v.trim() !== '')\n        : [];\n    const\
          \ cleanunderlyingInsName = Array.isArray(underlyingInsNameList)\n      \
          \  ? underlyingInsNameList.filter(v => typeof v === 'string' && v.trim()\
          \ !== '')\n        : [];\n\n    const cleanInsFamily = Array.isArray(insFamilyList)\n\
          \        ? insFamilyList.filter(v => typeof v === 'string' && v.trim() !==\
          \ '')\n        : [];\n\n    const cleanContractType = Array.isArray(contractTypeList)\n\
          \        ? contractTypeList.filter(v => typeof v === 'string' && v.trim()\
          \ !== '')\n        : [];\n\n    const cleankeyCtptyId = Array.isArray(keyCtptyIdList)\n\
          \        ? keyCtptyIdList\n        : [];\n\n    const closeOrderListType\
          \ = Array.isArray(closeOrderList)\n        ? closeOrderList.filter(v =>\
          \ v != null && typeof v === 'object')\n        : [];\n\n     const confirmOrderNoListType\
          \ = Array.isArray(confirmOrderNoList)\n        ? confirmOrderNoList.filter(v\
          \ => typeof v === 'string' && v.trim() !== '')\n        : [];\n\n    const\
          \ cancelOrderNoListType = Array.isArray(cancelOrderNoList)\n        ? cancelOrderNoList.filter(v\
          \ => typeof v === 'string' && v.trim() !== '')\n        : [];\n        \n\
          \    const confirmCancelOrderNoListType = Array.isArray(confirmCancelOrderNoList)\n\
          \        ? confirmCancelOrderNoList.filter(v => typeof v === 'string' &&\
          \ v.trim() !== '')\n        : [];\n    \n    const internalTradeIdListType\
          \ = Array.isArray(internalTradeIdList)\n        ? internalTradeIdList.filter(v\
          \ => typeof v === 'string' && v.trim() !== '')\n        : [];\n\n    const\
          \ queryOrderNoListType = Array.isArray(queryOrderNoList)\n        ? queryOrderNoList.filter(v\
          \ => typeof v === 'string' && v.trim() !== '')\n        : [];\n\n    return\
          \ {\n        result: {\n            contractQuery: {\n                insFamilyList:\
          \ cleanInsFamily,\n                contractTypeList: cleanContractType,\n\
          \                allowCloseOut: closeable_only == null ? true : closeable_only,\n\
          \                internalTradeIdList:internalTradeIdListType,\n        \
          \        keyCtptyIdList: cleankeyCtptyId,\n                underlyingInsIdList:\
          \ cleanunderlyingInsId,\n                underlyingInsNameList: cleanunderlyingInsName\n\
          \n            },\n            closeOrderList:closeOrderListType,\n     \
          \       confirmOrderNoList:confirmOrderNoListType,\n            cancelOrderNoList:cancelOrderNoListType,\n\
          \            confirmCancelOrderNoList: confirmCancelOrderNoListType,\n \
          \           queryOrderNoList: queryOrderNoListType\n        }\n    }\n}\n"
