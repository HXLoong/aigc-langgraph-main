            - 可用匹配规则：`CO-\\d{8}-[A-Za-z0-9]{8}`\n\n# 提取规则\n1. 仅从「用户输入内容」提取，禁止编造。\n\
            2. 提取所有命中的订单号；若有重复，去重后保留首次出现顺序。\n3. 订单号大小写不敏感识别，输出时统一转为大写。\n4. 若未提取到任何订单号，输出空数组。\n\
            \n# 输出格式\n仅输出严格 JSON，不要输出任何解释文字或其他内容：\n\n```json\n{\n  \"queryOrderNoList\"\
            : [\"CO-20260305-59772C14\", \"CO-20260305-4526F776\"]\n}\n```\n"
