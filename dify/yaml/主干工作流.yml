    - data:
        code: "# -*- coding: utf-8 -*-\n\"\"\"\nDify code 节点 2 —— 期权快速询价（参与型看涨 / 雪球，调参询价）\n\
          ================================================================\n本节点合并了原来的两个节点，一个\
          \ code 节点搞定：\n  - 替换：tool（场外交易-期权工具，快速询价侧，传 inventory_instruction='存量指令'）\n\
          \  - 并入：下游「参与型看涨、雪球调询价指令返回JSON解析」(17565345058440) 的解析逻辑\n=> 直接输出最终字段，省掉那个返回解析节点。\n\
          \n输出变量（5 个，对齐原返回解析节点；下游零改动，直接接本节点）：\n  code         number\n  result   \
          \    string\n  intent       string\n  orderList    array[object]\n  productType\
          \  number\n\n输入变量（12 个，一行一个配置）：\n  llmText        <- 参与型看涨、雪球调询价参数解析 / api_data_result_obj\n\
          \                    (1756520149629，已改为 data 对象；本节点不再需要 json.loads)\n  conversationId\
          \ <- 开始 / conversation_id              (1755072621769)\n  messageId    \
          \  <- 开始 / message_id\n  query          <- sys.query\n  quoteAppinfo   <-\
          \ 开始 / quote_appinfo\n  roomId         <- 开始 / room_id\n  guid         \
          \  <- 开始 / guid\n  userId         <- sys.user_id\n  apiUrl         <- env.api_url\n\
          \  otc_secret     <- env.otc_secret\n  rawContent     <- 开始 / raw_content\n\
          \  quoteContent   <- 开始 / quote_content\n  errMsg         <-参与型看涨、雪球调询价参数解析\
          \ / errMsg\n\n说明：\n  - llmText 现在引用上游 api_data_result_obj（data 对象）；若仍连旧的\n\
          \    api_data_result_str（字符串）也兼容（下面 isinstance 兜底）。\n  - optionRfq 必须是对象(dict)。\n\
          \  - operate / type 按原期权工具“存量分支”实现写死，语义存疑，上线前请与后端确认。\n\"\"\"\nimport json\n\
          import requests\n\n\ndef main(\n        llmText,\n        conversationId,\n\
          \        messageId,\n        query,\n        quoteAppinfo,\n        roomId,\n\
          \        guid,\n        userId,\n        apiUrl,\n        otc_secret,\n\
          \        rawContent,\n        quoteContent,\n        errMsg) -> dict:\n\
          \    if errMsg:\n        return {\n            \"code\": 500,\n        \
          \    \"intent\": \"new_inquiry\",\n            \"orderList\": [],\n    \
          \        \"productType\": 0,\n            \"result\": errMsg,\n        }\n\
          \n    # llmText 优先是 data 对象(dict)；若上游仍传字符串则解析兜底。\n    if isinstance(llmText,\
          \ str):\n        try:\n            optionRfq = json.loads(llmText) if llmText.strip()\
          \ else {}\n        except Exception:\n            optionRfq = {}\n    else:\n\
          \        optionRfq = llmText or {}\n\n    url = f\"{apiUrl}/admin-api/financial-orders/operate\"\
          \n    headers = {\"Content-Type\": \"application/json\", \"Authorization\"\
          : otc_secret}\n    payload = {\n        \"conversationId\": conversationId,\n\
          \        \"messageId\": messageId,\n        \"messageContent\": query,\n\
          \        \"quoteAppinfo\": quoteAppinfo,\n        \"roomId\": roomId,\n\
          \        \"guid\": guid,\n        \"userId\": userId,\n        \"type\"\
          : \"new_inquiry\",  # 照搬期权工具存量分支硬编码\n        \"operate\": \"询价\",  # 照搬期权工具存量分支硬编码（语义存疑）\n\
          \        \"orderList\": [],\n        \"optionRfq\": optionRfq,\n       \
          \ \"rawContent\": rawContent,\n        \"quoteContent\": quoteContent,\n\
          \    }\n\n    code = None\n    result = \"\"\n    try:\n        resp = requests.post(url,\
          \ json=payload, headers=headers, timeout=60)\n        resp.raise_for_status()\n\
          \        parsed = resp.json()\n        code = parsed.get(\"code\")\n   \
          \     if code == 0:\n            result = parsed.get(\"data\", \"\")\n \
          \       elif code == 500:\n            result = \"交易指令服务暂不可用\"\n       \
          \ else:\n            result = parsed.get(\"msg\", \"未知错误\")\n    except\
          \ Exception:\n        code = 500\n        result = \"交易指令服务暂不可用\"\n\n  \
          \  # 并入原「返回JSON解析」逻辑，直接输出最终字段\n    return {\n        \"code\": code,\n \
          \       \"intent\": \"new_inquiry\",\n        \"orderList\": [],\n     \
          \   \"productType\": 0,\n        \"result\": result,\n    }\n"
        code_language: python3
