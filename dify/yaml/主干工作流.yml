          \n\"\"\"\n\n脚本判断期权、互换指令\n\n\"\"\"\n\nfrom typing import List, Dict, Optional\n\
          import re\n\n# 期权平仓订单号/合约编号正则模式\n#   平仓单号格式：CO-YYYYMMDD-XXXXXXXX（后缀为8位大写十六进制）\n\
          #   合约编号格式：OPT/OPTG + 大写字母 + 数字（如 OPTG-SZZSCF20250030、OPT-LYAFT20260001）\n\
          OPTION_CLOSE_ORDER_PATTERN = r'CO-\\d{8}-[0-9A-F]{8}|OPTG?-[A-Z]{4,8}\\\
          d{6,10}'\n\n# 互换订单号正则：H-YYYYMMDD-{10位数字}（后端 SwapOrderIdGenerator 生成）\nSWAP_ORDER_PATTERN\
          \ = r'H-\\d{8}-\\d{10}'\n\n# 期权开仓/报价单号正则：Q-YYYYMMDD-{10位数字}（后端 FinancialOrdersServiceImpl\
          \ 生成）\nOPTION_OPEN_ORDER_PATTERN = r'Q-\\d{8}-\\d{10}'\n\n# 口语化平仓表达正则模式（仅在\
          \ query 和 quote_content 都不包含期权平仓订单号/合约编号时启用）\n#   命中任一即归入\"互换-文本\"——这类表达是互换头寸口语化减仓,与期权平仓订单无关\n\
          #   不识别\"平到剩X\"\"留X万\"等剩余目标语义(交给后续节点按缺参处理)\nCOLLOQUIAL_SWAP_CLOSE_PATTERNS:\
          \ List[str] = [\n    r\"平\\s*\\d+(?:\\.\\d+)?\\s*%\",           # 平30%,\
          \ 平 30%, 平30.5%\n    r\"平掉\\s*\\d+(?:\\.\\d+)?\\s*%\",         # 平掉30%\n\
          \    r\"以\\s*\\d+(?:\\.\\d+)?\\s*%\\s*平\",      # 以30%平、以30%平仓\n    r\"\
          平[一二三四五六七八九十1-9]\\s*成\",  # 平三成、平5成、平 三 成\n    r\"平一半\",\n    r\"半仓\",\n\
          \    r\"平[一二三四五六七八九十1-9]+\\s*分之\\s*[一二三四五六七八九十1-9]+\",  # 平三分之一、平四分之三\n\
          \    r\"平\\s*\\d+\\s*/\\s*\\d+\",                # 平1/4、平 1 / 4\n    r\"\
          全平\",\n    r\"全部平仓\",\n    r\"全部平了\",\n    r\"平\\s*\\d+\",             \
          \             # 平700、平100、平100手、平100股、平100w\n    r\"平仓\\s*\\d+\",      \
          \                  # 平仓300、平仓800、平仓100手\n]\n\n# 期权平仓持仓查询关键词（quote_content\
          \ 为空时使用，用于识别用户查询持仓的意图）\nOPTION_CLOSE_QUERY_KEYWORDS: List[str] = [\n   \
          \ \"我想平仓\",\n    \"我要平仓\",\n    \"帮我平仓\",\n    \"想平仓\",\n    \"要平仓\",\n\
