            \ price、不参与本数量单位判定；其余含手→HAND落quantity、含股→SHARE落quantity、含元或金额量词或数字紧贴ISO币种码→AMOUNT落notional、纯数字→null落quantity，单位字符优先于量词）；notionalCurrency\
            \ 仅 AMOUNT 场景识别（复合币种词优先，数字紧贴 ISO 码原样大写落币种，其余元/人民币，其他仅量词→null；港股/美股/A股等市场词和\
            \ .HK/.N/.O/.SH/.SZ 等市场后缀不算币种），非 AMOUNT 必须 null。"
