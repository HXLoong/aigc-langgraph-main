          跨境期货\", \"期货\",\n    \"交易方向\", \"开仓\", \"平仓\", \"空\", \"买入\", \"卖出\", \"\
          卖空\", \"平空\", \"买\", \"卖\", \"手\",\n    \"H-\",\n    \"POV\", \"TWAP\",\
          \ \"VWAP\", \"ICEBERG\", \"SNIPER\",\n]\n\nEXCEL_EXTENSIONS = {\".xls\"\
          , \".xlsx\"}\nEXCEL_MIME_TYPES = {\n    \"application/vnd.ms-excel\",\n\
          \    \"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\"\
          \n}\n\n\ndef _clean_text(text: str) -> str:\n    \"\"\"\n    清理文本中的UUID\n\
          \n    规则：\n    1. 直接匹配并删除UUID格式的内容\n    2. UUID格式: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx\
          \ (8-4-4-4-12个十六进制字符)\n\n    Args:\n        text: 原始文本\n\n    Returns:\n\
          \        清理后的文本\n    \"\"\"\n    if not text:\n        return text\n\n \
          \   # 直接匹配UUID格式(可能在括号中)\n    # UUID标准格式: 8-4-4-4-12 个十六进制字符\n    uuid_pattern\
          \ = r'\\([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}\\\
          )'\n\n    # 移除UUID\n    cleaned_text = re.sub(uuid_pattern, '', text, flags=re.MULTILINE\
          \ | re.DOTALL)\n\n    # 清理多余的空白字符和换行符\n    cleaned_text = re.sub(r'\\s+',\
          \ ' ', cleaned_text).strip()\n\n    return cleaned_text\n\n\ndef main(query:\
          \ str, files, quote_content: str) -> dict:\n    \"\"\"入口函数：统一通过 is_swap_transaction\
          \ 返回结果。\"\"\"\n    return {\n        \"result\": is_swap_transaction(query,\
          \ files, quote_content)\n    }\n\n\ndef is_swap_transaction(instruction:\
          \ str, files: List[Dict] = [], quote_content: Optional[str] = None) -> str:\n\
          \    \"\"\"\n    有文件：\n      - 全为图片 -> \"图片\"（仅判断 f.get(\"type\") == \"\
          image\"）\n      - 全为Excel -> \"Excel\"（扩展名或 MIME 判断）\n      - 其他或混合 -> \"\
          无法识别文件类型\"\n    无文件：\n      - 仅根据关键词列表返回 \"期权\" 或 \"互换\"\n    \"\"\"\n \
          \   if files and isinstance(files, list) and len(files) > 0:\n        all_images\
          \ = all(str(f.get(\"type\", \"\")).lower() == \"image\" for f in files)\n\
          \        if all_images:\n            return \"互换-图片\"\n\n        all_excels\
          \ = all(\n            (str(f.get(\"extension\", \"\")).lower() in EXCEL_EXTENSIONS)\
          \ or\n            (str(f.get(\"mime_type\", \"\")).lower() in EXCEL_MIME_TYPES)\n\
          \            for f in files\n        )\n        if all_excels:\n       \
          \     return \"互换-Excel\"\n\n        return \"无法识别文件类型\"\n\n    # 无文件：文本分类\n\
          \    return _classify_trade_type(instruction, quote_content)\n\n\ndef _has_colloquial_swap_close(text:\
          \ str) -> bool:\n    \"\"\"\n    判断文本中是否包含口语化平仓表达（平X%/平X成/平一半/半仓/全平/平X分之Y/平M/N\
          \ 等）。\n    命中任一即视为互换头寸的口语化减仓指令。\n    \"\"\"\n    if not text:\n        return\
          \ False\n    for pattern in COLLOQUIAL_SWAP_CLOSE_PATTERNS:\n        if\
          \ re.search(pattern, text):\n            return True\n    return False\n\
          \n\ndef _is_quote_content_valid(quote_content: Optional[str]) -> bool:\n\
          \    \"\"\"\n    判断 quote_content 是否为有效引用内容。\n\n    排除以下情况：\n    - None\n\
          \    - 空字符串或纯空白\n    - Java 侧 String.valueOf(null) 转换产生的字符串 \"null\"\n \
          \   \"\"\"\n    if not quote_content or not isinstance(quote_content, str):\n\
          \        return False\n    stripped = quote_content.strip()\n    return\
          \ bool(stripped) and stripped.lower() != \"null\"\n\n\ndef _classify_trade_type(text:\
          \ str, quote_content: Optional[str] = None) -> str:\n    \"\"\"无文件时的文本分类：只返回\"\
          期权\"或\"互换\"。\"\"\"\n\n    # ----------------------------------------------------------------\n\
          \    # 订单号正则匹配（最高优先级）\n    # 互换/期权开仓/期权平仓三类单号都用正则，从 query 与 quote_content\
          \ 合并文本中查找。\n    # 冲突优先级：互换(H-) > 期权开仓(Q-) > 期权平仓(CO-/OPT)。\n    # ----------------------------------------------------------------\n\
          \    order_search_text = text or \"\"\n    if _is_quote_content_valid(quote_content):\n\
          \        order_search_text = order_search_text + \" \" + quote_content\n\
          \n    if re.search(SWAP_ORDER_PATTERN, order_search_text):\n        return\
          \ \"互换-文本\"\n    if re.search(OPTION_OPEN_ORDER_PATTERN, order_search_text):\n\
          \        return \"期权-文本\"\n    if re.search(OPTION_CLOSE_ORDER_PATTERN,\
          \ order_search_text):\n        return \"期权平仓-文本\"\n\n    # 口语化平仓 → 互换-文本\
          \ 早期判断\n    # 触发条件：query 与 quote_content 都未匹配到期权平仓订单号/合约编号（上面两个 if 已经过滤掉）\n\
          \    #          且 query 中出现\"平X%/平X成/平一半/半仓/全平/平X分之Y\"等口语化平仓表达\n    # 设计意图：这类表达是互换头寸的口语化减仓指令,必须早于\"\
          期权平仓查询关键词\"判断,\n    #          否则\"全平\"等可能被后续关键词逻辑（如 SWAP_KEYWORDS 中的\"\
          平仓\"）干扰\n    if text and _has_colloquial_swap_close(text):\n        return\
          \ \"互换-文本\"\n\n    # 互换系统回复消息早期判断：quote_content 包含互换系统消息时，直接返回互换-文本\n  \
          \  # 避免系统返回的候选标的列表（如含 AP01M.CZC 等农期合约、苹果近月等）污染关键词计数\n    _SWAP_SYSTEM_MSG_KEYWORDS\
          \ = (\"互换请求\", \"互换详情\", \"收益互换\", \"场外收益互换\")\n    if _is_quote_content_valid(quote_content)\
          \ and any(k in quote_content for k in _SWAP_SYSTEM_MSG_KEYWORDS):\n    \
          \    return \"互换-文本\"\n\n    # 明确互换下单特征优先于持仓查询：方向 + 数量/算法/价格类型，且无明确期权特征\n\
          \    if text:\n        upper_text = text.upper()\n        has_swap_direction\
          \ = any(k in text for k in (\"买入\", \"卖出\", \"卖空\", \"平空\", \"沽出\", \"沽入\"\
          ))\n        has_swap_params = (\n            (any(char.isdigit() for char\
          \ in text) and any(k in text for k in (\"股\", \"手\")))\n            or any(k\
          \ in upper_text for k in (\"POV\", \"TWAP\", \"VWAP\", \"ICEBERG\", \"SNIPER\"\
          , \"MKT\"))\n            or any(k in text for k in (\"市价\", \"限价\"))\n \
          \       )\n        has_explicit_option = any(k in text for k in (\"期权\"\
          , \"看涨\", \"看跌\", \"雪球\")) or bool(re.search(r\"(?<![A-Za-z])(?:CALL|PUT)(?![A-Za-z])\"\
          , upper_text))\n        if has_swap_direction and has_swap_params and not\
          \ has_explicit_option:\n            return \"互换-文本\"\n\n    # 情况2：未匹配到订单号，通过关键词判断意图\n\
          \    if text:\n        for keyword in OPTION_CLOSE_QUERY_KEYWORDS:\n   \
          \         if keyword in text:\n                has_explicit_swap_order_signal\
          \ = (\n                    any(signal in text.upper() for signal in (\"\
          买入\", \"卖出\", \"卖空\", \"平空\", \"MKT\", \"POV\", \"TWAP\", \"VWAP\", \"ICEBERG\"\
          , \"SNIPER\"))\n                    or bool(re.search(r\"[0-9]+(?:[.][0-9]+)?[\
          \ ]*(?:万|千|亿|k|w)?[ ]*(?:股|手)\", text, re.I))\n                )\n     \
          \           if keyword == \"持仓\" and has_explicit_swap_order_signal and\
          \ not has_explicit_option:\n                    continue\n             \
          \   return \"期权平仓-文本\"\n\n    # ----------------------------------------------------------------\n\
          \    # 以下为原有逻辑（保持不变）\n    # ----------------------------------------------------------------\n\
          \n    # 合并主要文本和引用内容\n    combined_text = text if text else \"\"\n\n    #\
