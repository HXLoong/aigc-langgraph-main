            \ | hasFastExecutionIntent | Other fields |\n| --------------- | -----------------------\
            \ | ---------------------- | ------------ |\n| `15` (< 1000)   | null\
            \                    | false                  | all null     |\n| `800`\
            \ (< 1000)  | null                    | false                  | all null\
            \     |\n| `8000` (≥ 1000) | \"8000\"                  | false       \
            \           | all null     |\n\n## Ex24: quote_content disambiguation\n\
            \n### 24a: Quote indicates limit price needed — bare decimal inferred\
            \ as limit price\n\nInput: 10.2\nQuote content:\n  期权平仓订单[CO-20260416-5BB1639F]参数需要完善：\n\
            \  【缺失参数】\n  • 限定价格（示例：10.2（元））\n  您可以引用本消息，补充您的订单参数。\nError order ID\
            \ list: [\"CO-20260416-5BB1639F\"]\nPure error order ID list: [\"CO-20260416-5BB1639F\"\
            ]\nPure error order count: 1\n\nQuote indicates \"限定价格\" is missing →\
            \ \"10.2\" → closeOrderPrice=10.2, closeOrderType=\"限价单\".\n\n```json\n\
            {\"closeOrderList\":[{\"orderId\":\"CO-20260416-5BB1639F\",\"internalTradeId\"\
            :null,\"closeOrderNotionalDelta\":null,\"closeOrderType\":\"限价单\",\"closeOrderPrice\"\
