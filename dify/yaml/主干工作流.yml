            \ 1`.\n\n| Input      | closeOrderType | closeOrderPrice | closeOrderPovRatio\
            \ | hasFastExecutionIntent | Other fields |\n| ---------- | --------------\
            \ | --------------- | ------------------ | ---------------------- | ------------\
            \ |\n| `POV`      | POV            | null            | null          \
            \     | false                  | all null     |\n| `TWAP`     | TWAP \
            \          | null            | null               | false            \
            \      | all null     |\n| `市价`     | 市价单         | null            |\
