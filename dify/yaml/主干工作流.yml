    - data:
        code: "import json\nimport re\n\n# 节点：交易对手、候选标的提取\n# 【输入】option(期权对手JSON串)/trs(互换对手JSON串)/quoteContent(引用消息全文)\n\
          # 【输出】optionList(Str)/trsList(Str)[带sort]/candidateList(Str)[{orderId,orderSeq,candidates:[{seq,code,name}]}]\n\
          # 注：是否切标的的意图判断已移到“互换-选择标的”(LLM-A)节点，本节点不再产 botAskKind。\nORDER_SEP = \"-----场外收益互换详情-----\"\
          \nCAND_BEGIN = \"匹配到其他标的\"\nCAND_END   = \"如果以上\"\n\ndef pick_fields(item):\n\
          \    \"\"\"对手对象只保留 ctptyId/shortName/longName/sort（sort 供下游按字母确定性选对手）。\"\
          \"\"\n    return {\"ctptyId\": item.get(\"ctptyId\"), \"shortName\": item.get(\"\
          shortName\"),\n            \"longName\": item.get(\"longName\"), \"sort\"\
          : item.get(\"sort\")}\n\ndef parse_counterparties(raw_json):\n    \"\"\"\
          后端预查的对手 JSON 串 → 精简列表；空/非法 → []。\"\"\"\n    try:\n        parsed = json.loads(raw_json\
          \ or \"[]\")\n    except Exception:\n        return []\n    return [pick_fields(x)\
          \ for x in parsed] if isinstance(parsed, list) else []\n\ndef parse_candidates(quote):\n\
          \    \"\"\"从引用消息确定性解析候选标的块 → [{orderId,orderSeq,candidates:[{seq,code,name}]}]。\n\
          \    用“先找所有候选起始(序号. 代码 -), name 取相邻起始之间的文本”的写法，\n    对单行(候选间仅空格、无换行)的引用消息也健壮，不会把后续候选并入前一个\
          \ name。\"\"\"\n    if not quote:\n        return []\n    result = []\n \
          \   for block in str(quote).split(ORDER_SEP):\n        if CAND_BEGIN not\
          \ in block:\n            continue\n        order_id_match  = re.search(r\"\
          H-\\d{8}-\\d{10}\", block)\n        order_seq_match = re.search(r\"序号[：:]\\\
          s*(\\d+)\", block)\n        segment = block.split(CAND_BEGIN, 1)[1].split(CAND_END,\
          \ 1)[0]\n        starts = list(re.finditer(r\"(\\d+)\\s*\\.\\s*([A-Za-z0-9.]+)\\\
          s*-\\s*\", segment))\n        candidates = []\n        for i, m in enumerate(starts):\n\
          \            name_end = starts[i + 1].start() if i + 1 < len(starts) else\
          \ len(segment)\n            name = segment[m.end():name_end]\n         \
          \   name = re.split(r\"[（(]\", name)[0].strip()   # 去掉“（已默认）”等修饰括号\n   \
          \         candidates.append({\"seq\": int(m.group(1)), \"code\": m.group(2),\
          \ \"name\": name})\n        if candidates:\n            result.append({\"\
          orderId\": order_id_match.group(0) if order_id_match else None,\n      \
          \                     \"orderSeq\": int(order_seq_match.group(1)) if order_seq_match\
          \ else None,\n                           \"candidates\": candidates})\n\
          \    return result\n\ndef main(option, trs, quoteContent):\n    \"\"\"解析期权/互换对手列表\
          \ + 候选标的；任何异常退化为安全空值。\"\"\"\n    try:\n        option_list = parse_counterparties(option)\n\
          \        trs_list = parse_counterparties(trs)\n        candidate_list =\
          \ parse_candidates(quoteContent)\n    except Exception:\n        option_list,\
          \ trs_list, candidate_list = [], [], []\n    return {\n        \"optionList\"\
          : option_list,\n        \"optionListStr\": json.dumps(option_list, ensure_ascii=False),\n\
          \        \"trsList\": trs_list,\n        \"trsListStr\": json.dumps(trs_list,\
          \ ensure_ascii=False),\n        # 瘦列表: 只含 sort+shortName, 供 LLM 名称命中(只认\
          \ shortName, 物理屏蔽 longName)\n        \"trsShortListStr\": json.dumps([{\"\
          sort\": t.get(\"sort\"), \"shortName\": t.get(\"shortName\")} for t in trs_list],\
          \ ensure_ascii=False),\n        \"candidateList\": candidate_list,\n   \
          \     \"candidateListStr\": json.dumps(candidate_list, ensure_ascii=False)\n\
          \    }\n"
        code_language: python3
        outputs:
          candidateList:
            children: null
            type: array[object]
          candidateListStr:
            children: null
            type: string
          optionList:
            children: null
            type: array[object]
          optionListStr:
            children: null
            type: string
          trsList:
            children: null
            type: array[object]
          trsListStr:
            children: null
            type: string
          trsShortListStr:
            children: null
            type: string
        selected: false
        title: 交易对手、候选标的提取
        type: code
        variables:
        - value_selector:
          - '1755072621769'
          - option_counterparties
          value_type: string
