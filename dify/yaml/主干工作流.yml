    name: default_reply
    selector:
    - env
    - default_reply
    value: '抱歉，我们目前无法识别您的意图。您可以按照下方格式发送指令：

      1.期权询价：@机器人欧式看涨，标的代码（或标的名称），执行价，期限

      示例：@机器人欧式看涨，000155.SZ，80，1M/2M

      2.期权平仓：@机器人合约编号，平仓名义本金，平仓价格方式

      示例：@机器人OPTG-SZZSCF20260009，200w，市价下单

      3.查可平持仓：@机器人查可平持仓

      4.互换下单：@机器人标的代码（或标的名称），方向，数量，价格类型，交易对手（簿记产品）

      示例：@机器人600007.SH，买入，1657股，限价6，广发1号或总单'
