    - data:
        code: "# 互换下单-引用消息(quote_content)规整\n# 目的: 把机器人上一条\"订单详情+请补充参数\"消息剥成\"订单号(多单含序号)\
          \ + 该单待补字段名列表\",\n#       剥掉订单详情正文、\"匹配到其他标的\"候选列表、候选交易对手选项(交易对手由专门节点处理)。\n\
          #       无补参内容时降级为空串, 不误伤全新下单/确认下单。\n# 输出格式(每单一行, 对大模型友好):\n#   多订单: 订单{订单号}（序号N）\
          \ 需要补充：字段1、字段2\n#   单订单: 订单{订单号} 需要补充：字段1、字段2\n#   平仓选项卡: 需要补充：大合约编号  +\
          \ 其后附\"第N笔…（编号）\"持仓选项行(下单节点要靠它定位)\n#   参数齐全订单(单/多订单通用): 订单{订单号}（[序号N，]参数齐全，本次输入按改参处理）\n\
          #                               —— 引用的订单无任何待补字段时输出此改参行, 保证下单LLM能拿到订单号做改参\n\
          # 注意: 引用消息经企微/对话透传后换行常被压成空格(整条单行), 故全部用正则在扁平串上匹配, 不依赖换行。\n# 依赖的后端消息锚点(后端\
          \ UnifiedSwapResponseService / SwapOrderRequestValidator 生成):\n#   订单号:\
          \     H-YYYYMMDD-{10位数字}  (与\"脚本判断\"节点 SWAP_ORDER_PATTERN 同源)\n#   单订单:\
          \     含 \"单号：H-...\"\n#   多订单:     每单补参段以 \"订单{订单号}(序号N)\" 起头 (后端模板半角括号;\
          \ 防御性兼容全角（）)\n#   待补字段:   \"【请补充参数：X】\"  (X 即待补字段名)\nimport re\n\nSWAP_ORDER\
          \ = r'H-\\d{8}-\\d{10}'\nHINT_MARK = '【请补充参数：'\nHINT = re.compile(r'【请补充参数：([^】]+)】')\n\
          # 回退: 详情行「X：【待补充】」也视为待补字段(兼容不带【请补充参数：X】块的消息变体)\nPEND_LINE = re.compile(r'([\\\
          u4e00-\\u9fa5A-Za-z/／]{2,8})：【待补充】')\n# 多订单补参表头: \"订单{订单号}(序号N)：\" —— 容错全/半角括号与空格;\
          \ 序号缺失时由 SEQ_PAIR 兜底\nMULTI_HEAD = re.compile(r'订单\\s*(' + SWAP_ORDER +\
          \ r')\\s*(?:[（(]\\s*序号\\s*(\\d+)\\s*[）)])?')\nSOLE_ID = re.compile(r'单号[:：]\\\
          s*(' + SWAP_ORDER + r')')\n# 详情区 \"序号：N 单号：H-...\" 配对, 作为表头无序号时的兜底来源\nSEQ_PAIR\
          \ = re.compile(r'序号[:：]\\s*(\\d+)\\s*单号[:：]\\s*(' + SWAP_ORDER + r')')\n\
          CLOSE_OPT = re.compile(r'第\\d+笔[:：][^第【】]*?（[^）]+）')\n\n\n# 同一字段的后端双名归一:\
          \ 字段统一为\"可见委托量\"；FIELD_ALIAS 仅把历史消息旧名\"可委托数量\"归一到\"可见委托量\"(同指 placeOrderDisplayQty)\n\
          FIELD_ALIAS = {'可委托数量': '可见委托量'}\n\n\ndef _pend_fields(seg):\n    fields\
          \ = []\n    for f in HINT.findall(seg) + PEND_LINE.findall(seg):\n     \
          \   f = FIELD_ALIAS.get(f, f)\n        if f not in fields:\n           \
          \ fields.append(f)\n    return fields\n\n\ndef _valid(q):\n    if not q\
          \ or not isinstance(q, str):\n        return False\n    s = q.strip()\n\
          \    return bool(s) and s.lower() != 'null'\n\n\nGLUED_ALPHA_SHARE_QUANTITY\
          \ = re.compile(\n    r'(?<![A-Za-z0-9.])'\n    r'(?P<symbol>[A-Za-z]{1,5}(?:\\\
          .[A-Za-z]{1,2})?)'\n    r'(?P<value>\\d[\\d,]*(?:\\.\\d+)?)\\s*'\n    r'(?P<scale>万|千|亿|k|K|w|W)?\\\
          s*'\n    r'(?P<unit>股|份)(?![A-Za-z])',\n    re.I,\n)\nEXPLICIT_QUANTITY\
          \ = re.compile(\n    r'(?<![A-Za-z0-9.])(?P<value>\\d[\\d,]*(?:\\.\\d+)?)\\\
          s*'\n    r'(?P<scale>万|千|亿|k|K|w|W)?\\s*'\n    r'(?P<unit>股|手|张|份|lot|lots)(?![A-Za-z])',\n\
          \    re.I,\n)\nQUANTITY_SCALE = {'千': 1000, 'k': 1000, '万': 10000, 'w':\
          \ 10000, '亿': 100000000}\n\n\nCOMMA_INTEGER_TOKEN = r'(?<![A-Za-z0-9.])\\\
          d[\\d,]*,\\d[\\d,]*(?![A-Za-z0-9.])'\nCOMMA_INTEGER = re.compile(COMMA_INTEGER_TOKEN)\n\
          LIMIT_COMMA_INTEGER = re.compile(\n    r'(?:(?<!不设)(?<!不)(?<!无)限价(?:委托)?|(?<!不)(?<!无)限定价格|(?<!不)(?<!无)(?<!限定)(?<!限制)价格|均价|均價|(?i:LimitOrder))\\\
          s*(?P<value>' + COMMA_INTEGER_TOKEN + r')'\n)\nAT_PRICE_NUMBER = re.compile(\n\
          \    r'@\\s*(?P<value>\\d[\\d,]*(?:\\.\\d+)?)'\n)\nLIMIT_BEFORE_QUANTITY_MARKER\
          \ = re.compile(\n    r'(?<!不设)(?<!不)(?<!无)(?:限价(?:委托)?|限定价格|价格)\\s*(?=【委托数量：)'\n\
          )\n\n\ndef _number_value(token):\n    return token.replace(',', '')\n\n\n\
          def _normalize_raw_content(raw_content):\n    \"\"\"确定性标注易混数字：价格关键词/@ 后数字按限价；其余英文逗号整数按委托数量。\"\
          \"\"\n    raw = str(raw_content or '')\n\n    def replace_glued_alpha_share_quantity(match):\n\
          \        value = float(_number_value(match.group('value')))\n        scale_token\
          \ = match.group('scale') or ''\n        scale = QUANTITY_SCALE.get(scale_token.lower(),\
          \ 1)\n        quantity = value * scale\n        if not quantity.is_integer():\n\
          \            return match.group(0)\n        return match.group('symbol')\
          \ + '【委托数量：' + str(int(quantity)) + '；数量单位：SHARE】'\n\n    def replace_explicit_quantity(match):\n\
          \        value = float(_number_value(match.group('value')))\n        scale_token\
          \ = match.group('scale') or ''\n        scale = QUANTITY_SCALE.get(scale_token.lower(),\
          \ 1)\n        quantity = value * scale\n        if not quantity.is_integer():\n\
          \            return match.group(0)\n        unit = 'HAND' if match.group('unit').lower()\
          \ in {'手', '张', 'lot', 'lots'} else 'SHARE'\n        return '【委托数量：' + str(int(quantity))\
          \ + '；数量单位：' + unit + '】'\n\n    def replace_at_price(match):\n        price\
          \ = _number_value(match.group('value'))\n        return '【价格类型：LimitOrder；限定价格：'\
          \ + price + '】'\n\n    def replace_limit(match):\n        price = _number_value(match.group('value'))\n\
          \        return '【价格类型：LimitOrder；限定价格：' + price + '】'\n\n    def replace_quantity(match):\n\
          \        prefix = raw[max(0, match.start() - 8):match.start()]\n       \
          \ if re.search(r'(?:不设限价|不限价|无限价|不限定价格|不限制价格)\\s*$', prefix):\n        \
          \    return match.group(0)\n        return '【委托数量：' + _number_value(match.group(0))\
          \ + '】'\n\n    # 纯字母美股代码紧贴股数时，单位“股/份”确定数字全部属于数量，例如 TSM2625股。\n    raw =\
          \ GLUED_ALPHA_SHARE_QUANTITY.sub(replace_glued_alpha_share_quantity, raw)\n\
          \    # 明确股/手单位的数量优先级最高；先保护后，前面的“限价”只表示价格类型，不抢占数量。\n    raw = EXPLICIT_QUANTITY.sub(replace_explicit_quantity,\
          \ raw)\n    # “限价 + 明确数量单位”中，限价只表示价格类型，价格本身仍待补。\n    raw = LIMIT_BEFORE_QUANTITY_MARKER.sub('【价格类型：LimitOrder；限定价格：未提供】\
          \ ', raw)\n    # @数字、限价/价格关键词后的数字都是限价，必须先保护，避免后续逗号整数规则把价格改写成数量。\n    raw\
          \ = AT_PRICE_NUMBER.sub(replace_at_price, raw)\n    raw = LIMIT_COMMA_INTEGER.sub(replace_limit,\
          \ raw)\n    return COMMA_INTEGER.sub(replace_quantity, raw)\n\n\ndef _result(hints,\
          \ raw_content):\n    return {\n        'quote_param_hints': hints,\n   \
          \     'raw_content_for_llm': _normalize_raw_content(raw_content),\n    }\n\
          \n\ndef _fmt(oid, seq, fields, close_opts):\n    if oid:\n        head =\
          \ '订单 ' + oid + ('（序号' + seq + '）' if seq else '') + ' '\n    else:\n  \
          \      head = ''\n    out = [head + '需要补充：' + '、'.join(fields)]\n    out.extend(close_opts)\n\
          \    return out\n\n\ndef main(quote_content: str, raw_content: str = '')\
          \ -> dict:\n    # 无效引用 -> 空串(全新下单/纯文本)\n    if not _valid(quote_content):\n\
          \        return _result('', raw_content)\n    # 无补参标记: 引用的是参数齐全订单(或其他含单号消息)\
          \ -> 输出改参行(只给订单号, 不带任何旧值)\n    if HINT_MARK not in quote_content and not\
          \ PEND_LINE.search(quote_content):\n        pairs = SEQ_PAIR.findall(quote_content)\n\
          \        if pairs:\n            lines = ['订单 ' + oid + '（序号' + seq + '，参数齐全，本次输入按改参处理）'\
          \ for seq, oid in pairs]\n        else:\n            ids = []\n        \
          \    for m in re.finditer(SWAP_ORDER, quote_content):\n                if\
          \ m.group(0) not in ids:\n                    ids.append(m.group(0))\n \
          \           lines = ['订单 ' + oid + '（参数齐全，本次输入按改参处理）' for oid in ids]\n\
          \        return _result('\\n'.join(lines), raw_content)\n\n    q = quote_content\n\
          \    seq_map = {oid: seq for seq, oid in SEQ_PAIR.findall(q)}  # 兜底: 订单号\
          \ -> 序号\n    units = []\n    heads = list(MULTI_HEAD.finditer(q))\n    if\
          \ heads:\n        # 多订单: 按 \"订单{订单号}(序号N)\" 切片, 详情正文(首个订单头之前)整体丢弃\n    \
          \    covered = set()\n        for k, m in enumerate(heads):\n          \
          \  stop = heads[k + 1].start() if k + 1 < len(heads) else len(q)\n     \
          \       seg = q[m.start():stop]\n            fields = _pend_fields(seg)\n\
          \            if fields:\n                oid = m.group(1)\n            \
          \    seq = m.group(2) or seq_map.get(oid)\n                units.append(_fmt(oid,\
          \ seq, fields, []))\n                covered.add(oid)\n        # 混合状态: 详情区里参数齐全(无待补段)的订单也输出改参行,\
          \ 保证引用后可改任意一单\n        for seq, oid in SEQ_PAIR.findall(q):\n          \
          \  if oid not in covered:\n                units.append(['订单 ' + oid + '（序号'\
          \ + seq + '，参数齐全，本次输入按改参处理）'])\n                covered.add(oid)\n    else:\n\
          \        # 单订单 / 平仓持仓选项卡(平仓下单前无订单号)\n        oid_m = SOLE_ID.search(q)\n\
          \        oid = oid_m.group(1) if oid_m else None\n        fields = _pend_fields(q)\n\
          \        close_opts = CLOSE_OPT.findall(q)\n        if fields:\n       \
          \     units.append(_fmt(oid, None, fields, close_opts))\n\n    if not units:\n\
          \        return _result('', raw_content)\n    return _result('\\n'.join('\\\
          n'.join(u) for u in units).strip(), raw_content)\n"
