            - **必须直接输出**纯JSON字符串,不带任何包装\n- **绝对禁止**提取orderId以外的任何参数\n\n\n【输出格式】\n\n\
            \n```json\n{\n  \"type\": \"query_order_status\",\n  \"orderList\": [\n\
            \    {\n      \"orderId\": \"H-XXXXXXXX-XXXXXXXXXX\"\n    }\n  ]\n}\n\
