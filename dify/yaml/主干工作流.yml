          \ holdingMap 列表。\n *\n * 输入变量：\n *   body        - 来自 HTTP 节点的响应体（JSON 字符串或对象）\n\
          \ *                 预期结构：{ \"code\": 0, \"data\": [{ \"orderId\": \"CO-xxx\"\
          , \"availableNotional\": 5000000, \"notional\": 5000000, \"contractCode\"\
          : \"OPT-xxx\" }] }\n *\n * 输出变量：\n *   holdingMap  - data 列表的 JSON 字符串\n\
          \ */\nfunction main({ body }) {\n    let respData = [];\n    try {\n   \
          \     const parsed = typeof body === 'string' ? JSON.parse(body) : body;\n\
          \        if (parsed && Array.isArray(parsed.data)) {\n            respData\
          \ = parsed.data;\n        }\n    } catch (e) {\n        // 解析失败，返回空列表\n\
          \    }\n\n    return { orderList: JSON.stringify(respData) };\n}\n"
