            \n**placeOrderWindCode验证**:\n\"这个placeOrderWindCode在image_data哪里?\"\n\
            - 不能指出位置→从示例复制→改为null\n- 位置是市场类型词(如\"A股\")→不是标的代码→改为null\n- 如果来自表格证券名称,必须能指出同一订单位置的名称单元格;否则改为null\n\
