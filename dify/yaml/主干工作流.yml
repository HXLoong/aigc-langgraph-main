    - data:
        code: "# -*- coding: utf-8 -*-\n\"\"\"\nDify code 节点 1 —— 期权开仓（询价 / 下单 / 确认\
          \ / 撤单）\n================================================================\n\
          替换主干节点：tool 1760951915597（场外交易-期权工具，新询价侧）\n并入下游「期权工具-返回JSON解析」(1755073969365)\
          \ 逻辑 => 直接输出最终字段，省掉该解析节点。\n输出变量（5 个，对齐原返回解析节点；下游零改动，直接接本节点）：\n  code   \
          \      number\n  result       string\n  intent       string\n  orderList\
          \    array[object]\n  productType  number\n\n输入变量（在 code 节点里逐个配置，引用照搬原 tool\
          \ 的 tool_parameters）：\n  llmText        <- 期权-模型解析数据转字符串 / result   (17769304846260.result)\n\
          \                    该上游是 json.dumps(dict) 出来的标准 JSON 字符串，用普通 json.loads\
          \ 即可，\n                    无需脏数据容错（parse_flexible_json_string 已去掉）。\n  conversationId\
          \ <- 开始 / conversation_id              (1755072621769)\n  messageId    \
          \  <- 开始 / message_id\n  query          <- sys.query\n  quoteAppinfo   <-\
          \ 开始 / quote_appinfo\n  roomId         <- 开始 / room_id\n  guid         \
          \  <- 开始 / guid\n  userId         <- sys.user_id\n  apiUrl         <- env.api_url\n\
          \  otc_secret     <- env.otc_secret\n  rawContent     <- 开始 / raw_content\n\
          \  quoteContent   <- 开始 / quote_content\n\n注意：Authorization 无 Bearer 前缀（照搬原节点）；上线前核对\
          \ env.otc_secret 实际值。\n\"\"\"\nimport json\nimport requests\n\n\ndef main(\n\
          \        llmText,\n        conversationId,\n        messageId,\n       \
          \ query,\n        quoteAppinfo,\n        roomId,\n        guid,\n      \
          \  userId,\n        apiUrl,\n        otc_secret,\n        rawContent,\n\
          \        quoteContent,\n        operatorUserId) -> dict:\n    # llmText\
          \ = 上游 json.dumps(dict) 的标准 JSON 字符串；用 json.loads 还原。\n    # 若上游万一直接传 dict\
          \ 也兼容。\n    if isinstance(llmText, str):\n        try:\n            res\
          \ = json.loads(llmText) if llmText.strip() else {}\n        except Exception:\n\
          \            res = {}\n    else:\n        res = llmText or {}\n\n    operate\
          \ = res.get('operate')\n    intent = res.get('type')\n    orderList = res.get('orderList')\
          \ or []\n\n    url = f\"{apiUrl}/admin-api/financial-orders/operate\"\n\
          \    headers = {\"Content-Type\": \"application/json\", \"Authorization\"\
          : otc_secret}\n    payload = {\n        \"conversationId\": conversationId,\n\
          \        \"messageId\": messageId,\n        \"messageContent\": query,\n\
          \        \"quoteAppinfo\": quoteAppinfo,\n        \"roomId\": roomId,\n\
          \        \"guid\": guid,\n        \"userId\": userId,\n        \"type\"\
          : intent,\n        \"operate\": operate,\n        \"operatorUserId\": operatorUserId,\n\
          \        \"orderList\": orderList,\n        \"rawContent\": rawContent,\n\
          \        \"quoteContent\": quoteContent,\n    }\n    code = None\n    result\
          \ = \"\"\n    try:\n        resp = requests.post(url, json=payload, headers=headers,\
          \ timeout=60)\n        resp.raise_for_status()\n        parsed = resp.json()\n\
          \        code = parsed.get(\"code\")\n        if code == 0:\n          \
          \  result = parsed.get(\"data\", \"\")\n        elif code == 500:\n    \
          \        result = \"交易指令服务暂不可用\"\n        else:\n            result = parsed.get(\"\
          msg\", \"未知错误\")\n    except Exception:\n        code = 500\n        result\
          \ = \"交易指令服务暂不可用\"\n    # 并入原「期权工具-返回JSON解析」逻辑，直接输出最终字段\n    return {\n\
          \        \"code\": code,\n        \"result\": result,\n        \"intent\"\
          : intent,\n        \"orderList\": orderList,\n        \"productType\": 0,\n\
          \    }\n"
