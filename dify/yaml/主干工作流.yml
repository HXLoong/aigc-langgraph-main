          ,\n    \"期权持仓\",\n    \"查持仓\",\n    \"期权平仓\",\n    \"持仓\",\n]\n\n# 期权关键词维护列表\n\
          OPTION_KEYWORDS: List[str] = [\n    \"期权\", \"期权订单\",\n    \"报价\", \"询价\"\
          ,\n    \"看涨\", \"看跌\",\n    \"行权价\", \"平直\", \"平值\",\n    \"call\", \"CALL\"\
          , \"Call\",\n    \"put\", \"PUT\", \"Put\",\n    \"欧式看涨\", \"雪球\", \"参与型看涨\"\
          , \"敲入\", \"敲出\",\n    \"Q-\",\n    \"涨跌幅过大\", \"结构\", \"期限\", \"保证金\",\
