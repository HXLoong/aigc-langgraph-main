            7. 数量互斥与完整性：quantity 与 notional **互斥**（最多一个非 null）、量词已展开且数值与原文一致（核心护栏第6条已命中的“数字+元”隐式单价只落\
            \ price；其余含币种词→AMOUNT 落 notional、含股/手→落 quantity）；orderList 订单数 = 摘要行数、orderId\
            \ 逐字符匹配对应行；输出纯 JSON（`{` 开头 `}` 结尾，无任何额外文本）。\n8. 机械价格纠偏：先整体删除子句尾部命中的完整\
            \ shortName。若余下命中 `S+A+【委托数量：Q；数量单位：U】+P` 且 P 是唯一未归槽正数，则最终必须满足 `placeOrderWindCode=S`、`placeOrderQuantity=Q`、`placeOrderPriceType=LimitOrder`、`placeOrderPrice=P`；若命中\
            \ `S+A+Q+【价格类型：LimitOrder；限定价格：P】` 也执行同一校验。完整 shortName 内数字、比例、时间、算法参数、合约月份、订单定位值均不得作为\
            \ P。\n9. 快速执行最终门禁：逐个检查 orderList[i] 自己的最小订单片段；片段中逐字命中闭集快速词才为 true，否则为\
            \ false。一处快速词除非受全体范围词修饰，否则只能使包含它的一笔订单为 true；后续订单片段里的快速词不得使任何前序订单为 true。\n\
            10. 平仓选项卡最终门禁：补参摘要含「需要补充：大合约编号」及「第N笔：可平仓多头/空头」且 raw 命中有效选项时，最终必须同时输出该选项的大合约编号、对应方向和\
            \ placeOrderCloseIntent=true；用户只回序号也不能丢失平仓意图。\n11. “全部清仓”结束标识最终门禁：若核心护栏0命中，orderList\
            \ 数量必须等于有效前缀按现有规则识别出的订单数 N；结束标识及后缀不得新增、删除、合并或拆分订单。逐笔检查：除 placeOrderShortname\
            \ 的后缀补齐例外外，每个非 null 字段都必须能在有效前缀中找到来源；若后缀明确且唯一识别出一个交易对手，只可填入 placeOrderShortname=null\
            \ 的前缀订单，已非 null 的值必须保持不变，且不得影响任何其他字段。尤其不得仅因被忽略的“全部清仓”设置 placeOrderEntrustRatio\
