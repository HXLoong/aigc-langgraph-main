            \ 1M 100%\" → \"601318.SH\"（第2位置）\n   - \"欧式看涨 1M 601318.SH 100%\" → \"\
            601318.SH\"（中间）\n   - \"欧式看涨 1M 100% 601318.SH\" → \"601318.SH\"（末尾）\n\
            \   - \"601318.SH\\n欧式看涨\\n1M\\n100%\" → \"601318.SH\"（第1行）\n   - \"欧式看涨\\\
            n1M\\n100%\\n601318.SH\" → \"601318.SH\"（最后一行）\n   严重错误示例:\n   - ❌ \"\
            欧式看涨 1M 100% 601318.SH\" → \"100%\"（把执行价当标的!）\n   - ❌ \"601318.SH 欧式看涨\
            \ 1M 100%\" → 整段（把整句话当标的!）\n   - ❌ \"欧式看涨\\n1M\\n601318.SH\\n100%\" →\
            \ \"1M\"（未按换行分段!）\n\n\n   【识别方法 - 排除法 完整 13 类】\n   按 分隔符（中英文逗号/顿号/空格/换行）拆分输入为独立片段,\n\
            \   排除以下 13 类已知字段对应的片段后,剩余的就是 stockCode 候选:\n     1. 期权类型关键词: 看涨/看跌/call/put/欧式看涨/欧式看跌/认购/认沽/看空/欧式\n\
            \     2. 平值关键词: 平值/平直 (识别为 strikePercentage=100)\n     3. 执行价格模式: 数字+%（\"\
            100%\"、\"95%\"）、\"数字/数字+%\"（\"100/103\"）\n     4. 期限模式: 数字+M/W/Y（\"1M\"\
            、\"3M\"）、\"数字/数字\"+M/W/Y（\"1/2M\"）\n     5. 参与率模式: \"参与率\"/\"参与比例\" 及其后数字\n\
            \     6. 金额模式: 数字+W/w/万/KW/kw/千万/亿/E/e（\"100万\"、\"1W\"、\"1亿\"）、中文数字千万/亿\n\
            \     7. 建仓方式关键词: 市价/市价单/限价/限价单/POV/pov/TWAP/twap\n     8. 价格模式: \"限价\"\
            +数字（\"限价10\"、\"限价6.3\"）\n     9. POV 比例模式: \"POV\"+数字（\"POV25\"、\"POV30%\"\
            ）\n    10. 时间窗模式: \"HH:MM-HH:MM\" 或单 \"HH:MM\"\n    11. 订单号模式: 以\"Q-\"\
            开头（\"Q-20250616-000011\"）\n    12. 交易对手关键词: \"交易对手:\"/\"账号\"/\"交易账号\"\
            /\"交易账户\" + 完整标识符\n    13. 机器人名称/@提及: bot_name_list 中的名称或任何 @XXX 片段\n\
            \   提取步骤:\n     a. 预处理: 执行机器人名称过滤\n     b. 拆分: 按分隔符拆分为独立片段(无分隔符时按关键词边界拆分)\n\
            \     c. 逐片段分类: 对每个片段独立判断属于哪个字段\n     d. 取剩余: 排除所有已识别字段后,剩余片段就是 stockCode\
            \ 候选\n     e. 多个剩余片段时优先取代码格式\n\n\n   【自检方法 - 提取 stockCode 后必须执行】\n   1.\
            \ stockCode 是否包含以下任一关键词:\n      \"看涨\"/\"看跌\"/\"call\"/\"put\"/数字+M/W/Y（如\"\
            1M\"）/数字+%（如\"100%\"）/\n      \"限价\"/\"市价\"/\"POV\"/\"TWAP\"/\"万\"/\"\
            W\"/\"kw\"/\"亿\"/\"@\"/以\"Q-\"开头?\n      → 包含说明提取范围过大或误识别, 必须立即修正\n  \
            \ 2. stockCode 是否匹配上述 13 类排除模式?\n      → 匹配说明将其他字段误识别为标的, 必须修正为 null 或重新识别\n\
            \   3. stockCode 每个字符是否与原始输入逐字节完全相同?\n      包括字母大小写/数字/标点/空格/括号类型（中文/英文）是否完全一致?\n\
            \      → 任何不一致都是严重错误\n   4. stockCode 是否含任何 emoji 表情符号?\n      → 含则必须删除并严格按原文重新提取\n\
            \n\n   排除后无剩余片段时 stockCode 设为 null。\n\n\n\n【金融简写规则 - 极重要】\n\"数字+call\"\
            \ 紧黏简写必须拆解为两个字段(大小写不敏感):\n- \"100call\" → strikePercentage: 100, optionType:\
            \ \"欧式看涨\"\n- \"95Call\"  → strikePercentage:  95, optionType: \"欧式看涨\"\
            \n拆解后该片段不再污染 stockCode 候选。\n说明: 业务不支持\"看跌/put\"。用户输入 put 类时仍可按数字提取 strikePercentage,\n\
            但 optionType 不能输出\"欧式看跌\"(非合法值); 按其他线索判断(雪球/参与型),否则设 null。\n\n\n\n2. optionType(期权类型):\n\
            \   - 【极重要】只允许输出以下 3 个 enum 值之一: \"欧式看涨\" / \"参与型看涨\" / \"雪球\"\n   - 业务不支持\"\
            欧式看跌\"等其他值,绝对不要输出\n   - 识别关键词(优先级从高到低):\n     · 雪球 / snowball / autocall\
            \ → \"雪球\"\n     · 参与型 / 参与 / 参与型看涨 → \"参与型看涨\"\n     · 看涨 / call / 100call\
            \ 类简写 / 默认场景 → \"欧式看涨\"\n   - 优先级示例:\n     · \"雪球 600000.SH 1M\" → \"\
            雪球\"\n     · \"参与型 100% 1M 中海油\" → \"参与型看涨\"\n     · \"600519 看涨 100%\
