        code: "# -*- coding: utf-8 -*-\nimport json\n\n\ndef _parse_literals(nullLiterals):\n\
          \    \"\"\"解析环境变量 NULL_LITERALS(逗号分隔); 缺失/为空/解析异常 -> 默认 {\"null\"}。\"\"\"\
          \n    try:\n        s = {x.strip().lower() for x in (nullLiterals or \"\"\
          ).split(\",\") if x.strip()}\n        return s or {\"null\"}\n    except\
          \ Exception:\n        return {\"null\"}\n\n\ndef _sanitize(v, literals):\n\
          \    \"\"\"递归清洗 LLM 脏值: null 字面量字符串 -> None; list 丢弃清成 None 的元素; dict 递归。\"\
          \"\"\n    if isinstance(v, str):\n        return None if v.strip().lower()\
          \ in literals else v\n    if isinstance(v, list):\n        return [c for\
          \ c in (_sanitize(i, literals) for i in v) if c is not None]\n    if isinstance(v,\
          \ dict):\n        return {k: _sanitize(val, literals) for k, val in v.items()}\n\
          \    return v\n\n\ndef main(llmText, nullLiterals) -> dict:\n    literals\
          \ = _parse_literals(nullLiterals)\n    # 解析容错对齐「期权开仓」原逻辑: 烂 JSON -> {}\n\
          \    if isinstance(llmText, str):\n        try:\n            data = json.loads(llmText)\
          \ if llmText.strip() else {}\n        except Exception:\n            data\
          \ = {}\n    else:\n        data = llmText or {}\n\n    # 仅清洗 orderList;\
          \ 顶层 type/operate 不清洗(清成 null 后端期权入口会 NPE, \"null\" 字符串落未知意图模板反而安全)\n  \
          \  if isinstance(data, dict) and \"orderList\" in data:\n        data =\
          \ dict(data)\n        data[\"orderList\"] = _sanitize(data.get(\"orderList\"\
          ) or [], literals)\n\n    return {\"result\": json.dumps(data, ensure_ascii=False)}\n"
