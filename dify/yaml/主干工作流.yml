            Safety check: 3000000 > 21.6 ✓\n\n```json\n{\"closeOrderList\":[{\"orderId\"\
            :\"CO-00000000-AAAA0002\",\"internalTradeId\":null,\"closeOrderNotionalDelta\"\
            :\"3000000\",\"closeOrderType\":\"限价单\",\"closeOrderPrice\":21.6,\"closeOrderPovRatio\"\
            :null,\"closeOrderAlgoStartTime\":null,\"closeOrderAlgoEndTime\":null,\"\
            confirmFullClose\":null,\"hasFastExecutionIntent\":false}]}\n```\n\n##\
            \ Ex28: Implicit price-amount disambiguation — Pattern C (ratio consumed\
            \ notional + remaining bare number)\n\n### 28a: Bare decimal + \"平\" +\
            \ percentage ratio\n\nInput: 序号2这笔 21.6平50%\nHolding map: [{\"seq\":2,\"\
            orderId\":\"CO-00000000-AAAA0002\"}]\nOrder list: [{\"orderId\":\"CO-00000000-AAAA0002\"\
            ,\"availableNotional\":5000000}]\n\n`平50%` is a ratio pattern (Priority\
            \ 5) → closeOrderNotionalDelta = floor(5000000 × 50 / 100) = \"2500000\"\
            .\nRemaining `21.6` is an unmatched bare decimal. Pattern C applies: 21.6\
            \ → closeOrderPrice, closeOrderType=\"限价单\".\n\n```json\n{\"closeOrderList\"\
            :[{\"orderId\":\"CO-00000000-AAAA0002\",\"internalTradeId\":null,\"closeOrderNotionalDelta\"\
            :\"2500000\",\"closeOrderType\":\"限价单\",\"closeOrderPrice\":21.6,\"closeOrderPovRatio\"\
            :null,\"closeOrderAlgoStartTime\":null,\"closeOrderAlgoEndTime\":null,\"\
            confirmFullClose\":null,\"hasFastExecutionIntent\":false}]}\n```"
