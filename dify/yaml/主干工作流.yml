            \n\n【输入数据说明】\n- query: 用户的完整消息内容\n- raw_content: 用户原始消息(如\"撤单\"、\"全部撤单\"\
            )\n- quote_content: 用户引用的消息（可能包含要撤销的订单信息）\n- bot_name_list: 机器人名称列表\n\n\
