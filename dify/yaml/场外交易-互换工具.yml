    - data:
        code: "\"\"\"\n\n互换API\n\n\"\"\"\nimport requests\nimport json\n\n\ndef main(\n\
          \    conversationId,\n    messageId,\n    messageContent,\n    rawContent,\n\
          \    quoteContent,\n    quoteAppinfo,\n    userId,\n    roomId,\n    guid,\n\
          \    type,\n    orderList,\n    apiUrl,\n    otcSecret\n    ) -> dict:\n\
          \    url = f\"{apiUrl}/admin-api/swap-order/operate\"\n    headers = {\n\
          \        \"Content-Type\": \"application/json\",\n        \"Authorization\"\
          : otcSecret\n    }\n    payload = {\n        \"conversationId\": conversationId,\n\
          \        \"messageId\": messageId,\n        \"messageContent\": messageContent,\n\
          \        \"rawContent\": rawContent,\n        \"quoteContent\": quoteContent,\n\
          \        \"quoteAppinfo\": quoteAppinfo,\n        \"userId\": userId,\n\
          \        \"roomId\": roomId,\n        \"guid\": guid,\n        \"type\"\
          : type,\n        \"orderList\": orderList\n    }\n\n    code = None\n  \
          \  error = \"\"\n    response_info = None\n    try:\n        response =\
          \ requests.post(url, json=payload, headers=headers, timeout=60)\n      \
          \  response.raise_for_status()  # HTTP 错误抛异常\n\n        # 构造可 JSON 序列化的响应摘要，避免返回\
          \ Response 对象导致序列化报错\n        response_info = {\n            \"status_code\"\
          : response.status_code,\n            \"ok\": response.ok,\n            \"\
          url\": response.url,\n            \"headers\": dict(response.headers),\n\
          \            \"text\": response.text\n        }\n\n        parsed = response.json()\
          \  # 自动解析 JSON\n        code = parsed.get(\"code\")\n        if code ==\
          \ 0:\n            result = parsed.get(\"data\", \"\")\n        elif code\
          \ == 500:\n            result = \"交易指令服务暂不可用\"\n        else:\n        \
          \    result = parsed.get(\"msg\", \"未知错误\")\n\n    except Exception as e:\n\
          \        # 统一处理所有异常，并记录异常信息\n        code = 500\n        result = \"交易指令服务暂不可用\"\
          \n        error = str(e)\n\n    return {\n        \"result\": result,\n\
          \        \"code\": code,\n        \"error\": error,\n        \"response\"\
          : response_info\n    }"
