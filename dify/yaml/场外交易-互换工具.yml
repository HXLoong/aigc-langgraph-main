    - data:
        code: "import json\nimport re\n\ndef main(data: str) -> dict:\n    res = parse_flexible_json_string(data)\n\
          \    return {\n        \"type\": res.get('type') if res else None,\n   \
          \     \"orderList\": res.get('orderList') if res else None\n    }\n\n\n\
          def parse_flexible_json_string(data_str: str):\n    \"\"\"\n    解析灵活的JSON字符串，支持有answer和没有answer两种情况\n\
          \    \"\"\"\n    try:\n        try:\n            result = json.loads(data_str)\n\
          \            if 'answer' not in result:\n                return result\n\
          \            data_str = result['answer']\n        except json.JSONDecodeError:\n\
          \            pass\n\n        protected_err_msg = None\n        protected_str\
          \ = data_str\n\n        err_msg_match = re.search(r'\"errMsg\"\\s*:\\s*\"\
          ((?:[^\"\\\\\\\\]|\\\\\\\\.)*)\"', data_str)\n        if err_msg_match:\n\
          \            protected_err_msg = err_msg_match.group(1)\n            protected_str\
          \ = re.sub(r'\"errMsg\"\\s*:\\s*\"((?:[^\"\\\\\\\\]|\\\\\\\\.)*)\"',\n \
          \                                  '\"errMsg\":\"__PROTECTED_ERRMSG__\"\
          ', data_str)\n\n        cleaned_str = protected_str\n        cleaned_str\
          \ = re.sub(r'(\\\\{{1,}})n', '', cleaned_str)\n        # 只替换未被引号包围的键名,避免影响字符串值内部的冒号(如时间格式)\n\
          \        # 匹配: {或,或[后面的 word: 模式,但不在引号内\n        cleaned_str = re.sub(r'([{,\\\
          [])\\s*(\\w+)\\s*:', r'\\1\"\\2\":', cleaned_str)\n        cleaned_str =\
          \ cleaned_str.replace(\"'\", '\"')\n        cleaned_str = re.sub(r',\\s*]',\
          \ ']', cleaned_str)\n        cleaned_str = re.sub(r',\\s*}', '}', cleaned_str)\n\
          \        cleaned_str = re.sub(r'\\s+', ' ', cleaned_str)\n        cleaned_str\
          \ = re.sub(r'```json\\s*|\\s*```', '', cleaned_str)\n        cleaned_str\
          \ = re.sub(r':\\s*null\\b', ': null', cleaned_str)\n        cleaned_str\
          \ = re.sub(r':(\\d+)([,\\\\]}])', r':\\1\\2', cleaned_str)\n        cleaned_str\
          \ = cleaned_str.strip()\n\n        if '\\\\\"' in cleaned_str:\n       \
          \     cleaned_str = cleaned_str.replace('\\\\\"', '\"')\n        if '\\\\\
          \\\\' in cleaned_str:\n            cleaned_str = cleaned_str.replace('\\\
          \\\\\\', '\\\\')\n\n        if protected_err_msg is not None:\n        \
          \    cleaned_str = cleaned_str.replace('\"errMsg\":\"__PROTECTED_ERRMSG__\"\
          ',\n                                              f'\"errMsg\":\"{protected_err_msg}\"\
          ')\n\n        return json.loads(cleaned_str)\n\n    except Exception as\
          \ error:\n        print(f'JSON解析失败: {error}')\n        return None\n\n"
        code_language: python3
