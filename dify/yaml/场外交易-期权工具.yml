    - data:
        code: "\"\"\"\n\n存量指令期权API\n\n\"\"\"\n\nimport requests\nimport json\n\n\n\
          def main(\n        conversationId,\n        messageId,\n        messageContent,\n\
          \        quoteAppinfo,\n        roomId,\n        guid,\n        userId,\n\
          \        type,\n        operate,\n        orderList,\n        apiUrl,\n\
          \        optionRfq,\n        otc_secret,\n        rawContent,\n        quoteContent)\
          \ -> dict:\n\n    # TODO 测试时固定\n    url = f\"{apiUrl}/admin-api/financial-orders/operate\"\
          \n    headers = {\n        \"Content-Type\": \"application/json\",\n   \
          \     \"Authorization\": otc_secret\n    }\n    payload = {\n        \"\
          conversationId\": conversationId,\n        \"messageId\": messageId,\n \
          \       \"messageContent\": messageContent,\n        \"quoteAppinfo\": quoteAppinfo,\n\
          \        \"roomId\": roomId,\n        \"guid\": guid,\n        \"userId\"\
          : userId,\n        \"type\": type,\n        \"operate\": operate,\n    \
          \    \"orderList\": orderList,\n        \"optionRfq\": optionRfq,\n    \
          \    \"rawContent\": rawContent,\n        \"quoteContent\": quoteContent\n\
          \    }\n\n    code = None\n    error = \"\"\n    response_info = None\n\
          \    try:\n        response = requests.post(url, json=payload, headers=headers,\
          \ timeout=30)\n        response.raise_for_status()  # HTTP 错误抛异常\n\n   \
          \     # 构造可 JSON 序列化的响应摘要，避免返回 Response 对象导致序列化报错\n        response_info\
          \ = {\n            \"status_code\": response.status_code,\n            \"\
          ok\": response.ok,\n            \"url\": response.url,\n            \"headers\"\
          : dict(response.headers),\n            \"text\": response.text\n       \
