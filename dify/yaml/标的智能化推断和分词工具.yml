            \  \"美股苹果\",\n  \"A股中国平安\",\n  \"科创板中芯国际\",\n  \"港股通\",\n  \"美股TSLA\"\
            ,\n  \"沪市600519\",\n  \"-\"\n]\n```\n\n输出：\n\n{\n  \"2333\": [\"2333\"\
