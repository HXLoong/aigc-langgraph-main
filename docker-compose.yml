# LangGraph 使用外部 Java MySQL；先在选中的数据库执行 sql/init.sql。
# 容器连接宿主机：URI 主机用 host.docker.internal，不要用 localhost。
# .env 的 MYSQL_URI 指向 Java 数据库；本 Compose 不创建 MySQL 或数据库。

services:
  app:
    build: .
    container_name: otc-agent-app
    environment:
      # checkpoint、审计与幂等共用 Java 数据库
      MYSQL_URI: ${MYSQL_URI:?set shared Java database URI}
      # LangFuse（ADR 0014）— 默认关闭，开启后需配 API Key
      ENABLE_LANGFUSE: "${ENABLE_LANGFUSE:-false}"
      # host.docker.internal 让容器内的 app 能访问宿主机上的 LangFuse 容器（macOS/Windows）
      # Linux 改用 --network host 或显式 bridge 网络
      LANGFUSE_HOST: "${LANGFUSE_HOST:-http://host.docker.internal:3000}"
      LANGFUSE_PUBLIC_KEY: "${LANGFUSE_PUBLIC_KEY:-}"
      LANGFUSE_SECRET_KEY: "${LANGFUSE_SECRET_KEY:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
