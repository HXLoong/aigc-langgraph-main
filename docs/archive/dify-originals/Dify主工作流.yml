            \    }\n  ]\n}\n\n\n\n示例3（机器人转述不视为明确指定 - 默认处理所有）：\nquery包含机器人转述：您希望下单的是\"\
            我要下3M那单\"，以下哪一单，还是全部订单？\n用户当前指令: \"@机器人 TWAP 限价 11.5 100万，13:11-13:20\"\
            \n上下文存在：Q-20250903-000027(1M)、Q-20250903-000028(2M)、Q-20250903-000026(3M)三个订单\n\
            分析：机器人的转述不视为用户的明确指定，用户当前指令中也没有明确指定，按默认行为处理所有订单；没有指定交易对手\n你的JSON输出：\n{\n\
            \  \"operate\": \"交易\",\n  \"type\": \"place_order_from_quote\",\n  \"\
            orderList\": [\n    {\n      \"orderId\": \"Q-20250903-000027\",\n   \
