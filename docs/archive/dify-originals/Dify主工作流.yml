            \   - 如果原始输入中是连续的\"代码+名称\"或\"名称+代码\"整体串,输出是否与该整体串**完全一致**? (禁止只截取前半段或后半段!)\n\
            \   - 所有placeOrderStartTime/placeOrderEndTime都能在swap_query中找到对应的**原始时间片段**?\
            \ (仅允许补零差异,禁止把\"5:00\"改成\"17:00\")\n   - 如果原始输入是\"9:00-5:00\",输出是否仍对应左侧\"\
            9:00\"和右侧\"5:00\"? 若输出成\"09:00\"/\"17:00\",说明发生时间幻觉或语义改写,必须重提!\n   - 所有数量、价格等数值字段准确无误?\n\
            \   - 未提供的字段都设为null? (禁止默认值!)\n\n**【最终原则】**:\n\n1. **JSON优先**: 有JSON订单列表时,关键字段必须从JSON提取\n\
            2. **零污染**: 绝不使用提示词示例中的任何业务数据\n3. **零幻觉**: 输出的每个值都能在输入中找到\n4. **零默认**:\
            \ 未提供的字段只能是null\n\n---\n\n **【最终执行前强制协议】**\n\n**在开始处理之前,完成以下确认**:\n\n\
            **1. JSON订单列表检测**:\n\n   - 我的swap_query是否包含`[{...placeOrderShortname...}]`格式的JSON数组?\n\
            \   - 有 → 从JSON提取关键字段(交易对手、数量等)\n   - 无 → 从文本数据提取\n\n**2. 数据来源确认**:\n\n\
            \   - 我即将处理的是实际输入变量`swap_query` (正确)\n   - 还是提示词示例部分的数据? (错误,严重污染!)\n\n\
            **3. 多订单场景确认**(如适用):\n\n   - 输入数据有N行订单 → 必须输出N个订单\n   - 多行相同账户名 → 每行都是独立订单,不合并\n\
            \n**4. 核心承诺**:\n\n   - 我承诺: 优先使用JSON数据(如果有)\n   - 我承诺: 绝不使用提示词示例中的业务数据\n\
