            \ 当无法确定时，优先考虑是否为知名上市公司、ETF、指数或期货品种。\n- **标的代码识别**：用户提到带有数字+交易所后缀格式的编码时提取。\n\
            \  - 常见格式：`数字.SH`、`数字.SZ`、`数字.OF`、`字母+数字.GFE`、`A+数字.SH/SZ` 等。\n  - 用户可能省略后缀（如\"\
            600519\"），也应提取。\n- 原样输出用户给出的内容，不做标准化或补全。\n\n### 示例\n\n假设交易对手列表包含：ctptyId=10049\
            \ shortName=\"临沂阿凡提\"，ctptyId=11125 shortName=\"11125测试短名（张天琪专用）\"，ctptyId=15912\
