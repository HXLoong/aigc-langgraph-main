    - data:
        code: "\"\"\"\n\n参与型看涨、雪球参数解析\n\n\"\"\"\n\nimport requests\nimport json\n\
          import time\nimport hashlib\n\n\ndef main(goatsBaseUrl: str,\n         query:\
          \ str,\n         chatRoomId: str,\n         chatUserId: str,\n         clientid:\
          \ str,\n         clientsecret: str,\n         extappsalt: str) -> dict:\n\
          \    # 初始化结果字典(默认错误状态)\n    result = {\n        \"code\": 500,\n       \
          \ \"errMsg\": \"快速询价暂不可用,请检查网络\",\n        \"api_data_result_str\": \"\"\
          ,\n        \"api_data_result_obj\": None,\n        \"http_status\": None,\n\
          \        \"raw_response\": None,\n        \"intent\": \"new_inquiry\",\n\
          \        \"productType\": 0\n    }\n\n    timestamp = int(time.time() *\
          \ 1000)\n    signature_string = f\"{clientid}{timestamp}{extappsalt or ''}\"\
          \n    signature = hashlib.md5(signature_string.encode()).hexdigest().upper()[:16]\n\
          \n    headers = {\n        \"agenttype\": \"WECHAT\",\n        \"agentid\"\
          : f\"{chatRoomId}@tl\",\n        \"agentsubid\": chatUserId or \"\",\n \
          \       \"clientid\": clientid,\n        \"clientsecret\": clientsecret,\n\
          \        \"timestamp\": str(timestamp),\n        \"signature\": signature,\n\
          \    }\n    body = {\n        \"chatInstrument\": query,\n    }\n\n    #\
          \ 尝试发送HTTP请求\n    http_status = None\n    resp = None\n    try:\n      \
          \  resp = requests.post(goatsBaseUrl + \"/internal/agent/option_rfq_instrument_parser\"\
          , headers=headers, json=body,\n                             timeout=10)\n\
          \        http_status = resp.status_code\n    except requests.RequestException:\n\
          \        # 网络异常,使用默认错误结果\n        pass\n\n    # 如果请求成功,继续处理\n    if resp\
          \ is not None and http_status == 200:\n        # 更新http_status到结果中\n   \
          \     result[\"http_status\"] = http_status\n        result[\"raw_response\"\
          ] = resp.text\n\n        # 尝试解析JSON\n        resp_json = None\n        try:\n\
          \            resp_json = resp.json()\n        except json.JSONDecodeError:\n\
          \            # JSON解析失败,保持默认错误结果\n            pass\n\n        # 如果JSON解析成功,进行业务层解析\n\
          \        if resp_json is not None:\n            result[\"api_data_result_obj\"\
          ] = resp_json\n            err_code = resp_json.get(\"errCode\", {}).get(\"\
          code\", -1)\n            err_msg = resp_json.get(\"errMsg\")\n\n       \
          \     if err_code == 50001:\n                # 错误码50001  忽略请求,告诉机器人不需要回复用户任何消息\n\
          \                result[\"code\"] = err_code\n                result[\"\
          errMsg\"] = \"IGNORE_REQUEST_NOT_REPLY_USER\"\n            elif err_code\
          \ == 200:\n                # 成功\n                data_obj = resp_json.get(\"\
          data\", {})\n                result[\"code\"] = 0\n                result[\"\
          errMsg\"] = \"\"\n                result[\"api_data_result_str\"] = json.dumps(data_obj,\
          \ ensure_ascii=False)\n            else:\n                # 失败,其他错误码,直接将err_msg发给用户\n\
          \                result[\"code\"] = err_code\n                result[\"\
          errMsg\"] = err_msg\n    elif http_status is not None:\n        # HTTP状态码非200\n\
          \        result[\"http_status\"] = http_status\n        result[\"raw_response\"\
          ] = resp.text if resp else None\n\n    return result\n\n# if __name__ ==\
          \ '__main__':\n#     result = main(\n#         \"http://tstgoats.gf.com.cn/api\"\
          ,\n#         \"快速询价:欧式看涨,000155,80,1M/2M/3M\",\n#         \"10699224490223310\"\
          ,\n#         \"1688858289377943\",\n#         \"TL_AGENT\",\n#         \"\
          tltest\",\n#         \"aaa\"\n#     )\n#     print(json.dumps(result, ensure_ascii=False,\
          \ indent=2))\n"
        code_language: python3
