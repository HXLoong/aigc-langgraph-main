            \   - [必须] 所有时间都是HH:MM格式(两位小时+冒号+两位分钟)\n   - [必须] 中文冒号已转换为英文冒号\n   - [必须]\
            \ 单位数已补0\n\n[检查点] **【第5步】机器人名称过滤验证**\n   - [必须] 已从所有字段中移除bot_name_list中的机器人名称\n\
