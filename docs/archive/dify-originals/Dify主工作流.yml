    - data:
        code: "\"\"\"\n\nChatflow 输入参数收集至AIGC\n\n\"\"\"\n\nimport requests\nimport\
          \ json\n\n\ndef main(\n        conversationId,\n        messageId,\n   \
          \     quoteAppinfo,\n        roomId,\n        guid,\n        sysQuery,\n\
          \        sysDialogueCount,\n        sysConversationId,\n        sysUserId,\n\
          \        sysFiles,\n        sysAppId,\n        sysWorkflowId,\n        sysWorkflowRunId,\n\
          \        apiUrl,\n        otc_secret) -> dict:\n    url = f\"{apiUrl}/admin-api/dify/chatflow/input\"\
          \n    headers = {\n        \"Content-Type\": \"application/json\",\n   \
          \     \"Authorization\": otc_secret,\n    }\n    payload = {\n        \"\
          conversationId\": conversationId,\n        \"messageId\": messageId,\n \
          \       \"quoteAppinfo\": quoteAppinfo,\n        \"roomId\": roomId,\n \
          \       \"guid\": guid,\n        \"sysQuery\": sysQuery,\n        \"sysDialogueCount\"\
          : sysDialogueCount,\n        \"sysConversationId\": sysConversationId,\n\
          \        \"sysUserId\": sysUserId,\n        \"sysFiles\": sysFiles,\n  \
          \      \"sysAppId\": sysAppId,\n        \"sysWorkflowId\": sysWorkflowId,\n\
          \        \"sysWorkflowRunId\": sysWorkflowRunId\n    }\n    \n    code =\
          \ None\n    error = \"\"\n    response_info = None\n    try:\n        response\
          \ = requests.post(url, json=payload, headers=headers, timeout=5)\n     \
          \   response.raise_for_status()  # HTTP 错误抛异常\n\n        parsed = response.json()\
          \  # 自动解析 JSON\n        code = parsed.get(\"code\")\n        if code ==\
          \ 0:\n            result = parsed.get(\"data\", \"\")\n        elif code\
          \ == 500:\n            result = \"交易指令服务暂不可用\"\n        else:\n        \
          \    result = parsed.get(\"msg\", \"未知错误\")\n\n    except Exception as e:\n\
          \        # 统一处理所有异常，并记录异常信息\n        code = 500\n        result = \"交易指令服务暂不可用\"\
          \n        error = str(e)\n\n    return {\n        \"result\": str(result),\n\
          \        \"code\": code,\n        \"error\": error,\n        \"response\"\
          : response_info\n    }"
        code_language: python3
        desc: ''
