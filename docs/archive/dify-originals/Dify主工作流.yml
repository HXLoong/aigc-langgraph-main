            \ **记忆套用**: 因为前面多次出现相同名称,就复用第一次的结果,而不逐行提取\n   -  **示例污染**: 参考或套用提示词示例部分的任何账户名、标的代码等数据\n\
            \   -  **智能优化**: 对提取的名称进行简繁转换、全半角转换、大小写转换等任何\"优化\"\n\n   **正确做法**:\n\n\
            \   -  每一行都从swap_query独立提取,视为全新任务\n   -  逐字符匹配,一个字都不能错、不能变\n   -  特别警惕中间段(约占总行数30%-70%的区域)\n\
            \   -  提取后验证:所有应该相同的名称是否**完全一致**(逐字节比较)\n\n   **验证标准**:\n\n   - 如果原始输入中所有行的名称都相同\
            \  输出的所有订单的placeOrderShortname也必须**完全相同**\n   - 绝不允许出现任何字符差异(中英混杂、字形相似但不同的字符等)\n\
            \n   **关键原则 - 四个\"零\"**:\n\n   - **零记忆**: 不记忆前面行的提取结果\n   - **零转换**: 不进行任何语言、格式、编码转换\n\
            \   - **零参考**: 不参考提示词中的示例数据\n   - **零变体**: 提取结果与原始输入必须逐字节完全匹配\n\n**示例对比**:\n\
            \n 错误处理(合并/遗漏重复交易对手):\n\n```\n输入数据:\n23 190\n23 180\n\n错误输出: 只有1个订单 {shortname:\
            \ \"23\", quantity: 190}  ← 遗漏了第二个!\n```\n\n 正确处理(独立创建订单):\n\n```\n输入数据:\n\
            23 190\n23 180\n\n正确输出: 2个独立订单\n- {shortname: \"23\", quantity: 190}\n\
            - {shortname: \"23\", quantity: 180}\n```\n\n**最常见错误**:\n\n-  遇到\"23 190\"\
            后,发现后面还有\"23 180\",误认为是重复数据而跳过\n-  使用Set或Map去重,导致相同交易对手的后续订单被覆盖\n-  循环遍历时使用了错误的终止条件,导致最后几行被遗漏\n\
            -  只统计了不同交易对手的数量,而没有统计总行数\n\n**完整案例**:\n多行订单数据输入(11行数据):\n\n```\n第1行(标题):\
            \ 限价6买入0700.HK3280，跟量25，10:00-11:30\n第2行: ACCOUNT_D 600\n第3行: ACCOUNT_E\
            \ 330\n第4行: ACCOUNT_F 410\n第5行: ACCOUNT_G 190\n第6行: ACCOUNT_D 230\n第7行:\
            \ ACCOUNT_E 150\n第8行: ACCOUNT_F 300\n第9行: ACCOUNT_G 180  ← 这一行经常被遗漏!\n\
            第10行: ACCOUNT_F 600\n第11行: ACCOUNT_F 290\n```\n\n 正确输出: 10个订单对象\n\n- 订单1:\
            \ ACCOUNT_D, 600股\n- 订单2: ACCOUNT_E, 330股\n- 订单3: ACCOUNT_F, 410股\n- 订单4:\
            \ ACCOUNT_G, 190股\n- 订单5: ACCOUNT_D, 230股\n- 订单6: ACCOUNT_E, 150股\n- 订单7:\
            \ ACCOUNT_F, 300股\n- 订单8: ACCOUNT_G, 180股  ← 必须包含!\n- 订单9: ACCOUNT_F,\
            \ 600股\n- 订单10: ACCOUNT_F, 290股\n\n 错误输出: 只有9个订单(遗漏了订单8)\n\n**验证方法**:\n\
            \n- orderList.length === 10 (数据行数量)\n- 确认每个交易对手的每次出现都对应一个订单\n- 特别检查重复交易对手的订单是否都被创建\n\
            \n【关键提醒:交易对手空格保留】\n在提取交易对手(placeOrderShortname)时,必须严格保留原始内容中的所有空格:\n\n\
            **场景1:交易对手中间有空格**\n\n```\n用户输入: \"1238.HK ，买入，1657股，限价6， 交易对手： ACCOUNT_M\
            \ NAME\"\nraw_content: \"1238.HK ，买入，1657股，限价6， 交易对手： ACCOUNT_M NAME\"\
            \n正确识别: placeOrderShortname: \"ACCOUNT_M NAME\"(保留中间的空格)\n错误识别: placeOrderShortname:\
            \ \"ACCOUNT_MNAME\"(删除了空格)\n说明: 交易对手内容是\"ACCOUNT_M NAME\",中间有一个空格,必须保留\n\
            ```\n\n**场景2:交易对手多个空格**\n\n```\n用户输入: \"交易对手:  ACCOUNT_M  NAME  \"\n正确识别:\
            \ placeOrderShortname: \"ACCOUNT_M  NAME\"(去除前导空格,保留内部空格,去除尾随空格)\n错误识别:\
            \ placeOrderShortname: \"ACCOUNT_MNAME\"(删除了所有空格)\n说明: 只去除冒号后的前导空格和尾随空格,保留内容本身的所有空格\n\
            ```\n\n**场景3:订单数据中的交易对手**\n\n```\nswap_query中订单数据行:\n\"ACCOUNT_X NAME_Y\
            \ 29000\"\n\n正确识别: placeOrderShortname: \"ACCOUNT_X NAME_Y\"(保留空格)\n错误识别:\
            \ placeOrderShortname: \"ACCOUNT_XNAME_Y\"(删除了空格)\n说明: 账户名称必须保留原始空格\n\
            ```\n\n**核心原则重申**:\n\n1. **保留内部空格**:交易对手内容本身的所有空格必须原样保留\n2. **去除首尾空格**:只能去除冒号后的前导空格和内容尾部的空格\n\
            3. **绝对禁止删除**:不允许删除或修改交易对手内容中间的任何空格\n4. **原样输出**:提取后的交易对手内容必须与用户输入的原始内容(去除首尾空格后)完全一致\n\
            \n【关键提醒:严格禁止字段默认值】\n在提取任何字段时,必须严格遵守\"用户未提供则为null\"的原则,绝对不允许有任何默认值:\n\n\
            **核心原则**:\n\n1. **用户未提供=null**:任何字段如果用户未明确提供,必须为null\n2. **绝对禁止推断**:不允许通过其他信息推断或自动填充字段值\n\
            3. **绝对禁止默认值**:不允许为任何字段设置默认值\n\n**关键字段无默认值强调**:\n\n**1. orderId(订单ID)**\n\
            \n```\n 正确:用户明确提供\"H-20250115-000001\"  orderId: \"H-20250115-000001\"\
            \n 正确:用户未提供  orderId: null\n 错误:自动生成订单ID\n 错误:从其他来源推断订单ID\n```\n\n**2.\
            \ placeOrderWindCode(标的代码/名称)**\n\n```\n 正确:用户说\"茅台\"  placeOrderWindCode:\
            \ \"茅台\"\n 正确:用户说\"600519.SH\"  placeOrderWindCode: \"600519.SH\"\n 正确:用户说\"\
            2333长城汽车\"  placeOrderWindCode: \"2333长城汽车\"\n 正确:用户说\"长城汽车2333\"  placeOrderWindCode:\
            \ \"长城汽车2333\"\n 正确:用户未提供  placeOrderWindCode: null\n 错误:用户说\"茅台\",输出\"\
            600519.SH\"(禁止映射)\n 错误:用户说\"600519.SH\",输出\"贵州茅台\"(禁止映射)\n 错误:用户说\"2333长城汽车\"\
            ,输出\"长城汽车\"(禁止截断连续整体串)\n 错误:用户说\"2333长城汽车\",输出\"2333\"(禁止截断连续整体串)\n```\n\
            \n**3. placeOrderTransactionType(交易品种类型)**\n\n```\n 正确:用户明确说\"A股\"  placeOrderTransactionType:\
            \ \"A_SHARE\"\n 正确:用户明确说\"港股\"  placeOrderTransactionType: \"HK_STOCK\"\
            \n 正确:用户未提供  placeOrderTransactionType: null\n 错误:根据标的代码\"600519.SH\"\
            推断为\"A_SHARE\"\n 错误:根据标的代码\"0700.HK\"推断为\"HK_STOCK\"\n```\n\n**4. placeOrderAlgorithmType(算法类型)**\n\
            \n```\n 正确:用户明确说\"POV\"  placeOrderAlgorithmType: \"POV\"\n 正确:用户明确说\"\
            TWAP\"  placeOrderAlgorithmType: \"TWAP\"\n 正确:用户说\"占35%\"(自动识别为POV) \
            \ placeOrderAlgorithmType: \"POV\", placeOrderPovPercent: 35\n 正确:用户说\"\
            跟量3%\"(自动识别为POV)  placeOrderAlgorithmType: \"POV\", placeOrderPovPercent:\
            \ 3\n 正确:用户说\"占比25%\"(自动识别为POV)  placeOrderAlgorithmType: \"POV\", placeOrderPovPercent:\
            \ 25\n 正确:用户未提供算法类型且无POV关键词  placeOrderAlgorithmType: null\n 错误:用户未明确指定,随意推断为某个算法类型\n\
            说明:\"占\"、\"跟量\"、\"占比\"是POV算法的特征关键词,自动识别为POV是合理的推断\n```\n\n**5. placeOrderShortname(交易对手)**\n\
            \n```\n 正确:用户明确说\"交易对手:10074短名\"  placeOrderShortname: \"10074短名\"\n 正确:用户未提供\
            \  placeOrderShortname: null\n 错误:将机器人名称识别为交易对手\n 错误:为交易对手设置默认值\n```\n\
            \n**6. placeOrderQuantityTotal(总量)**\n\n```\n 正确:用户明确提供总量\"32000股\"  placeOrderQuantityTotal:\
            \ 32000\n 正确:用户未提供总量  placeOrderQuantityTotal: null\n 错误:从数据行的数量推断总量\n\
            \ 错误:自动计算总量\n```\n\n**7. placeOrderOrderDirection(委托方向)**\n\n```\n 正确:用户说\"\
            买入\"或\"买入开仓\"  placeOrderOrderDirection: \"BUY\"\n 正确:用户说\"平空\"或\"买入平仓\"\
            \  placeOrderOrderDirection: \"SHORT_CLOSE\"(买入平仓=平空!)\n 正确:用户说\"卖空\"\
            或\"卖出开仓\"  placeOrderOrderDirection: \"SHORT_OPEN\"(卖出开仓=卖空!)\n 正确:用户说\"\
            卖出\"或\"卖出平仓\"  placeOrderOrderDirection: \"SELL\"(卖出平仓=卖出!)\n 错误:用户说\"\
            卖出开仓\"  placeOrderOrderDirection: \"SELL\"(严重错误!卖出开仓≠卖出,应为SHORT_OPEN!)\n\
            \ 错误:用户说\"卖出平仓\"  placeOrderOrderDirection: \"SHORT_CLOSE\"(严重错误!卖出平仓≠平空,应为SELL!)\n\
            \ 错误:用户说\"卖空\"  placeOrderOrderDirection: \"SELL\"(严重错误!卖空≠卖出,应为SHORT_OPEN!)\n\
            \ 错误:用户说\"买入平仓\"  placeOrderOrderDirection: \"BUY\"(严重错误!买入平仓≠买入,应为SHORT_CLOSE!)\n\
            \ 错误:用户说\"买入平仓\"  placeOrderOrderDirection: \"BUY_CLOSE\"(严重错误!无此枚举值!)\n\
            \ 正确:数据列为空或缺失  placeOrderOrderDirection: null\n 正确:用户未提供  placeOrderOrderDirection:\
            \ null\n 错误:数据列为空,输出\"SELL\"(禁止设置默认值)\n 错误:用户未明确说明方向,自动推断为某个方向\n```\n\n\
            **8. 其他所有字段**\n\n```\n原则:所有字段都适用相同规则\n 正确:用户明确提供  提取用户提供的值\n 正确:用户未提供\
            \  null\n 错误:设置默认值\n 错误:自动推断\n 错误:使用外部知识映射\n```\n\n**关键示例对比**:\n\n**示例1:POV算法自动识别**\n\
            \n```\n用户输入:\"HTIF2504 空 1657股 市价 占35%\"\n 正确识别:\n- placeOrderAlgorithmType:\
            \ \"POV\"(自动识别,\"占\"是POV关键词)\n- placeOrderPovPercent: 35(明确提供了百分比)\n说明:\"\
            占35%\"中的\"占\"关键词表达了POV算法意图,应自动识别\n\n用户输入:\"茅台 卖出 跟量3%\"\n 正确识别:\n- placeOrderAlgorithmType:\
            \ \"POV\"(自动识别,\"跟量\"是POV关键词)\n- placeOrderPovPercent: 3\n说明:\"跟量3%\"\
            中的\"跟量\"关键词表达了POV算法意图,应自动识别\n```\n\n**示例2:市场类型不允许推断**\n\n```\n用户输入:\"\
            600519.SH 买入 1000股\"\n 正确识别:\n- placeOrderWindCode: \"600519.SH\"\n- placeOrderTransactionType:\
            \ null(未明确说明市场类型)\n 错误识别:\n- placeOrderTransactionType: \"A_SHARE\"(不允许根据代码推断)\n\
            ```\n\n**示例3:标的代码不允许映射**\n\n```\n用户输入:\"茅台 卖出 500股\"\n 正确识别:\n- placeOrderWindCode:\
            \ \"茅台\"(原样输出)\n 错误识别:\n- placeOrderWindCode: \"600519.SH\"(不允许映射)\n```\n\
            \n**示例4:代码+名称连续整体串必须完整保留**\n\n```\n用户输入:\"2333长城汽车 买入 500股\"\n 正确识别:\n\
            - placeOrderWindCode: \"2333长城汽车\"(完整保留原始整体串)\n 错误识别:\n- placeOrderWindCode:\
            \ \"长城汽车\"(错误!只保留了名称)\n- placeOrderWindCode: \"2333\"(错误!只保留了代码)\n\n用户输入:\"\
            港股 2333长城汽车 买入 500股\"\n 正确识别:\n- placeOrderTransactionType: \"HK_STOCK\"\
            \n- placeOrderWindCode: \"2333长城汽车\"(移除市场类型后,仍完整保留标的整体串)\n 错误识别:\n- placeOrderWindCode:\
            \ \"长城汽车\"(错误!先移除了市场类型,又错误截断了标的整体串)\n```\n\n**绝对禁止的行为**:\n\n1.  为任何字段设置默认值(除POV算法的关键词自动识别外)\n\
            2.  通过其他字段推断某个字段的值(如根据标的代码推断市场类型)\n3.  使用模型预训练知识进行映射(如标的名称与代码的映射)\n4.\
            \  根据业务逻辑\"智能\"填充字段(用户未明确提供的字段)\n5.  假设用户的意图并自动补全(除POV算法的关键词识别外)\n\n**特殊说明**:\n\
            \n- **POV算法关键词识别是允许的**:\"占\"、\"跟量\"、\"占比\"这些关键词本身就明确表达了POV算法的意图,因此自动识别为POV算法类型是合理的\n\
            - **其他算法类型不允许推断**:TWAP、VWAP、ICEBERG、SNIPER必须用户明确指定,不允许通过任何方式推断\n\n**强制要求**:\n\
            \n- 如果用户未明确提供某个字段的值,该字段**必须**为null\n- 这是不可违反的硬性规则,无任何例外\n\n---\n\n【关键提醒:多订单参数补充完整性保证】\n\
            在所有涉及参数补充的场景中,必须严格遵守订单列表完整性原则:\n\n1. **核心要求**:\n   - orderList必须包含**所有原始订单**,一个都不能少\n\
            \   - 只修改需要补充参数的订单,其他订单保持原样\n   - 不能因为只修改部分订单就只输出这些订单\n\n2. **常见错误**:\n\
            \   -  处理多笔订单时,补充参数后只输出1笔(严重错误!)\n   -  5笔订单中2笔需要补充,只输出这2笔(严重错误!)\n  \
            \ -  用户明确指定\"第3笔\",只输出第3笔(严重错误!)\n\n3. **正确做法**:\n   -  始终输出所有订单的完整信息\n\
            \   -  需要修改的订单使用新参数值\n   -  不需要修改的订单保持原始参数值\n\n4. **验证方法**:\n   - 检查history_query_str中原始订单数量\n\
            \   - 确保输出的orderList数量与原始数量相同\n   - 确认每个订单的完整参数都被保留\n\n5. **严重后果**:\n\
            \   - 订单丢失会导致用户的交易请求部分失效\n   - 这是不可接受的业务逻辑错误\n   - 必须100%保证订单列表的完整性\n\n\
            **测试场景提醒**:\n\n- 场景1: 3笔订单,补充第3笔POV比例  必须输出3笔完整订单\n- 场景2: 5笔订单,补充第2、4笔交易对手\
            \  必须输出5笔完整订单\n- 场景3: 多笔订单,用户分批补充参数  每次都必须输出所有订单\n- 场景4: 2笔订单,切换第2笔标的\
            \  必须输出2笔完整订单(第1笔保持原样,第2笔更新标的代码)\n\n**【极其重要】切换订单标的场景规则**:\n\n当机器人返回多笔订单详情并附带候选标的列表,用户引用该消息并通过\"\
            订单序号+标的序号\"格式(如\"序号2, 7\"、\"2号订单 第3个\"等)切换某个订单的标的时,必须遵循以下规则:\n\n1. **意图识别**:\
            \ 识别为place_order_request(订单尚未下单,用户在调整下单参数)\n2. **订单列表完整性**: orderList必须包含**所有原始订单**,绝对禁止只返回被修改的那一笔订单\n\
            3. **参数处理**:\n   - **被切换标的的订单**: 仅更新placeOrderWindCode为用户选择的候选标的代码,其他参数保持原值\n\
            \   - **未被修改的订单**: 保持所有原始参数不变,完整输出\n4. **候选标的匹配**: 从quote_content中的候选标的列表中,按用户指定的序号匹配对应的标的代码\n\
            5. **常见错误(严格禁止)**:\n   -  只输出被切换标的的那一笔订单,丢失其他订单(严重错误!)\n   -  切换标的后改变了该订单的其他参数(如数量、方向等)(错误!)\n\
            \n**切换标的场景示例**:\n\nquote_content(机器人消息,包含N笔订单,每笔订单附带候选标的列表):\n```\n-----场外收益互换详情-----\n\
            序号：1\n单号：<ORDER_ID_1>\n标的代码：<WIND_CODE_A>\n...(其他参数)\n\n若需选择其他标的，请回复对应序号：\n\
            1. <WIND_CODE_A> - <名称A>（已默认）\n2. <WIND_CODE_A2> - <名称A2>\n3. <WIND_CODE_A3>\
            \ - <名称A3>\n\n-----场外收益互换详情-----\n序号：2\n单号：<ORDER_ID_2>\n标的代码：<WIND_CODE_B>\n\
            ...(其他参数)\n\n若需选择其他标的，请回复对应序号：\n1. <WIND_CODE_B> - <名称B>（已默认）\n2. <WIND_CODE_B2>\
            \ - <名称B2>\n3. <WIND_CODE_B3> - <名称B3>\n4. <WIND_CODE_B4> - <名称B4>\n```\n\
            \n用户当前输入: `序号2, 3`（含义：将序号2的订单标的切换为其候选列表中第3个）\n\n解析说明:\n- 从quote_content中序号2的候选列表找到第3个标的：`<WIND_CODE_B3>`\n\
            - **必须同时输出序号1和序号2两笔订单的完整信息**\n- 序号1订单保持原样不变\n- 序号2订单仅更新placeOrderWindCode为`<WIND_CODE_B3>`,其他参数全部保持原值\n\
            \nJSON输出:\n```json\n{\n  \"type\": \"place_order_request\",\n  \"orderList\"\
            : [\n    {\n      \"orderId\": \"<ORDER_ID_1>\",\n      \"placeOrderWindCode\"\
