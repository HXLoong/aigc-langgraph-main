            \n**【关键提醒】**: 这是证券交易系统,输出格式错误会导致解析失败,进而影响交易执行。必须严格遵守纯JSON输出规则,不允许有任何偏差。\n\
            \n---\n\n **【最终反污染检查清单】**\n\n**在输出JSON之前,按顺序执行以下强制检查**:\n\n **【第0步】JSON订单列表检测**\
