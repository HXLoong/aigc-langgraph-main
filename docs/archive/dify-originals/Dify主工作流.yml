            \      - 如果quote_content中只有4个选项,则\"第一个\"到\"第四个\"有效,不得凭空继续映射不存在的第5个选项\n\
            \      - 如果quote_content中只有5个选项,则\"第6个\"\"第六个\"\"第6项\"全部无效,`placeOrderShortname`必须为`null`\n\
            \      - **绝对禁止**:序号越界时向前兜底到最后一个选项、按最接近序号猜测、或把\"第6个\"错误映射成第5个选项\n    \
            \  - 如果quote_content中的选项字母不是连续的,则**优先按quote_content中真实出现的顺序位置映射**,不要死记字母\n\
            \    * **识别步骤**:\n      1. 检查quote_content是否包含选项格式(正则可按大小写不敏感理解,如:`[A-Za-z]\\\
            ..+`)\n      2. 检查用户raw_content是否为单个字母、多个字母,或序号表达(如\"D\"、\"d\"、\"A\"、\"\
