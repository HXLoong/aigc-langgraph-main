            \      - **序号从1开始计数(1-based)**:\"第1个\"就是第1个真实选项,绝对不是第0个;不允许0-based、就近匹配或模糊猜测\n\
            \      - **【最高优先级门禁 — 序号越界校验,查映射表之前必须先执行,不可跳过】**:\n        处理\"第x个\"时,必须严格按以下顺序执行,禁止跳步:\n\
            \        ```\n        步骤1: 扫描quote_content,统计形如[A-Z].的有效选项数 → N = ?\n\
            \        步骤2: 从用户输入提取序号 → x = ?\n        步骤3: 判断 x 是否在 [1, N] 范围内?\n \
