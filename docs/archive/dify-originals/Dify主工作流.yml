    - data:
        code: "/**\n * 平仓参数提取 - 引用消息解析（代码节点1）\n *\n * 输入：quote_content（用户引用的消息内容）\n\
          \ * 输出：\n *   - messageType: \"holding_list\" | \"close_result\"\n *   -\
          \ successOrders: 成功订单数组（含完整参数，从引用消息提取）\n *   - errorOrderIds: 需处理的订单ID数组（参数错误\
          \ + 全部平仓确认，合并输出）\n *   - holdingMap: 持仓映射（序号→单号→合约编号）\n *   - fullCloseIds:\
          \ 全部平仓确认订单ID数组\n *   - pureErrorOrderIds: errorOrderIds - fullCloseIds\n\
          \ *   - pureErrorOrderCount: pureErrorOrderIds.length\n *   - holdingMapCandidateCount:\
          \ holdingMap 中可绑定候选条目数（仅统计有 orderId 的条目）\n *   - hasSingleHoldingCandidate:\
          \ 是否恰好只有 1 个可绑定候选\n *   - singleHoldingCandidateOrderId: 唯一候选订单ID，否则为 null\n\
          \ */\nfunction main({ quote_content }) {\n    const text = (quote_content\
          \ || '').trim();\n\n    const result = {\n        messageType: 'holding_list',\n\
          \        successOrders: [],\n        errorOrderIds: [],\n        holdingMap:\
          \ [],\n        fullCloseIds: [],\n        pureErrorOrderIds: [],\n     \
          \   pureErrorOrderCount: '0',\n        holdingMapCandidateCount: '0',\n\
          \        hasSingleHoldingCandidate: 'false',\n        singleHoldingCandidateOrderId:\
          \ 'null'\n    };\n\n    if (!text) {\n        return result;\n    }\n\n\
          \    // 判断是否为平仓结果消息（路径B）\n    // 可能只有成功订单、只有错误订单、只有全仓确认，或它们的组合\n    const\
          \ isCloseResult = text.includes('以下平仓申请，请核对详情后确认')\n        || text.includes('参数需要完善')\n\
          \        || text.includes('只能全部平仓');\n\n    if (isCloseResult) {\n     \
          \   result.messageType = 'close_result';\n\n        // 提取成功订单（从\"场外期权平仓详情\"\
          部分）\n        result.successOrders = parseSuccessOrders(text);\n\n      \
          \  // 提取参数错误订单ID\n        const errorIds = parseErrorOrderIds(text);\n\n\
          \        // 提取全部平仓确认订单ID\n        const fullCloseIds = parseFullCloseOrderIds(text);\n\
          \n        // 合并输出到 errorOrderIds（去重）\n        result.errorOrderIds = uniqueArray([...errorIds,\
          \ ...fullCloseIds]);\n        result.fullCloseIds = uniqueArray(fullCloseIds);\n\
          \n        // close_result 消息中同样包含序号/单号/合约编号，需要构建 holdingMap 供下游使用\n    \
          \    result.holdingMap = parseHoldingMap(text);\n    } else {\n        result.messageType\
          \ = 'holding_list';\n\n        // 提取持仓映射\n        result.holdingMap = parseHoldingMap(text);\n\
          \    }\n\n    fillDerivedFacts(result);\n    return result;\n}\n\n/**\n\
          \ * 解析成功订单详情\n * 从\"-----场外期权平仓详情-----\"到\"若订单无误\"之间的内容\n */\nfunction parseSuccessOrders(text)\
          \ {\n    const orders = [];\n\n    // 按\"序号：\"分割多个订单块\n    // 先找到详情区域（从第一个\"\
          序号：\"到\"若订单无误\"或\"以下订单存在参数错误\"或\"以下合约名义本金\"之前）\n    const detailEndMarkers\
          \ = [\n        '若以上订单执行平仓操作',\n        '期权平仓订单'\n    ];\n\n    // 找到所有\"\
          序号：N\"的位置\n    const orderBlocks = [];\n    const seqRegex = /序号[：:]\\s*(\\\
          d+)/g;\n    let match;\n    const seqPositions = [];\n\n    while ((match\
          \ = seqRegex.exec(text)) !== null) {\n        seqPositions.push({ index:\
          \ match.index, seq: parseInt(match[1]) });\n    }\n\n    // 找到详情区域的结束位置\n\
          \    let detailEnd = text.length;\n    for (const marker of detailEndMarkers)\
          \ {\n        const idx = text.indexOf(marker);\n        if (idx !== -1 &&\
          \ idx < detailEnd) {\n            detailEnd = idx;\n        }\n    }\n\n\
          \    // 只处理在详情区域内的序号\n    const validPositions = seqPositions.filter(p =>\
          \ p.index < detailEnd);\n\n    for (let i = 0; i < validPositions.length;\
          \ i++) {\n        const start = validPositions[i].index;\n        const\
          \ end = i + 1 < validPositions.length ? validPositions[i + 1].index : detailEnd;\n\
          \        const block = text.substring(start, end);\n\n        const order\
          \ = parseOrderBlock(block);\n        if (order && order.orderId) {\n   \
          \         orders.push(order);\n        }\n    }\n\n    return orders;\n\
          }\n\n/**\n * 解析单个订单块\n */\nfunction parseOrderBlock(block) {\n    const\
          \ order = {\n        orderId: null,\n        closeOrderNotionalDelta: null,\n\
          \        closeOrderType: null,\n        closeOrderPrice: null,\n       \
          \ closeOrderPovRatio: null,\n        closeOrderAlgoStartTime: null,\n  \
          \      closeOrderAlgoEndTime: null,\n        confirmFullClose: null\n  \
          \  };\n\n    // 提取单号\n    const orderIdMatch = block.match(/单号[：:]\\s*(CO-\\\
          d{8}-[0-9A-F]{8})/);\n    if (orderIdMatch) {\n        order.orderId = orderIdMatch[1];\n\
          \    }\n\n    return order;\n}\n\n/**\n * 解析参数错误订单ID列表\n * 格式：期权平仓订单[CO-20260306-A5C8005D]参数需要完善：\n\
          \ */\nfunction parseErrorOrderIds(text) {\n    const ids = [];\n    const\
          \ regex = /期权平仓订单\\[(CO-\\d{8}-[0-9A-F]{8,})\\]参数需要完善/g;\n    let match;\n\
          \    const seen = new Set();\n    while ((match = regex.exec(text)) !==\
          \ null) {\n        if (!seen.has(match[1])) {\n            seen.add(match[1]);\n\
          \            ids.push(match[1]);\n        }\n    }\n    return ids;\n}\n\
          \n/**\n * 解析全部平仓确认订单ID列表\n * 格式：期权平仓订单CO-20260306-54948DB0：合约名义本金≤100万，只能全部平仓。\n\
          \ */\nfunction parseFullCloseOrderIds(text) {\n    const ids = [];\n   \
          \ const regex = /期权平仓订单(CO-\\d{8}-[0-9A-F]{8,})[：:].*?只能全部平仓/g;\n    let\
          \ match;\n    const seen = new Set();\n    while ((match = regex.exec(text))\
          \ !== null) {\n        if (!seen.has(match[1])) {\n            seen.add(match[1]);\n\
          \            ids.push(match[1]);\n        }\n    }\n    return ids;\n}\n\
          \n/**\n * 解析持仓列表映射\n */\nfunction parseHoldingMap(text) {\n    const holdings\
          \ = [];\n\n    // 匹配序号\n    const seqRegex = /序号[：:]\\s*(\\d+)/g;\n    const\
          \ seqPositions = [];\n    let match;\n    while ((match = seqRegex.exec(text))\
          \ !== null) {\n        seqPositions.push({ index: match.index, seq: parseInt(match[1])\
          \ });\n    }\n\n    for (let i = 0; i < seqPositions.length; i++) {\n  \
          \      const start = seqPositions[i].index;\n        const end = i + 1 <\
          \ seqPositions.length ? seqPositions[i + 1].index : text.length;\n     \
          \   const block = text.substring(start, end);\n\n        const orderIdMatch\
          \ = block.match(/单号[：:]\\s*(CO-\\d{8}-[0-9A-F]{8})/);\n        const contractMatch\
          \ = block.match(/合约编号[：:]\\s*(OPT[G]?-[A-Z0-9]+)/);\n\n        holdings.push({\n\
          \            seq: seqPositions[i].seq,\n            orderId: orderIdMatch\
          \ ? orderIdMatch[1] : null,\n            contractId: contractMatch ? contractMatch[1]\
          \ : null\n        });\n    }\n\n    return holdings;\n}\n\n/**\n * 基于已解析字段补充下游\
          \ prompt 直接可用的确定性事实\n */\nfunction fillDerivedFacts(result) {\n    const\
          \ fullCloseIdSet = new Set(Array.isArray(result.fullCloseIds) ? result.fullCloseIds\
          \ : []);\n    const errorOrderIds = Array.isArray(result.errorOrderIds)\
          \ ? result.errorOrderIds : [];\n    const holdingMap = Array.isArray(result.holdingMap)\
          \ ? result.holdingMap : [];\n\n    result.pureErrorOrderIds = errorOrderIds.filter(id\
          \ => id && !fullCloseIdSet.has(id));\n    result.pureErrorOrderCount = String(result.pureErrorOrderIds.length);\n\
          \n    const bindableCandidates = holdingMap.filter(item => item && item.orderId);\n\
          \    result.holdingMapCandidateCount = String(bindableCandidates.length);\n\
          \    result.hasSingleHoldingCandidate = String(bindableCandidates.length\
          \ === 1);\n    result.singleHoldingCandidateOrderId = bindableCandidates.length\
          \ === 1\n        ? bindableCandidates[0].orderId\n        : 'null';\n}\n\
          \n/**\n * 数组去重并保留原始顺序\n */\nfunction uniqueArray(arr) {\n    const seen\
          \ = new Set();\n    return (arr || []).filter(item => {\n        if (seen.has(item))\
          \ return false;\n        seen.add(item);\n        return true;\n    });\n\
          }\n\n/**\n * 清理数字字符串：去掉末尾多余的0和小数点\n * \"1000000.0000\" → \"1000000\"\n *\
          \ \"500000\" → \"500000\"\n */\nfunction cleanNumber(numStr) {\n    const\
          \ num = parseFloat(numStr);\n    if (isNaN(num)) return numStr;\n    //\
          \ 如果是整数，返回整数字符串\n    if (Number.isInteger(num)) return String(num);\n  \
          \  // 否则返回去掉尾部0的字符串\n    return String(num);\n}\n\n/**\n * 清理数字并转为number类型\n\
          \ * \"10.0000\" → 10\n */\nfunction cleanNumberToNum(numStr) {\n    const\
          \ num = parseFloat(numStr);\n    if (isNaN(num)) return null;\n    return\
          \ num;\n}\n\n/**\n * 补齐时间格式 \"9:30\" → \"09:30\"\n */\nfunction padTime(timeStr)\
          \ {\n    const parts = timeStr.split(':');\n    if (parts.length !== 2)\
          \ return timeStr;\n    return parts[0].padStart(2, '0') + ':' + parts[1];\n\
          }\n"
        code_language: javascript
