            \    - 匹配时应支持模糊位置(交易对手名称可能出现在输入的任意位置)\n    - 如果匹配到多个,按在swap_query中出现的顺序对应到各订单\n\
            \  * **如果shortname_list为空或未匹配到**:回退到传统提取规则\n  * **传统提取规则**:\n    - **必须从swap_query原始输入逐字符提取**,绝不使用提示词示例中的任何账户名\n\
            \    - **每一行都重新提取**:处理第N行时,必须从swap_query第N行提取,不得记忆前面行的结果或示例\n    - **验证提取结果**:提取后必须确认该账户名在swap_query中真实存在\n\
            \    - **绝对禁止**:输出任何不在swap_query中的账户名（即使它在提示词示例中出现过）\n\n- **重要前置步骤**:在识别交易对手之前,必须先执行【机器人名称过滤规则】,从输入内容中移除所有机器人名称\n\
            - 识别模式:\n  - \"交易对手:XXXX\"提取\"XXXX\"(冒号后完整内容,最优先识别);\n  - \"交易对手: XXXX\"\
