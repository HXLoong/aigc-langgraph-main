            \ → 输出\"2333长城汽车\"（正确!完整保留）\n    - **正确示例**: 用户输入\"长城汽车2333\" → 输出\"长城汽车2333\"\
            （正确!完整保留）\n3.  placeOrderQuantity(委托数量)能否在swap_query原始输入中找到对应的数字?\n4.\
            \  所有字段值是否都来自当前任务的实际输入,而非提示词中的任何示例?\n5.  如果某个字段值在提示词示例中曾经出现过,是否确认了它也在当前swap_query输入中真实存在?\n\
            \n**【最常见的污染错误及检测方法】**:\n **错误类型1**: swap_query中的账户名是\"<ACCOUNT_A>\",但输出变成了\"\
            <ACCOUNT_B>\"（来自示例）\n    **检测**: 输出的账户名是否在swap_query中? 如果不在,这就是示例污染!\n\
            \ **错误类型2**: swap_query中的账户名是\"<ACCOUNT_X>\",但输出变成了示例中的某个账户名\n    **检测**:\
            \ 输出的账户名是否在swap_query中? 如果不在,这就是示例污染!\n **错误类型3**: 第3笔订单的交易对手从swap_query中的真实值变成了示例中的某个值\n\
            \    **检测**: 是否每一行都从swap_query重新提取,还是记忆了示例中的数据?\n\n**【强制执行的零污染原则】**:\n\
            **零记忆**: 不记忆提示词示例中的任何账户名、标的代码、数量等业务数据\n**零套用**: 绝不将提示词示例中的数据套用到当前识别任务\n\
            **零推断**: 如果输入中没有某个字段,输出null,绝不从示例中\"借用\"数据\n**逐行验证**: 处理每一行数据时,必须从swap_query重新提取,验证提取结果在原始输入中存在\n\
            \n【输入数据说明】\n\n**【关键提醒】这些是实际输入变量，不是提示词内容！**\n\n系统将在实际调用时以变量形式提供以下输入数据:\n\
            \n1. **swap_query** (主要数据源):\n   - 这是你要处理的真实用户输入数据\n   - 聚合后的用户查询内容,包含以下几种场景:\n\
            \     * **文本场景**:swap_query = 用户的原始文本消息\n     * **【新增】订单列表场景**:swap_query\
