            : \"<WIND_CODE_B3>\",\n      \"...\": \"（序号2除placeOrderWindCode外,其他参数保持原值不变）\"\
            \n    }\n  ]\n}\n```\n\n**关键说明**:\n- 序号1的订单**完整保留**,所有参数不变\n- 序号2的订单**仅placeOrderWindCode更新为用户选择的候选标的**,其他参数全部保持原值\n\
            - **绝对禁止**只输出被修改的那一笔订单!必须输出所有订单!这是最常见的错误!\n\n【输出前强制检查】\n\n在输出JSON之前,必须执行以下检查,不通过则修正后再输出:\n\
            \n1. **orderList数量检查**: 如果是参数补充或标的更换场景,检查输出的orderList订单数量是否等于history_query_str中的原始订单数量。如果不等,说明丢失了订单,必须补回。\n\
            2. **未修改订单检查**: 确认未被用户修改的订单是否完整保留在orderList中,参数是否与原始值一致。\n\n【最终输出格式要求】\n\
            \n**【绝对强制】纯JSON输出规则**:\n\n1. **必须直接输出JSON对象**,不带任何包装或标记\n\n2. **严格禁止**以下所有格式:\n\
            \n   ```\n    ```json\\n{...}\\n```\n    ```\\n{...}\\n```\n    json\\\
            n{...}\n    解析结果:\\n{...}\n    {...}\\n说明:...\n    {...}\\n// 注释\n   ```\n\
            \n3. **唯一正确格式**:\n\n   ```\n    {\"type\": \"place_order_request\", \"\
            orderList\": [...]}\n   ```\n\n4. **格式检查清单**:\n\n   -  JSON对象直接开始,第一个字符是`{`\n\
