    - data:
        code: "\nfunction main({mergeData, codes}) {\n    if (typeof mergeData ===\
          \ 'string') { try { mergeData = JSON.parse(mergeData); } catch (e) { mergeData\
          \ = {}; } }\n    if (typeof codes === 'string') { try { codes = JSON.parse(codes);\
          \ } catch (e) { codes = []; } }\n    if (!mergeData || typeof mergeData\
          \ !== 'object') mergeData = {};\n    // codes 可能是 { result: [...] } 格式，取\
          \ result 字段\n    if (codes && !Array.isArray(codes) && Array.isArray(codes.result))\
          \ codes = codes.result;\n    if (!Array.isArray(codes)) codes = [];\n\n\
          \    // 构建 orgStr -> keyword 字符串数组 的映射\n    var codeMap = {};\n    for (var\
          \ i = 0; i < codes.length; i++) {\n        var c = codes[i];\n        if\
          \ (c && c.orgStr != null) {\n            codeMap[c.orgStr] = Array.isArray(c.keywords)\n\
          \                ? c.keywords.map(function(k) { return { keyword: k.keyword,\
          \ isFull: k.isFull }; })\n                : [];\n        }\n    }\n\n  \
          \  var orderList = Array.isArray(mergeData.orderList) ? mergeData.orderList\
          \ : [];\n    for (var j = 0; j < orderList.length; j++) {\n        var item\
          \ = orderList[j];\n        if (!item || typeof item !== 'object') continue;\n\
          \        try {\n            var matched = codeMap.hasOwnProperty(item.placeOrderWindCode)\n\
          \                ? codeMap[item.placeOrderWindCode]\n                : [];\n\
          \            item.placeOrderWindCodeList = matched;\n        } catch (e)\
          \ {\n            item.placeOrderWindCodeList = [];\n        }\n    }\n\n\
          \    return { result: mergeData };\n}\n"
        code_language: javascript
