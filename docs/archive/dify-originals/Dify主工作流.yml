            \n解析映射：序号1=OPT-SZZSCF20260001→CO-20260304-759125AD，序号2=OPTG-SZZSCF20250029→CO-20260304-287F166F，序号3=OPTG-SZZSCF20250030→CO-20260304-363EF4E8\n\
            用户指定了 OPT-SZZSCF20260001（匹配第1笔）和第三笔（匹配第3笔）：\n\n```json\n{\n  \"confirmCancelOrderNoList\"\
