            \   - **第一重**: 无JSON? → 每个placeOrderShortname必须在swap_query中逐字符找到\n   -\
            \ **第二重**: 特别检查第3笔及以后的订单(最容易污染)\n\n **【第3步】订单数量验证**\n\n   - 有JSON? → orderList.length必须等于JSON数组长度\n\
