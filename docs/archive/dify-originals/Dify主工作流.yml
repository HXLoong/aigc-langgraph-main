            \n---\n\n**【重要提醒】**: 以下所有示例的JSON输出都是**纯JSON格式**,不带\\`\\`\\`json标记,实际输出时也必须如此。\n\
            \n**【示例格式说明】**: 下面每个示例中的\"用户:\"/\"swap_query内容:\"等都是示例的一部分，用于展示格式。实际识别时，你会收到真实的`swap_query`变量，而不是这些示例文本。\n\
