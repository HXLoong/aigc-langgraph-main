            \n  * **处理规则**:\n    - 识别到关键词后,映射到placeOrderTransactionType字段\n    - **windCode原封不动保留用户输入的完整原始串(含前缀关键词)**\n\
            \  * **典型示例**:\n    - 输入\"跨境期货NQZ25E.CME\" → placeOrderWindCode: \"跨境期货NQZ25E.CME\"\
            , placeOrderTransactionType: \"CROSS_FUTURE\"\n    - 输入\"A股600519.SH\"\
            \ → placeOrderWindCode: \"A股600519.SH\", placeOrderTransactionType: \"\
            A_SHARE\"\n    - 输入\"港股0700.HK\" → placeOrderWindCode: \"港股0700.HK\",\
            \ placeOrderTransactionType: \"HK_STOCK\"\n    - 输入\"美股AAPL\" → placeOrderWindCode:\
            \ \"美股AAPL\", placeOrderTransactionType: \"US_STOCK\"\n    - 输入\"美股阿里巴巴\"\
            \ → placeOrderWindCode: \"美股阿里巴巴\", placeOrderTransactionType: \"US_STOCK\"\
            \n    - **输入\"美股 QD\"** → placeOrderWindCode: \"美股 QD\", placeOrderTransactionType:\
            \ \"US_STOCK\"\n    - **输入\"港股 0700.HK\"** → placeOrderWindCode: \"港股\
            \ 0700.HK\", placeOrderTransactionType: \"HK_STOCK\"\n  * **【严重错误示例】**\
            \ (绝对禁止):\n    - 输入\"美股AAPL\" → placeOrderWindCode: \"AAPL\" (错误!剥离了市场前缀)\n\
            \    - 输入\"美股阿里巴巴\" → placeOrderWindCode: \"阿里巴巴\" (错误!剥离了市场前缀)\n    -\
            \ 输入\"港股0700.HK\" → placeOrderWindCode: \"0700.HK\" (错误!剥离了市场前缀)\n- **绝对禁止代码与名称之间的任何自动映射或推断**。未提供则为null。\n\
            - 独立字母数字标识符(无\"CSC-\"前缀、无多段连字符+中文描述的模式)默认解析为placeOrderWindCode,例如:\"HTIF2504\"\
            \"TENCENT\"\"600519.SH\"。\n- **【最高优先级】placeOrderWindCode统一提取规则(排除法)**:\n\
            \  * **核心原则**: placeOrderWindCode通过**排除法**识别——先将输入拆分为片段,再将每个片段分类为已知字段,**排除所有已知字段后的剩余片段就是标的**。整个过程**不依赖标的出现的位置**,绝不能把整段文本当作连续字符串从左到右扫描\n\
            \  * **支持的分隔符**: 中文逗号(，)、英文逗号(,)、中文顿号(、)、空格( )、换行(\\n)\n  * **【极其重要】所有分隔符等价规则**:\
            \ 无论用户使用逗号、顿号、空格还是换行,**处理逻辑完全相同**——都是先拆分为独立片段,再对每个片段逐一分类。**绝不能**因为分隔符不同就跳过拆分步骤或改变排除法逻辑\n\
            \  * **排除模式完整清单(非标的字段)**:\n    以下模式对应的片段**绝不是标的**,必须被排除:\n    - **方向关键词**:\
            \ \"买入\"、\"卖出\"、\"卖空\"、\"平空\"、\"空\"、\"多\"、\"做多\"、\"做空\"、\"买入开仓\"、\"买入平仓\"\
            、\"卖出开仓\"、\"卖出平仓\"、\"BUY\"、\"SELL\"\n    - **数量模式**: 纯数字、纯数字+\"股\"/\"\
            手\"(如\"2000股\"、\"500手\"、\"100股\"、\"2000\")\n    - **价格模式**: \"限价\"+\"\
            数字\"、\"市价\"、\"不限价\"、\"不限定价格\"、\"不限制价格\"、\"无限价\"、\"不设限价\"、\"LimitOrder\"\
            、\"MarketOrder\"(如\"限价200\"、\"限价10.5\"、\"市价\"、\"不限价\")\n    - **算法关键词**:\
            \ \"POV\"、\"TWAP\"、\"VWAP\"、\"ICEBERG\"、\"SNIPER\"、\"跟量\"、\"占\"(独立出现时)\n\
            \    - **比例模式**: 数字+\"%\"、\"跟量\"+数字+\"%\"、\"占\"+数字+\"%\"(如\"25%\"、\"跟量15%\"\
            、\"POV30%\")\n    - **时间窗模式**: \"HH:MM-HH:MM\"格式或任何\"HH:MM\"格式的时间(如\"\
            09:30-11:30\"、\"01:00-05:00\")\n    - **交易对手**: 匹配shortname_list中的任何名称,或包含\"\
            交易对手:\"、\"账号\"、\"交易账号\"的片段\n    - **机器人名称/@提及**: 匹配bot_name_list中的名称或任何以\"\
            @\"开头的文本\n  * **提取步骤**(必须严格按顺序执行):\n    1. **预处理**: 执行机器人名称过滤\n    2.\
            \ **拆分**: 将过滤后的文本按分隔符(逗号、顿号、空格、换行)拆分为独立片段;如果无任何分隔符,则按关键词边界拆分\n    3. **逐片段分类**:\
            \ 对每个片段独立判断它属于哪个字段:\n       - 匹配方向关键词 → placeOrderOrderDirection\n   \
            \    - 匹配\"数字+股/手\"或纯数字 → placeOrderQuantity\n       - 匹配\"限价+数字\"或\"\
            市价\"或\"LimitOrder\"或\"MarketOrder\" → placeOrderPriceType/placeOrderPrice\n\
            \       - 匹配算法关键词(POV/TWAP/VWAP/ICEBERG/SNIPER/跟量/占) → placeOrderAlgorithmType\n\
            \       - 匹配百分比模式(数字+%、跟量+%、占+%) → placeOrderPovPercent\n       - 匹配时间窗模式(HH:MM-HH:MM)\
            \ → placeOrderStartTime/placeOrderEndTime\n       - 匹配shortname_list中的名称\
            \ → placeOrderShortname\n       - 匹配bot_name_list或以\"@\"开头 → 过滤掉\n   \
            \    - **以上都不匹配的中文名称或代码格式片段** → placeOrderWindCode候选\n    4. **取剩余**:\
            \ 排除以上所有已识别字段后,剩余的片段就是标的候选\n    5. **多候选处理**: 如果有多个剩余片段,优先选择代码格式(如\"0700.HK\"\
            \"600519.SH\"\"AAPL\")的片段;如果都不是代码格式,选择中文名称片段\n    6. **无候选处理**: 如果没有剩余片段,placeOrderWindCode\
            \ = null\n  * **【极其重要】标的位置无关**:\n    - 标的可以出现在输入的**任何位置**(开头、中间、末尾、任意行)\n\
            \    - 识别标的**不依赖位置**,而是通过排除法:排除所有已知字段后的剩余片段\n    - 无论标的在方向之前、之后,还是在数量之间,都必须正确识别\n\
            \  * **示例1 — 逗号分隔(完整排除过程)**:\n    - 输入\"招商银行,买入,3000股,限价35,鸿运二号\" → 拆分为[\"\
            招商银行\",\"买入\",\"3000股\",\"限价35\",\"鸿运二号\"]\n      * \"买入\"→方向, \"3000股\"\
            →数量, \"限价35\"→价格, \"鸿运二号\"→交易对手(匹配shortname_list)\n      * 剩余\"招商银行\"\
            → placeOrderWindCode: \"招商银行\"(正确!)\n  * **示例2 — 空格分隔(完整排除过程)**:\n   \
            \ - 输入\"招商银行 买入 3000股 限价35 鸿运二号\" → 按空格拆分为[\"招商银行\",\"买入\",\"3000股\",\"\
            限价35\",\"鸿运二号\"]\n      * \"买入\"→方向, \"3000股\"→数量, \"限价35\"→价格, \"鸿运二号\"\
            →交易对手(匹配shortname_list)\n      * 剩余\"招商银行\"→ placeOrderWindCode: \"招商银行\"\
            (正确!)\n    - 输入\"买入 3000股 限价200 中国平安 鸿运二号 @场外助手\" → 按空格拆分为[\"买入\",\"3000股\"\
            ,\"限价200\",\"中国平安\",\"鸿运二号\",\"@场外助手\"]\n      * \"买入\"→方向, \"3000股\"\
            →数量, \"限价200\"→价格, \"鸿运二号\"→交易对手, \"@场外助手\"→过滤\n      * 剩余\"中国平安\"→ placeOrderWindCode:\
            \ \"中国平安\"(正确!标的在中间位置)\n  * **示例3 — 换行分隔(完整排除过程)**:\n    - 输入\"宁德时代\\\
            n买入\\n3000股\\n限价200\\n鸿运二号\" → 按换行拆分为[\"宁德时代\",\"买入\",\"3000股\",\"限价200\"\
            ,\"鸿运二号\"]\n      * \"买入\"→方向, \"3000股\"→数量, \"限价200\"→价格, \"鸿运二号\"→交易对手(匹配shortname_list)\n\
            \      * 剩余\"宁德时代\"→ placeOrderWindCode: \"宁德时代\"(正确!换行分隔与逗号分隔完全等价)\n\
            \    - 输入\"买入\\n3000股\\n限价200\\n宁德时代\\n鸿运二号\" → 按换行拆分,标的在第4行\n      *\
            \ 排除\"买入\"\"3000股\"\"限价200\"\"鸿运二号\"后,剩余\"宁德时代\"→ placeOrderWindCode:\
            \ \"宁德时代\"(正确!标的不在首行也能识别)\n  * **示例4 — 顿号分隔**:\n    - 输入\"招商银行、买入、3000股、限价35\"\
            \ → 按顿号拆分为[\"招商银行\",\"买入\",\"3000股\",\"限价35\"],同理 → placeOrderWindCode:\
            \ \"招商银行\"\n    - 输入\"9988.HK，卖出，800股，市价，鸿运二号\" → placeOrderWindCode:\
            \ \"9988.HK\"\n  * **示例5 — 无分隔符(按关键词边界拆分)**:\n    - 输入\"招商银行买入3000股限价35\"\
            \ → 识别\"买入\"\"3000股\"\"限价35\"并排除,剩余\"招商银行\"→ placeOrderWindCode: \"招商银行\"\
            \n    - 输入\"9988.HK卖出800股市价\" → 排除\"卖出\"\"800股\"\"市价\",剩余\"9988.HK\"→\
            \ placeOrderWindCode: \"9988.HK\"\n    - 输入\"中信证券卖出平仓500股\" → 排除\"卖出平仓\"\
            \"500股\",剩余\"中信证券\"→ placeOrderWindCode: \"中信证券\"\n  * **示例6 — 标的在不同位置(均正确)**:\n\
            \    - 输入\"中国平安 买入 3000股 限价50\" → placeOrderWindCode: \"中国平安\"(标的在开头)\n\
            \    - 输入\"买入 中国平安 3000股 限价50\" → placeOrderWindCode: \"中国平安\"(标的在方向之后)\n\
            \    - 输入\"买入 3000股 中国平安 限价50\" → placeOrderWindCode: \"中国平安\"(标的在数量之后)\n\
            \    - 输入\"买入 3000股 限价50 中国平安\" → placeOrderWindCode: \"中国平安\"(标的在末尾)\n\
            \    - 输入\"中国平安\\n买入\\n3000股\\n限价50\" → placeOrderWindCode: \"中国平安\"(标的在第1行)\n\
            \    - 输入\"买入\\n中国平安\\n3000股\\n限价50\" → placeOrderWindCode: \"中国平安\"(标的在第2行)\n\
            \    - 输入\"买入\\n3000股\\n中国平安\\n限价50\" → placeOrderWindCode: \"中国平安\"(标的在第3行)\n\
            \    - 输入\"买入\\n3000股\\n限价50\\n中国平安\" → placeOrderWindCode: \"中国平安\"(标的在最后一行)\n\
            \  * **【严重错误示例】**(绝对禁止):\n    - 输入\"招商银行,买入,3000股,限价35\" → placeOrderWindCode:\
            \ \"3000股\"(严重错误!\"3000股\"是数量,不是标的!)\n    - 输入\"招商银行,买入,3000股,限价35\" →\
            \ placeOrderWindCode: \"限价35\"(严重错误!\"限价35\"是价格,不是标的!)\n    - 输入\"招商银行,买入,3000股,限价35\"\
            \ → placeOrderWindCode: \"买入\"(严重错误!\"买入\"是方向,不是标的!)\n    - 输入\"招商银行买入3000股限价35\"\
            \ → placeOrderWindCode: \"3000股限价35\"(严重错误!将数量和价格当作标的!)\n    - 输入\"中国平安\
            \ 买入 3000股 限价50\" → placeOrderWindCode: \"中国平安 买入 3000股 限价50\"(严重错误!将整段文本当作标的!)\n\
            \    - 输入\"中国平安 买入 3000股 限价50 鸿运二号 @场外助手\" → placeOrderWindCode: \"3000股\
            \ 限价50 鸿运二号 @\"(严重错误!未按空格分段,把多个字段拼在一起当标的!)\n    - 输入\"买入 中国平安 3000股\"\
            \ → placeOrderWindCode: \"买入\"(严重错误!将方向当作标的!)\n    - 输入\"中国平安\\n买入\\n3000股\\\
            n限价50\" → placeOrderWindCode: \"3000股\"(严重错误!未按换行分段,把数量当标的!)\n  * **自检方法**(提取placeOrderWindCode后必须执行):\n\
            \    1. placeOrderWindCode是否包含以下任何关键词:\"买入\"、\"卖出\"、\"数字+股\"(如\"2000股\"\
            )、\"限价\"、\"市价\"、\"%\"、\"@\"? 如果包含,说明提取范围过大,**必须立即修正**!(注意:\"美股\"、\"港股\"\
            、\"A股\"是合法windCode前缀,不在此禁止范围内)\n    2. placeOrderWindCode是否匹配排除模式(数量模式如\"\
            2000股\"、价格模式如\"限价200\"、方向关键词、算法关键词、比例模式、时间窗模式、交易对手名称、机器人名称)? 如果匹配,说明将其他字段误识别为标的,**必须修正为null或重新识别**!\n\
            \nplaceOrderTransactionType(交易品种类型,字符串,对应GoatsTransactionType枚举):\n\n\
            - **【最高优先级】与placeOrderWindCode联动处理**:\n  * **核心原则**: 此字段与placeOrderWindCode必须配合处理,不能独立识别\n\
            \  * **处理流程**:\n    1. 检测输入中是否包含交易品种类型关键词\n    2. 如果包含,将关键词映射到此字段(**不从原始串中移除**)\n\
            \    3. placeOrderWindCode保留用户输入的完整原始串(**含市场前缀关键词**)\n- 识别关键词并规范化为枚举值:\n\
            \  - \"A股\" → \"A_SHARE\"\n  - \"港股\" → \"HK_STOCK\"\n  - \"美股\" → \"\
            US_STOCK\"\n  - \"深港通\" → \"SZ_HK_CONNECT\"  **注意:深=Shenzhen,代码SZ**\n\
            \  - \"沪港通\" → \"SH_HK_CONNECT\"  **注意:沪=Shanghai,代码SH**\n  - \"境内期货\"\
            \ → \"CHN_FUTURE\"\n  - \"跨境期货\" → \"CROSS_FUTURE\"\n- **【极其重要】联动识别规则**:\n\
            \  * **触发场景**: 当输入包含\"交易品种类型+标的代码\"组合格式时\n  * **必须执行的操作**:\n    1. 识别交易品种类型关键词\n\
            \    2. 将关键词映射到placeOrderTransactionType(转换为枚举值)\n    3. **placeOrderWindCode保留完整原始串,不做任何移除**\n\
            \  * **典型示例**:\n    - 输入\"跨境期货NQZ25E.CME\" → placeOrderTransactionType:\
            \ \"CROSS_FUTURE\", placeOrderWindCode: \"跨境期货NQZ25E.CME\"\n    - 输入\"\
            A股600519.SH\" → placeOrderTransactionType: \"A_SHARE\", placeOrderWindCode:\
            \ \"A股600519.SH\"\n    - 输入\"港股0700.HK\" → placeOrderTransactionType:\
            \ \"HK_STOCK\", placeOrderWindCode: \"港股0700.HK\"\n    - 输入\"美股AAPL\"\
            \ → placeOrderTransactionType: \"US_STOCK\", placeOrderWindCode: \"美股AAPL\"\
            \n    - 输入\"美股阿里巴巴\" → placeOrderTransactionType: \"US_STOCK\", placeOrderWindCode:\
            \ \"美股阿里巴巴\"\n    - **输入\"美股 QD\"** → placeOrderTransactionType: \"US_STOCK\"\
            , placeOrderWindCode: \"美股 QD\"\n    - **输入\"港股 0700.HK\"** → placeOrderTransactionType:\
            \ \"HK_STOCK\", placeOrderWindCode: \"港股 0700.HK\"\n  * **【严重错误示例】** (绝对禁止):\n\
            \    - 输入\"美股AAPL\" → placeOrderTransactionType: \"US_STOCK\", placeOrderWindCode:\
            \ \"AAPL\" (错误!剥离了市场前缀)\n    - 输入\"美股阿里巴巴\" → placeOrderTransactionType:\
            \ \"US_STOCK\", placeOrderWindCode: \"阿里巴巴\" (错误!剥离了市场前缀)\n    - 输入\"\
            美股 QD\" → placeOrderTransactionType: null, placeOrderWindCode: \"美股 QD\"\
            \ (错误!未识别transactionType)\n- **关键区别(极其重要,绝不能混淆)**:\n  * \"深港通\" ≠ \"沪港通\"\
            \n  * \"深\" → \"SZ_HK_CONNECT\" (Shenzhen深圳)\n  * \"沪\" → \"SH_HK_CONNECT\"\
            \ (Shanghai上海)\n  * **必须严格按照用户输入的原始关键词进行映射,不得混淆、替换或推断**\n  * 如果用户说\"深港通\"\
            ,必须输出\"SZ_HK_CONNECT\",绝不能输出\"SH_HK_CONNECT\"\n  * 如果用户说\"沪港通\",必须输出\"\
            SH_HK_CONNECT\",绝不能输出\"SZ_HK_CONNECT\"\n- **仅当swap_query中明确显示市场类型关键词时才映射**\n\
            - **严禁根据标的代码或名称推断市场类型**\n- 用户未明确提供则为null。\n\nplaceOrderQuantity(委托数量,数字,单位:股):\n\
            \n- 从swap_query中提取如\"2000股\"\"下2000\"\"数量2000\"等,统一为数字。\n- 未提供则为null。\n\
            \nplaceOrderQuantityTotal(总量,数字,单位:股):\n\n- **关键字段**:表示要交易的总量,是所有账户数量的总和\n\
            - **适用场景**:仅当算法类型为POV时需要填写,配合placeOrderTotalPovPercent使用\n- **提取规则**:\n\
            \  * 确保为整数格式,去除\"股\"等单位\n  * 所有订单对象必须使用相同的总量值\n  * 当用户文本中明确提到\"总共32000股\"\
            等表述时,可从文本提取\n- 非POV算法或未提供总量则为null。\n\nplaceOrderTotalPovPercent(总单POV比例,数字):\n\
            \n- **新增字段**:表示整个总单的POV比例,用于后续按数量占比分配给各交易对手\n- **关键说明**:此字段与placeOrderPovPercent的区别:\n\
            \  * placeOrderTotalPovPercent:总单的POV比例(如3%)\n  * placeOrderPovPercent:每个交易对手实际分配的POV比例,由后处理脚本自动计算\n\
            - **适用场景**:仅当算法类型为POV且**同时存在placeOrderQuantityTotal(总量)**时才需要填写\n- **【极其重要】前置条件**:此字段**必须且只能**在总单场景下填写。判断总单场景的标准:**当前订单或history_query_str中的订单存在placeOrderQuantityTotal(不为null)**。如果不存在总量,此字段**必须为null**,POV比例应设置到placeOrderPovPercent\n\
            - **识别规则**(仅在确认为总单场景后才适用):\n  * 识别\"跟量X%\"格式,如\"跟量3%\"placeOrderTotalPovPercent\
            \ = 3\n  * 识别\"POV X%\"格式,如\"POV 15%\"placeOrderTotalPovPercent = 15\n\
            \  * 去除\"%\"符号,保留数值\n- **重要**:所有订单对象必须使用相同的总单POV比例值\n- **后处理逻辑**:当placeOrderQuantityTotal和placeOrderTotalPovPercent都存在时,后处理脚本会自动计算每个交易对手的placeOrderPovPercent:\n\
            \  * placeOrderPovPercent = placeOrderTotalPovPercent × (placeOrderQuantity\
            \ / placeOrderQuantityTotal)\n- 当用户文本中明确提到总单POV比例时可提取\n- 未识别到总单POV比例则为null。\n\
            \nplaceOrderOrderDirection(委托方向,字符串,对应GoatsOrderDirection枚举):\n\n- **枚举值只有4个**:\
            \ BUY、SELL、SHORT_OPEN、SHORT_CLOSE,**绝对禁止**输出任何其他值(如\"BUY_CLOSE\"、\"SELL_OPEN\"\
            等都是无效值!)\n- **【极其重要】强制分步匹配流程**(必须按步骤顺序执行,**绝对禁止跳过步骤1直接匹配步骤2**):\n\n  **步骤1(最先检查):\
            \ 检查是否包含4字方向词**\n  * 输入包含\"买入开仓\" → 输出\"BUY\",结束\n  * 输入包含\"买入平仓\" → 输出\"\
            SHORT_CLOSE\",结束 (**买入平仓=平空,不是BUY!**)\n  * 输入包含\"卖出开仓\" → 输出\"SHORT_OPEN\"\
            ,结束 (**卖出开仓=卖空,不是SELL!**)\n  * 输入包含\"卖出平仓\" → 输出\"SELL\",结束 (**卖出平仓=卖出,不是SHORT_CLOSE!**)\n\
            \  * 如果步骤1匹配到任何一个 → **直接输出对应值,不再执行步骤2和步骤3**\n\n  **步骤2(仅当步骤1未匹配时): 检查2字方向词**\n\
            \  * 输入包含\"买入\" → 输出\"BUY\",结束\n  * 输入包含\"卖出\" → 输出\"SELL\",结束\n  * 输入包含\"\
            卖空\" → 输出\"SHORT_OPEN\",结束 (**卖空≠卖出,不是SELL!**)\n  * 输入包含\"平空\" → 输出\"\
            SHORT_CLOSE\",结束\n  * 输入包含\"做多\" → 输出\"BUY\",结束\n  * 输入包含\"做空\" → 输出\"\
            SHORT_OPEN\",结束\n\n  **步骤3(仅当步骤1和2都未匹配时): 检查1字方向词**\n  * 输入包含\"多\" → 输出\"\
            BUY\",结束\n  * 输入包含\"空\" → 输出\"SHORT_OPEN\",结束\n\n- **【极其重要】为什么必须先检查步骤1**:\n\
            \  * \"卖出开仓\"包含子串\"卖出\",如果跳过步骤1直接匹配步骤2,会错误匹配\"卖出\"→SELL\n  * \"买入平仓\"\
            包含子串\"买入\",如果跳过步骤1直接匹配步骤2,会错误匹配\"买入\"→BUY\n  * \"卖出平仓\"虽然最终也映射为\"SELL\"\
            ,但它仍是**完整方向术语**,必须优先按步骤1整体识别,**禁止拆词后碰巧命中**\n  * **必须先用步骤1的4字词完整匹配,排除后才能进入步骤2**\n\
            - **【极其重要】开平仓是完整术语,绝对禁止按字面拆分**:\n  * \"买入平仓\"、\"卖出开仓\"、\"卖出平仓\"、\"买入开仓\"\
            各自是一个**不可拆分的完整方向术语**\n  * **绝对禁止**拆成\"买入\"+\"平仓\"或\"卖出\"+\"开仓\"再分别理解\n\
            \  * **绝对禁止**自行拼造枚举值(如\"BUY_CLOSE\"、\"SELL_OPEN\"等)\n- **【严重错误示例】**(绝对禁止):\n\
            \  * 用户说\"卖出开仓\" → 输出\"SELL\"(严重错误!应为\"SHORT_OPEN\")\n  * 用户说\"卖出平仓\"\
            \ → 输出\"SHORT_CLOSE\"(严重错误!应为\"SELL\")\n  * 用户说\"卖空\" → 输出\"SELL\"(严重错误!应为\"\
            SHORT_OPEN\")\n  * 用户说\"买入平仓\" → 输出\"BUY\"(严重错误!应为\"SHORT_CLOSE\")\n \
            \ * 用户说\"买入平仓\" → 输出\"BUY_CLOSE\"(严重错误!无此枚举值!)\n- 从swap_query中提取。\n- **【极其重要】委托方向位置无关规则**:\n\
            \  * 委托方向关键词可以出现在输入文本的**任何位置**(开头、中间、末尾),都必须正确识别\n  * **绝对禁止**因为方向词出现在末尾就截断匹配(如\"\
            买入平仓\"在末尾时只匹配到\"买入\")\n  * **强制要求**: 提取方向时,必须先**扫描完整输入文本**找出所有方向候选词,然后对每个候选词执行分步匹配流程\n\
            \  * **正确示例**(方向词在不同位置,结果必须一致):\n    - \"0700.HK 100股 限价50 买入平仓\" → \"\
            SHORT_CLOSE\"(末尾,正确)\n    - \"买入平仓 0700.HK 100股 限价50\" → \"SHORT_CLOSE\"\
            (开头,正确)\n    - \"0700.HK 买入平仓 100股 限价50\" → \"SHORT_CLOSE\"(中间,正确)\n \
            \ * **严重错误示例**:\n    - \"0700.HK 100股 限价50 买入平仓\" → \"BUY\"(严重错误!因为在末尾就只匹配了\"\
            买入\",应为\"SHORT_CLOSE\")\n- **绝对禁止**:为方向字段设置任何默认值(如默认\"SELL\"),用户未明确提供则必须为null。\n\
            - 未提供则为null。\n\nplaceOrderPriceType(价格类型,字符串,对应GoatsPriceType枚举):\n\n\
            - \"限价\"\"限价委托\"\"LimitOrder\";\"市价\"\"市价委托\"\"MarketOrder\"。\n- **\"\
            不限价\"类表达 → MarketOrder**:当用户表达\"不想设定具体价格\"的意图时,一律映射为\"MarketOrder\"。包括但不限于:\n\
            \  * \"不限价\"\"不限定价格\"\"不限制价格\"\"无限价\"\"不设限价\"\n  * 核心判断:凡出现\"不/无\"+\"\
            限价/限定价格/限制价格\"语义组合,均视为市价\n- 从swap_query中提取。\n- 未提供则为null。\n\nplaceOrderPrice(价格,数字):\n\
            \n- 当placeOrderPriceType=\"LimitOrder\"时必需;从\"限价X.X\"\"价格X.X\"中提取,支持小数。否则为null。\n\
            - **核心规则**:\n  * 看到\"限价2\"  提取数字2  placeOrderPrice=2\n  * 看到\"限价82.2\"\
            \  提取数字82.2  placeOrderPrice=82.2\n  * 看到\"限价\"  没有数字  placeOrderPrice=null\n\
            \  * **关键**: \"限价\"后面紧跟的任何数字（可能无空格）都必须提取！\n- **提取步骤**:\n  1. 检测到\"限价\"\
            关键词\n  2. 立即查找后面是否有数字\n  3. 数字可能紧跟\"限价\"（无空格），也可能有空格分隔\n  4. 提取数字（支持整数和小数点），如:\
            \ 2, 10, 82.2, 1.5\n  5. 将提取的数字赋值给placeOrderPrice\n  6. 只有当\"限价\"后真的没有数字时，placeOrderPrice才为null\n\
            \nplaceOrderAlgorithmType(算法类型,字符串,对应GoatsAlgoType枚举):\n\n- 识别\"POV\"\"\
            TWAP\"\"VWAP\"\"ICEBERG\"\"SNIPER\"并映射为同名枚举值。未提供则为null。\n- **POV算法自动识别规则**:当用户使用以下表达时,自动识别为POV算法:\n\
            \  * \"占XX%\"(如\"占35%\") placeOrderAlgorithmType=\"POV\", placeOrderPovPercent=35\n\
            \  * \"跟量XX%\"(如\"跟量3%\") placeOrderAlgorithmType=\"POV\", placeOrderPovPercent=3\n\
            \  * \"占比XX%\"(如\"占比25%\") placeOrderAlgorithmType=\"POV\", placeOrderPovPercent=25\n\
            \  * \"POV XX%\"或\"POVXX%\"(如\"POV25%\") placeOrderAlgorithmType=\"POV\"\
            , placeOrderPovPercent=25\n- **关键原则**:\"占\"、\"跟量\"、\"占比\"等关键词本身就表达了POV算法意图,必须自动识别为POV\n\
            - **\"均价\"作为TWAP别名自动识别规则**:当用户使用\"均价\"表达时,自动识别为TWAP:\n  * \"X分钟均价\"(如\"\
            半小时均价\"、\"30分钟均价\"、\"两小时均价\") → placeOrderAlgorithmType=\"TWAP\",同时触发placeOrderRelativeTimeMinutes解析\n\
            \  * \"均价\"单独出现(无其他算法关键词) → placeOrderAlgorithmType=\"TWAP\"\n  * **禁止**:\
            \ \"均价\"绝不得映射为VWAP\n- 其他算法类型(VWAP、ICEBERG、SNIPER)必须明确指定,不自动推断。\n\nplaceOrderPovPercent(POV算法比例,数字):\n\
            \n- **字段说明**:表示每个交易对手实际执行的POV比例\n- **与placeOrderTotalPovPercent的区别**:\n\
            \  * 下总单场景(有总量):placeOrderPovPercent由后处理脚本自动计算,此处可设为null\n  * 普通场景(无总量):placeOrderPovPercent直接从用户输入提取\n\
            - 仅当算法类型为POV时解析;\n- 从\"POV25\"\"pov 25\"\"POV 25%\"等格式中提取,去\"%\"保留数值部分,示例:25%25。\n\
            - **关键规则**:POV比例必须紧跟在\"POV\"或\"pov\"关键词之后,且必须是独立的数字或带百分号的数字,不能从时间格式中提取。\n\
            - **严禁**将时间格式(如\"11:25\"、\"14:30\")中的数字解析为POV比例。\n- **【极其重要】默认规则:POV比例修改默认设置placeOrderPovPercent**:\n\
            \  * 当用户说\"pov比例改为X%\"、\"POV改X%\"、\"改POV比例X%\"等表达时,**默认设置placeOrderPovPercent**,placeOrderTotalPovPercent为null\n\
            \  * **仅在以下总单场景下例外**:当history_query_str中的订单同时存在placeOrderQuantityTotal和placeOrderTotalPovPercent字段(都不为null)时,才识别为修改placeOrderTotalPovPercent\n\
            - **【极其重要】总单场景下的POV比例补充规则**:\n  * **判断标准**:当history_query_str中的订单同时存在placeOrderQuantityTotal和placeOrderTotalPovPercent字段(都不为null)时,说明这是总单场景\n\
            \  * **补充识别**:仅在确认为总单场景后,当用户补充POV比例时(如\"20%\"、\"改为15%\"、\"POV改25%\"等),才识别为修改placeOrderTotalPovPercent,而不是placeOrderPovPercent\n\
            \  * **输出要求**:\n    - placeOrderTotalPovPercent = 用户补充的新比例值(如20)\n   \
            \ - placeOrderPovPercent = null(由后处理脚本自动计算)\n  * **错误示例**:总单场景下,将用户补充的\"\
            20%\"设为placeOrderPovPercent=20,这是严重错误\n  * **正确示例**:总单场景下,将用户补充的\"20%\"\
            设为placeOrderTotalPovPercent=20, placeOrderPovPercent=null\n- **示例**:\n\
            \  - \"pov 25\"  placeOrderPovPercent = 25 (普通场景)\n  - \"POV25%\"  placeOrderPovPercent\
            \ = 25 (普通场景)\n  - \"pov比例改为25%\"  placeOrderPovPercent = 25 (普通场景,默认设置placeOrderPovPercent)\n\
            \  - \"POV改30%\"  placeOrderPovPercent = 30 (普通场景,默认设置placeOrderPovPercent)\n\
            \  - \"pov 11:25-11:30\"  placeOrderPovPercent = null(11:25是时间,不是比例)\n\
            \  - \"POV 14:00-15:00\"  placeOrderPovPercent = null(14:00是时间,不是比例)\n\
            \  - 总单场景(有placeOrderQuantityTotal)补充\"20%\"  placeOrderTotalPovPercent\
            \ = 20, placeOrderPovPercent = null\n  - **【严重错误】**: 非总单场景下\"pov比例改为25%\"\
            \  placeOrderTotalPovPercent = 25(错误!应设置placeOrderPovPercent = 25)\n-\
            \ 未提供则为null。\n\nplaceOrderDisplayQty(可委托数量,数字):\n\n- 仅当算法类型为ICEBERG时解析;从\"\
            可委托数量100\"\"display 100\"中提取。未提供则为null。\n\nplaceOrderRelativeTimeMinutes(相对时间窗分钟数,数字):\n\
            \n- **新增字段**:用于捕获相对时间窗表达式,单位统一为分钟\n- **适用场景**:当用户使用相对时间描述(如\"TWAP十分钟\"\
            、\"TWAP两小时\"、\"半小时均价\")而非具体时间点时填写此字段\n- **识别规则**:\n  * 识别\"X分钟\"格式:如\"\
            十分钟\"10、\"30分钟\"30、\"半小时\"30\n  * 识别\"X小时\"格式并转换为分钟:如\"两小时\"120、\"1小时\"\
            60、\"半小时\"30\n  * 支持中文数字:一1、二2、三3、四4、五5、六6、七7、八8、九9、十10、半0.5、两2\n  * 支持阿拉伯数字:10分钟10、2小时120\n\
            - **转换规则**:\n  * 分钟:直接提取数字(如\"十分钟\"10、\"30分钟\"30)\n  * 小时:提取数字后乘以60(如\"\
            两小时\"2×60=120、\"半小时\"0.5×60=30)\n- **示例**:\n  * \"TWAP十分钟\"  placeOrderRelativeTimeMinutes=10\n\
            \  * \"TWAP两小时\"  placeOrderRelativeTimeMinutes=120\n  * \"TWAP半小时\" \
            \ placeOrderRelativeTimeMinutes=30\n  * \"市价十分钟TWAP\"  placeOrderRelativeTimeMinutes=10\n\
            \  * \"半小时均价\"  placeOrderRelativeTimeMinutes=30 (均价=TWAP别名,半小时=30分钟)\n\
            \  * \"30分钟均价\"  placeOrderRelativeTimeMinutes=30\n  * \"两小时均价\"  placeOrderRelativeTimeMinutes=120\n\
            - **重要**:当此字段存在时,placeOrderStartTime和placeOrderEndTime应为null,由后处理脚本根据当前时间计算\n\
            - 未识别到相对时间表达式则为null。\n\nplaceOrderStartTime(算法开始时间,字符串,格式HH:MM):\nplaceOrderEndTime(算法结束时间,字符串,格式HH:MM):\n\
            \n- 当用户提供算法时间窗时解析;TWAP通常需要时间窗(必需)。\n\n- **【重要】时间格式规范化要求**:\n  * **强制格式**:\
            \ 必须严格按照HH:MM格式输出(小时和分钟都必须是2位数)\n  * **补零规则**:\n    - 单位数小时必须补0: \"9:00\"\
            \ → \"09:00\", \"9:30\" → \"09:30\"\n    - 单位数分钟必须补0: \"15:5\" → \"15:05\"\
            , \"9:5\" → \"09:05\"\n  * **错误示例**: \"9:00\", \"9:30\", \"15:5\" (缺少前导零)\n\
            \  * **正确示例**: \"09:00\", \"09:30\", \"15:05\" (符合HH:MM格式)\n\n- **格式化处理流程**:\n\
            \  1. 从用户输入中提取时间(如\"9:00\", \"9:30\", \"14:5\")\n  2. 检查小时部分是否为单位数,是则补0(9\
            \ → 09)\n  3. 检查分钟部分是否为单位数,是则补0(5 → 05)\n  4. 输出规范化后的时间(\"09:00\", \"\
            09:30\", \"14:05\")\n  * **严禁12/24小时制推断**:用户输入\"5:00\"只能补零为\"05:00\",绝不能推断为\"\
            17:00\";用户输入\"1:00\"只能补零为\"01:00\",绝不能推断为\"13:00\"。只做格式补零,不做语义纠正。\n\n\
            - **【最高优先级】时间窗提取流程**:\n  1. 先按原文切分时间窗左右两侧(如\"9:00-5:00\"切为左侧\"9:00\"、右侧\"\
            5:00\")\n  2. 左侧时间只做补零后写入placeOrderStartTime\n  3. 右侧时间只做补零后写入placeOrderEndTime\n\
            \  4. **绝不交换左右两侧、绝不改写数值、绝不补\"下午\"语义**\n  5. 即使右侧时间早于左侧时间,也必须保持原文语义: \"\
            9:00-5:00\" → placeOrderStartTime=\"09:00\", placeOrderEndTime=\"05:00\"\
            \n  6. 时间顺序是否合法由下游校验负责,**不属于本节点**\n\n- **两种时间表达方式**:\n  * **绝对时间**:使用具体时间点(如\"\
            9:30-10:30\"),填写此字段并规范化为HH:MM格式\n  * **相对时间**:使用相对时长(如\"TWAP十分钟\"),填写placeOrderRelativeTimeMinutes字段,此字段为null\n\
            \n- 支持\"HH:MM-HH:MM\"\"HH:MM到HH:MM\"格式:\n  - 输入: \"9:30-10:30\" → 输出:\
            \ placeOrderStartTime=\"09:30\", placeOrderEndTime=\"10:30\"\n  - 输入:\
            \ \"14:00到15:30\" → 输出: placeOrderStartTime=\"14:00\", placeOrderEndTime=\"\
            15:30\"\n  - 输入: \"9:00-15:00\" → 输出: placeOrderStartTime=\"09:00\", placeOrderEndTime=\"\
            15:00\"\n\n- **重要**:时间窗中的数字只能解析为时间,不能解析为其他参数(如POV比例)。\n\n- **示例**(注意时间格式规范化):\n\
            \  - \"pov 11:25-11:30\" → placeOrderStartTime=\"11:25\", placeOrderEndTime=\"\
            11:30\"\n  - \"POV25% 14:00-15:00\" → placeOrderStartTime=\"14:00\", placeOrderEndTime=\"\
            15:00\"\n  - \"9:00-15:00\" → placeOrderStartTime=\"09:00\", placeOrderEndTime=\"\
            15:00\" (补零!)\n  - \"9:00-5:00\" → placeOrderStartTime=\"09:00\", placeOrderEndTime=\"\
            05:00\" (只补零,不做下午推断!)\n  - ❌ 错误示例: \"9:00-5:00\" → placeOrderStartTime=\"\
            09:00\", placeOrderEndTime=\"17:00\" (错误!这是语义纠正,不是格式化)\n  - \"9:30-10:30\"\
            \ → placeOrderStartTime=\"09:30\", placeOrderEndTime=\"10:30\" (补零!)\n\
            \  - \"TWAP十分钟\" → placeOrderStartTime=null, placeOrderEndTime=null, placeOrderRelativeTimeMinutes=10\n\
            \n- 特殊短语映射(已规范化为HH:MM格式):\n  - \"上午开盘后\" → \"09:30\"\n  - \"下午开盘后\" →\
            \ \"13:00\"\n\n- **【即时下单规则】**:当用户使用口语化表达\"立即执行\"语义时,使用now_date_time加1分钟作为placeOrderStartTime\n\
            \  * **触发词**:\"现在\"、\"马上\"、\"即刻\"、\"立刻\"、\"立即\"、\"即时\"、\"赶紧\"、\"赶快\"等表达\"\
            立即执行\"的口语词汇\n  * **计算规则**:将now_date_time(HH:mm格式)的分钟数加1,结果仍以HH:MM格式输出\n\
            \    - 示例:now_date_time=\"14:32\" → placeOrderStartTime=\"14:33\"\n  \
            \  - 示例:now_date_time=\"09:07\" → placeOrderStartTime=\"09:08\"\n    -\
            \ 跨小时:now_date_time=\"13:59\" → placeOrderStartTime=\"14:00\"\n    - 跨零点:now_date_time=\"\
            23:59\" → placeOrderStartTime=\"00:00\"\n  * **placeOrderEndTime**:用户若未明确提供结束时间,则保持null\n\
            \  * **优先级**:此规则低于用户明确指定的绝对时间(如\"9:30-10:30\"),高于无时间输入的默认null\n  * **禁止误触发**:仅当用户的时间表达使用了上述触发词,且未提供任何具体时间点时才启用此规则\n\
            \n- 若仅给出开始/结束之一,则仅填对应字段(记得补零),另一字段为null。\n\nplaceOrderShortname(交易对手简称/交易账号,字符串):\n\
            \n- **【最高优先级】订单列表JSON提取规则**:\n  * **检测JSON格式**:如果swap_query包含JSON数组格式的订单列表(以`[{`开头包含`placeOrderShortname`字段)\n\
            \  * **优先使用JSON数据**:必须从JSON数组中的`placeOrderShortname`字段提取交易对手名称\n  * **JSON优先级最高**:JSON中的值是经过预处理的准确值\n\
            \  * **防止幻觉的关键**:JSON数据可以避免解析错误\n  * **提取示例**: swap_query包含`[{\"placeOrderShortname\"\
            :\"账户A\",...},{\"placeOrderShortname\":\"账户B\",...}]`\n    - 第1个订单的placeOrderShortname必须从JSON[0].placeOrderShortname提取,即\"\
