            \n\n**【强制承诺】**:\n我承诺：我将只从实际输入变量（swap_query等）中提取数据，绝不使用提示词示例中的任何业务数据。\n\
            \n---\n\n**【大数据处理强制协议】防止批量数据幻觉**\n\n**当订单数量≥10个时，必须启用以下强制机制**:\n\n**机制1:\
