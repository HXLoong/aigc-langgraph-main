          \ dict / list\n    if isinstance(json, str):\n        try:\n           \
          \ json = json_lib.loads(json)\n        except Exception:\n            return\
          \ {\n                \"code\": -1,\n                \"result\": \"invalid\
          \ json string\",\n                \"intent\": None,\n                \"\
          orderList\": None,\n                \"productType\": 1\n            }\n\n\
          \    # 2. 如果是 list，取第一个元素\n    if isinstance(json, list):\n        if len(json)\
          \ == 0:\n            data = {}\n        else:\n            data = json[0]\n\
          \    elif isinstance(json, dict):\n        data = json\n    else:\n    \
          \    # 兜底\n        data = {}\n\n    # 3. 防止 data 不是 dict\n    if not isinstance(data,\
          \ dict):\n        data = {}\n\n    # 4. 安全获取\n    return {\n        \"code\"\
          : data.get(\"code\"),\n        \"result\": data.get(\"result\"),\n     \
          \   \"intent\": data.get(\"intent\"),\n        \"orderList\": data.get(\"\
          orderList\"),\n        \"productType\": 1\n    }"
