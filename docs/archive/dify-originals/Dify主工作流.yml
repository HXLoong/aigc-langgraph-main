    - data:
        code: "\"\"\"\n\n互换API\n\n\"\"\"\nimport requests\n\n\ndef main(apiUrl, otcSecret)\
          \ -> dict:\n    url = f\"{apiUrl}/admin-api/business/config/bot/name/list\"\
          \n    headers = {\n        \"Content-Type\": \"application/json\",\n   \
          \     \"Authorization\": otcSecret\n    }\n    payload = {}\n\n    code\
          \ = None\n    error = \"\"\n    response_info = None\n    bot_name_list\
          \ = []\n    result = None\n\n    try:\n        response = requests.post(url,\
          \ json=payload, headers=headers, timeout=10)\n        response.raise_for_status()\
          \  # HTTP 错误抛异常\n\n        # 构造可 JSON 序列化的响应摘要，避免返回 Response 对象导致序列化报错\n\
          \        response_info = {\n            \"status_code\": response.status_code,\n\
          \            \"ok\": response.ok,\n            \"url\": response.url,\n\
          \            \"headers\": dict(response.headers),\n            \"text\"\
          : response.text\n        }\n\n        parsed = response.json()  # 自动解析 JSON\n\
          \        code = parsed.get(\"code\")\n        if code == 0:\n          \
          \  data = parsed.get(\"data\", [])\n            result = data\n        \
          \    # data 应该是列表,如果不是则说明系统有问题\n            if isinstance(data, list):\n\
          \                bot_name_list = data\n        elif code == 500:\n     \
          \       result = \"交易指令服务暂不可用\"\n        else:\n            result = parsed.get(\"\
          msg\", \"未知错误\")\n\n    except Exception as e:\n        # 统一处理所有异常，并记录异常信息\n\
          \        code = 500\n        result = \"交易指令服务暂不可用\"\n        error = str(e)\n\
          \n    return {\n        \"result\": str(result),\n        \"code\": code,\n\
          \        \"error\": error,\n        \"response\": response_info,\n     \
          \   \"bot_name_list\": bot_name_list\n    }\n"
        code_language: python3
