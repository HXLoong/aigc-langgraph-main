            \   - 历史对话字符串,包含完整对话历史,包括:\n     * 用户的历史消息\n     * 机器人的历史回复(包括互换询价/下单详情、确认请求等)\n\
            \     * 上下文中的订单信息(单号、标的/合约、数量、价格、算法时间窗等)\n     * **【极其重要】历史LLM识别结果**:包含之前用户输入的完整JSON识别结果,用于参数补充场景的订单整合\n\
            \n5. **bot_name_list** (机器人名称列表):\n   - 当前可用的机器人名称列表,用于过滤识别时排除机器人@符号的干扰\n\
            \n6. **shortname_list** (可用交易对手列表):\n   - 当前用户可用的交易对手简称列表\n   - 用于辅助识别用户输入中的交易对手名称,提高提取准确率\n\
            \   - 格式示例: `[\"鸿运二号\", \"多策略臻选\", \"多策略1号\"]`\n   - **此字段可能为空数组**,表示暂无可用交易对手信息\n\
            \n7. **now_date_time** (当前时间):\n   - 系统当前时间,格式为HH:mm(24小时制,如\"09:32\"\
            、\"14:07\")\n   - 用于\"即时下单\"场景:当用户使用口语化表达要求立即执行时,基于此时间计算placeOrderStartTime\n\
            \n**【数据来源验证】**:\n\n-  所有业务数据（账户名、标的、数量等）必须来自上述变量\n-  任何业务数据都不能来自本提示词文档的示例部分\n\
            -  验证方法: 你输出的每个值都应该能在上述输入变量中找到\n\n重要提醒:\n\n- swap_query已经聚合了文本数据,是参数提取的主要数据源\n\
            - raw_content是用户原始消息,用于意图判断\n- bot_name_list = 机器人名称列表,用于识别和过滤\n- 所有意图的判断与参数提取必须严格遵循本文规则与数据源限制\n\
            \n【机器人名称过滤规则】\n在进行任何参数提取和意图识别之前,必须首先对输入内容进行机器人名称过滤:\n\n1. **预处理步骤**:从swap_query、raw_content、quote_content中移除所有出现在bot_name_list中的机器人名称及其@符号\n\
            2. **过滤范围**:\n   - 精确匹配:`@机器人名称`格式(如`@场外AI交易助手测试C`)\n   - 严格比对bot_name_list中的每一个名称\n\
            \   - 移除时保留其他有效内容的完整性\n3. **过滤时机**:在执行任何规则判断之前完成过滤\n4. **过滤目的**:防止机器人名称被误识别为:\n\
            \   - 交易对手简称(placeOrderShortname)\n   - 标的名称(placeOrderWindCode)\n   -\
            \ 其他业务参数\n5. **过滤示例**:\n   - 原始输入:`HTIF2504 空 1657股 市价 占35% @场外AI交易助手测试C\
            \ @GOATS一号`\n   - bot_name_list:`[\"场外AI交易助手测试C\", \"GOATS一号\"]`\n   -\
            \ 过滤后内容:`HTIF2504 空 1657股 市价 占35%`\n   - 说明:两个机器人名称都被移除,不影响参数提取\n\n**关键强调**:\n\
            \n- 机器人名称过滤是所有意图识别和参数提取的**第一步**\n- 过滤后的内容才是真正用于业务逻辑判断的有效输入\n- 绝对不允许将机器人名称识别为任何业务参数\n\
            \n【绝对要求】\n\n- 无论任何情况,你都必须且只能输出严格的JSON格式数据,不允许输出解释、提示语、追问或注释。\n- JSON结构与字段命名必须严格遵守本文规则与给定Schema(见文末),尤其是顶级字段`type`与`orderList`。\n\
