    - data:
        code: "\"\"\"\n\n脚本判断期权、互换指令\n\n\"\"\"\n\nfrom typing import List, Dict, Optional\n\
          import re\n\n# 期权平仓订单号/合约编号正则模式\n#   平仓单号格式：CO-YYYYMMDD-XXXXXXXX（后缀为8位大写十六进制）\n\
          #   合约编号格式：OPT/OPTG + 大写字母 + 数字（如 OPTG-SZZSCF20250030、OPT-LYAFT20260001）\n\
          OPTION_CLOSE_ORDER_PATTERN = r'CO-\\d{8}-[0-9A-F]{8}|OPTG?-[A-Z]{4,8}\\\
          d{6,10}'\n\n# 期权平仓持仓查询关键词（quote_content 为空时使用，用于识别用户查询持仓的意图）\nOPTION_CLOSE_QUERY_KEYWORDS:\
          \ List[str] = [\n    \"我想平仓\",\n    \"我要平仓\",\n    \"帮我平仓\",\n    \"想平仓\"\
          ,\n    \"要平仓\",\n    \"我有哪些持仓\",\n    \"查询持仓\",\n    \"查看持仓\",\n    \"持仓情况\"\
          ,\n    \"我的持仓\",\n    \"期权持仓\",\n    \"查持仓\",\n    \"期权平仓\",\n    \"持仓\"\
          ,\n]\n\n# 期权关键词维护列表\nOPTION_KEYWORDS: List[str] = [\n    \"期权\", \"期权订单\"\
          ,\n    \"报价\", \"询价\",\n    \"看涨\", \"看跌\",\n    \"行权价\", \"平直\", \"平值\"\
          ,\n    \"call\", \"CALL\", \"Call\",\n    \"put\", \"PUT\", \"Put\",\n \
          \   \"欧式看涨\", \"雪球\", \"参与型看涨\", \"敲入\", \"敲出\",\n    \"Q-\",\n    \"涨跌幅过大\"\
          , \"结构\", \"期限\", \"保证金\", \"最大亏损\", \"名本\", \"名义本金\", \"个月\", \"月\", \"\
          M\", \"m\",\n]\n\n# 互换关键词维护列表\nSWAP_KEYWORDS: List[str] = [\n    \"互换\"\
          , \"收益互换\", \"互换订单\",\"互换请求下单\",\n    \"交易品种\", \"A股\", \"港股\", \"美股\",\
          \ \"深港通\", \"沪港通\", \"境内期货\", \"跨境期货\", \"期货\",\n    \"交易方向\", \"开仓\", \"\
          平仓\", \"空\", \"买入\", \"卖出\", \"卖空\", \"平空\", \"买\", \"卖\", \"手\",\n    \"\
          H-\",\n    \"股\",\n]\n\nEXCEL_EXTENSIONS = {\".xls\", \".xlsx\"}\nEXCEL_MIME_TYPES\
          \ = {\n    \"application/vnd.ms-excel\",\n    \"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\"\
          \n}\n\n\ndef _clean_text(text: str) -> str:\n    \"\"\"\n    清理文本中的UUID\n\
          \n    规则：\n    1. 直接匹配并删除UUID格式的内容\n    2. UUID格式: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx\
          \ (8-4-4-4-12个十六进制字符)\n\n    Args:\n        text: 原始文本\n\n    Returns:\n\
          \        清理后的文本\n    \"\"\"\n    if not text:\n        return text\n\n \
          \   # 直接匹配UUID格式(可能在括号中)\n    # UUID标准格式: 8-4-4-4-12 个十六进制字符\n    uuid_pattern\
          \ = r'\\([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}\\\
          )'\n\n    # 移除UUID\n    cleaned_text = re.sub(uuid_pattern, '', text, flags=re.MULTILINE\
          \ | re.DOTALL)\n\n    # 清理多余的空白字符和换行符\n    cleaned_text = re.sub(r'\\s+',\
          \ ' ', cleaned_text).strip()\n\n    return cleaned_text\n\n\ndef main(query:\
          \ str, files, quote_content: str) -> dict:\n    \"\"\"入口函数：统一通过 is_swap_transaction\
          \ 返回结果。\"\"\"\n    return {\n        \"result\": is_swap_transaction(query,\
          \ files, quote_content)\n    }\n\n\ndef is_swap_transaction(instruction:\
          \ str, files: List[Dict] = [], quote_content: Optional[str] = None) -> str:\n\
          \    \"\"\"\n    有文件：\n      - 全为图片 -> \"图片\"（仅判断 f.get(\"type\") == \"\
          image\"）\n      - 全为Excel -> \"Excel\"（扩展名或 MIME 判断）\n      - 其他或混合 -> \"\
          无法识别文件类型\"\n    无文件：\n      - 仅根据关键词列表返回 \"期权\" 或 \"互换\"\n    \"\"\"\n \
          \   if files and isinstance(files, list) and len(files) > 0:\n        all_images\
          \ = all(str(f.get(\"type\", \"\")).lower() == \"image\" for f in files)\n\
          \        if all_images:\n            return \"互换-图片\"\n\n        all_excels\
          \ = all(\n            (str(f.get(\"extension\", \"\")).lower() in EXCEL_EXTENSIONS)\
          \ or\n            (str(f.get(\"mime_type\", \"\")).lower() in EXCEL_MIME_TYPES)\n\
          \            for f in files\n        )\n        if all_excels:\n       \
          \     return \"互换-Excel\"\n\n        return \"无法识别文件类型\"\n\n    # 无文件：文本分类\n\
          \    return _classify_trade_type(instruction, quote_content)\n\n\ndef _is_quote_content_valid(quote_content:\
          \ Optional[str]) -> bool:\n    \"\"\"\n    判断 quote_content 是否为有效引用内容。\n\
          \n    排除以下情况：\n    - None\n    - 空字符串或纯空白\n    - Java 侧 String.valueOf(null)\
          \ 转换产生的字符串 \"null\"\n    \"\"\"\n    if not quote_content or not isinstance(quote_content,\
          \ str):\n        return False\n    stripped = quote_content.strip()\n  \
          \  return bool(stripped) and stripped.lower() != \"null\"\n\n\ndef _classify_trade_type(text:\
          \ str, quote_content: Optional[str] = None) -> str:\n    \"\"\"无文件时的文本分类：只返回\"\
          期权\"或\"互换\"。\"\"\"\n\n    # ----------------------------------------------------------------\n\
          \    # 期权平仓-文本 路由判断（优先于原有分类逻辑，不影响原有逻辑）\n    # 规则说明：\n    #   情况1：quote_content\
          \ 或 text 中包含期权平仓订单号/合约编号\n    #          （CO-YYYYMMDD-XXXXXXXX 或 OPT/OPTG-XXXXXX00000000）\n\
          \    #          → 用户正在进行平仓/确认/撤单等操作\n    #   情况2：未匹配到订单号/合约编号，通过 text 关键词判断用户意图\n\
          \    # ----------------------------------------------------------------\n\
          \n    # 情况1：quote_content 或 text 中匹配到订单号/合约编号\n    if _is_quote_content_valid(quote_content)\
          \ and re.search(OPTION_CLOSE_ORDER_PATTERN, quote_content):\n        return\
          \ \"期权平仓-文本\"\n    if text and re.search(OPTION_CLOSE_ORDER_PATTERN, text):\n\
          \        return \"期权平仓-文本\"\n\n    # 互换系统回复消息早期判断：quote_content 包含互换系统消息时，直接返回互换-文本\n\
          \    # 避免系统返回的候选标的列表（如含 AP01M.CZC 等农期合约、苹果近月等）污染关键词计数\n    _SWAP_SYSTEM_MSG_KEYWORDS\
          \ = (\"互换请求\", \"互换详情\", \"收益互换\", \"场外收益互换\")\n    if _is_quote_content_valid(quote_content)\
          \ and any(k in quote_content for k in _SWAP_SYSTEM_MSG_KEYWORDS):\n    \
          \    return \"互换-文本\"\n\n    # 情况2：未匹配到订单号，通过关键词判断意图\n    if text:\n   \
          \     for keyword in OPTION_CLOSE_QUERY_KEYWORDS:\n            if keyword\
          \ in text:\n                return \"期权平仓-文本\"\n\n    # ----------------------------------------------------------------\n\
          \    # 以下为原有逻辑（保持不变）\n    # ----------------------------------------------------------------\n\
          \n    # 合并主要文本和引用内容\n    combined_text = text if text else \"\"\n\n    #\
          \ 处理quote_content为空的各种情况：None、空字符串、只有空白字符\n    if quote_content and isinstance(quote_content,\
          \ str) and quote_content.strip():\n        combined_text = combined_text\
          \ + \" \" + quote_content\n\n    if not combined_text.strip():\n       \
          \ return \"unknown\"  # 默认unknown\n\n    # 清理文本中的用户提及信息\n    cleaned_text\
          \ = _clean_text(combined_text)\n\n    # 打印清理前后的对比\n    print(\"=\" * 50)\n\
          \    print(\"清理前的文本:\")\n    print(repr(combined_text))\n    print(\"\\\
          n清理后的文本:\")\n    print(repr(cleaned_text))\n    print(\"=\" * 50)\n\n  \
          \  # 匹配关键词(M/m需要特殊处理)\n    option_matched = []\n    option_count = 0\n\n\
          \    for keyword in OPTION_KEYWORDS:\n        # 对于 M 和 m，需要前面有数字才匹配\n  \
          \      if keyword in ['M', 'm']:\n            # 使用正则表达式匹配 数字+M/m 的模式\n \
          \           pattern = r'\\d+' + keyword\n            matches = re.findall(pattern,\
          \ cleaned_text)\n            if matches:\n                option_matched.append(keyword)\n\
          \                option_count += len(matches)\n        else:\n         \
          \   # 其他关键词直接匹配\n            if keyword in cleaned_text:\n             \
          \   option_matched.append(keyword)\n                option_count += cleaned_text.count(keyword)\n\
          \n    swap_matched = []\n    swap_count = 0\n\n    for keyword in SWAP_KEYWORDS:\n\
          \        # 对于\"手\"关键词,需要前面有数字才匹配(作为量词使用)\n        if keyword == '手':\n \
          \           # 使用正则表达式匹配 数字+手 的模式\n            pattern = r'\\d+手'\n     \
          \       matches = re.findall(pattern, cleaned_text)\n            if matches:\n\
          \                swap_matched.append(keyword)\n                swap_count\
          \ += len(matches)\n        else:\n            # 其他关键词直接匹配\n            if\
          \ keyword in cleaned_text:\n                swap_matched.append(keyword)\n\
          \                swap_count += cleaned_text.count(keyword)\n\n    print(f\"\
          \\n期权关键词命中: {option_matched}\")\n    print(f\"互换关键词命中: {swap_matched}\"\
          )\n\n    option_hit = len(option_matched) > 0\n    swap_hit = len(swap_matched)\
          \ > 0\n\n    if swap_hit and not option_hit:\n        return \"互换-文本\"\n\
          \    if option_hit and not swap_hit:\n        return \"期权-文本\"\n    if swap_hit\
          \ and option_hit:\n        # 发生同时命中的场景，使用命中次数做简单决策\n        print(f\"期权命中次数:\
          \ {option_count}, 互换命中次数: {swap_count}\")\n        return \"互换-文本\" if swap_count\
          \ >= option_count else \"期权-文本\"\n\n    # 无关键词命中时，默认unknown\n    return\
          \ \"unknown\"\n\n"
