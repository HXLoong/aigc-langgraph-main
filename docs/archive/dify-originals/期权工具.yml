    - data:
        code: "import json\nimport re\n\ndef main(data: str) -> dict:\n    \"\"\"\n\
          \    只做 JSON 解析，不做 order_list 和 query 的处理\n    \"\"\"\n    res = parse_flexible_json_string(data)\n\
          \    return {\n        \"operate\": res.get('operate') if res else None,\n\
          \        \"type\": res.get('type') if res else None,\n        \"orderList\"\
          : res.get('orderList') if res else None,\n        \"errMsg\": res.get('errMsg',\
          \ '') if res else '',\n        \"limit_code\": res.get('limit_code') if\
          \ res else None,\n        \"limit_strike_price\": res.get('limit_strike_price')\
          \ if res else None,\n        \"limit_tenor\": res.get('limit_tenor') if\
          \ res else None,\n        \"limit_total\": res.get('limit_total') if res\
          \ else None,\n    }\n\n\ndef parse_flexible_json_string(data_str: str):\n\
          \    \"\"\"\n    解析灵活的JSON字符串，支持有answer和没有answer两种情况\n    \"\"\"\n    try:\n\
          \        try:\n            result = json.loads(data_str)\n            if\
          \ 'answer' not in result:\n                return result\n            data_str\
          \ = result['answer']\n        except json.JSONDecodeError:\n           \
          \ pass\n\n        protected_err_msg = None\n        protected_str = data_str\n\
          \n        err_msg_match = re.search(r'\"errMsg\"\\s*:\\s*\"((?:[^\"\\\\\\\
          \\]|\\\\\\\\.)*)\"', data_str)\n        if err_msg_match:\n            protected_err_msg\
          \ = err_msg_match.group(1)\n            protected_str = re.sub(r'\"errMsg\"\
          \\s*:\\s*\"((?:[^\"\\\\\\\\]|\\\\\\\\.)*)\"',\n                        \
          \           '\"errMsg\":\"__PROTECTED_ERRMSG__\"', data_str)\n\n       \
          \ cleaned_str = protected_str\n        cleaned_str = re.sub(r'(\\\\{{1,}})n',\
          \ '', cleaned_str)\n        cleaned_str = re.sub(r'(\\w+)\\s*:', r'\"\\\
          1\":', cleaned_str)\n        cleaned_str = cleaned_str.replace(\"'\", '\"\
          ')\n        cleaned_str = re.sub(r',\\s*]', ']', cleaned_str)\n        cleaned_str\
          \ = re.sub(r',\\s*}', '}', cleaned_str)\n        cleaned_str = re.sub(r'\\\
          s+', ' ', cleaned_str)\n        cleaned_str = re.sub(r'```json\\s*|\\s*```',\
          \ '', cleaned_str)\n        cleaned_str = re.sub(r':\\s*null\\b', ': null',\
          \ cleaned_str)\n        cleaned_str = re.sub(r':(\\d+)([,\\\\]}])', r':\\\
          1\\2', cleaned_str)\n        cleaned_str = cleaned_str.strip()\n\n     \
          \   if '\\\\\"' in cleaned_str:\n            cleaned_str = cleaned_str.replace('\\\
          \\\"', '\"')\n        if '\\\\\\\\' in cleaned_str:\n            cleaned_str\
          \ = cleaned_str.replace('\\\\\\\\', '\\\\')\n\n        if protected_err_msg\
          \ is not None:\n            cleaned_str = cleaned_str.replace('\"errMsg\"\
          :\"__PROTECTED_ERRMSG__\"',\n                                          \
          \    f'\"errMsg\":\"{protected_err_msg}\"')\n\n        return json.loads(cleaned_str)\n\
          \n    except Exception as error:\n        print(f'JSON解析失败: {error}')\n\
          \        return None\n\n# if __name__ == '__main__':\n#     # 测试有answer的情况\n\
          #     test_data1 = '{\"answer\": \"{\\\\\"operate\\\\\": \\\\\"询价\\\\\"\
          , \\\\\"type\\\\\": \\\\\"new_inquiry\\\\\", \\\\\"orderList\\\\\": [{\\\
          \\\"stockCode\\\\\": \\\\\"600877\\\\\", \\\\\"stockName\\\\\": null, \\\
          \\\"optionType\\\\\": \\\\\"欧式看涨\\\\\", \\\\\"tenor\\\\\": \\\\\"1M\\\\\"\
          , \\\\\"strikePercentage\\\\\": 80.00, \\\\\"notionalAmount\\\\\": null,\
          \ \\\\\"participationRate\\\\\": null}]}\"}'\n\n#     result1 = main(test_data1)\n\
          #     print(\"有answer的情况:\")\n#     print(json.dumps(result1, ensure_ascii=False,\
          \ indent=2))\n\n#     # 测试没有answer的情况\n#     test_data2 = '{\\n  \"operate\"\
          : \"询价\",\\n  \"type\": \"new_inquiry\",\\n  \"orderList\": [\\n    {\\\
          n      \"stockCode\": \"600023\",\\n      \"stockName\": null,\\n      \"\
          optionType\": \"欧式看涨\",\\n      \"strikePercentage\": 80.00,\\n      \"\
          tenor\": \"1M\",\\n      \"notionalAmount\": null,\\n      \"participationRate\"\
          : null\\n    }\\n  ],\\n  \"errMsg\": \"\"\\n}'\n\n#     result2 = main(test_data2)\n\
          #     print(\"\\n没有answer的情况:\")\n#     print(json.dumps(result2, ensure_ascii=False,\
          \ indent=2))"
