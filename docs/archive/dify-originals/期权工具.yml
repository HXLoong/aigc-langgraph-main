    - data:
        code: "def main(data):\n    \"\"\"验证建仓指令参数的主函数\"\"\"\n    # 从data中提取orderList\n\
          \    order_list = data\n    result = validate_order_params(order_list)\n\
          \    return {\n        'result': result,\n        'code': 0 if result ==\
          \ 'ok' else 500\n    }\n\n\ndef is_empty_value(value):\n    \"\"\"检查值是否为空\"\
          \"\"\n    if not value or value is None:\n        return True\n    if isinstance(value,\
          \ str) and value.strip() == '':\n        return True\n    if isinstance(value,\
          \ (int, float)) and value <= 0:\n        return True\n    return False\n\
          \n\ndef add_error_to_list(error_dict, unique_texts, errors_list):\n    \"\
          \"\"添加错误到列表中并去重\"\"\"\n    if error_dict['text'] not in unique_texts:\n\
          \        unique_texts.add(error_dict['text'])\n        errors_list.append(error_dict)\n\
          \n\ndef validate_basic_order_fields(item, unique_texts, errors_list):\n\
          \    \"\"\"验证基础订单字段\"\"\"\n    # 检查建仓方式，如果为空则设置默认值\n    if is_empty_value(item.get('orderType')):\n\
          \        item['orderType'] = 'POV'\n        item['povRatio'] = 25\n\n  \
          \  # 检查名义本金（必填参数）\n    if is_empty_value(item.get('notionalAmount')):\n\
          \        error_dict = {'text': '名义本金', 'example': '1000000（元）'}\n      \
          \  add_error_to_list(error_dict, unique_texts, errors_list)\n\n\ndef validate_limit_price_order(item,\
          \ unique_texts, errors_list):\n    \"\"\"验证限价单参数\"\"\"\n    if is_empty_value(item.get('limitPrice')):\n\
          \        error_dict = {'text': '限定价格', 'example': '6.30'}\n        add_error_to_list(error_dict,\
          \ unique_texts, errors_list)\n\n\ndef validate_market_price_order(item,\
          \ unique_texts, errors_list):\n    \"\"\"验证市价单参数\"\"\"\n    # 市价单只需要名义本金，已在基础字段中验证\n\
          \    pass\n\n\ndef validate_pov_order(item, unique_texts, errors_list):\n\
          \    \"\"\"验证POV建仓方式参数\"\"\"\n    # POV需要限定价格\n    if is_empty_value(item.get('limitPrice')):\n\
          \        error_dict = {'text': '限定价格', 'example': '6.30'}\n        add_error_to_list(error_dict,\
          \ unique_texts, errors_list)\n\n    # POV需要比例\n    pov_ratio = item.get('povRatio')\n\
          \    if is_empty_value(pov_ratio):\n        error_dict = {'text': 'POV比例范围',\
          \ 'example': '1.0-25.0之间（1%-25%）'}\n        add_error_to_list(error_dict,\
          \ unique_texts, errors_list)\n    elif isinstance(pov_ratio, (int, float)):\n\
          \        # 验证POV比例范围：1%-25%之间，支持小数\n        if pov_ratio < 1.0:\n      \
          \      error_dict = {'text': 'POV比例过小', 'example': '最小值为1.0（1%）'}\n    \
          \        add_error_to_list(error_dict, unique_texts, errors_list)\n    \
          \    elif pov_ratio > 25.0:\n            error_dict = {'text': 'POV比例过大',\
          \ 'example': '最大值为25.0（25%），当前值超出范围'}\n            add_error_to_list(error_dict,\
          \ unique_texts, errors_list)\n\n\ndef validate_twap_order(item, unique_texts,\
          \ errors_list):\n    \"\"\"验证TWAP建仓方式参数\"\"\"\n    # TWAP需要限定价格\n    if\
          \ is_empty_value(item.get('limitPrice')):\n        error_dict = {'text':\
          \ '限定价格', 'example': '6.30'}\n        add_error_to_list(error_dict, unique_texts,\
          \ errors_list)\n\n    # TWAP需要起始时间\n    if is_empty_value(item.get('twapStartTime')):\n\
          \        error_dict = {'text': 'TWAP起始时刻', 'example': '09:30'}\n       \
          \ add_error_to_list(error_dict, unique_texts, errors_list)\n\n    # TWAP需要终止时间\n\
          \    if is_empty_value(item.get('twapEndTime')):\n        error_dict = {'text':\
          \ 'TWAP终止时刻', 'example': '15:00'}\n        add_error_to_list(error_dict,\
          \ unique_texts, errors_list)\n\n    # 验证时间逻辑\n    start_time = item.get('twapStartTime')\n\
          \    end_time = item.get('twapEndTime')\n    if not is_empty_value(start_time)\
          \ and not is_empty_value(end_time):\n        if isinstance(start_time, str)\
          \ and isinstance(end_time, str):\n            try:\n                from\
          \ datetime import datetime\n                # 支持 HH:MM 格式\n            \
          \    start_dt = datetime.strptime(start_time, '%H:%M')\n               \
          \ end_dt = datetime.strptime(end_time, '%H:%M')\n                if end_dt\
          \ <= start_dt:\n                    error_dict = {'text': 'TWAP时间顺序', 'example':\
          \ '终止时刻必须晚于起始时刻'}\n                    add_error_to_list(error_dict, unique_texts,\
          \ errors_list)\n            except ValueError:\n                error_dict\
          \ = {'text': 'TWAP时间格式', 'example': 'HH:MM格式，如09:30'}\n                add_error_to_list(error_dict,\
          \ unique_texts, errors_list)\n\n\ndef validate_option_type_consistency(order_list):\n\
          \    \"\"\"验证期权类型一致性\"\"\"\n    if len(order_list) <= 1:\n        return\
          \ None\n\n    option_types = [item.get('optionType') for item in order_list\
          \ if not is_empty_value(item.get('optionType'))]\n    if len(set(option_types))\
          \ > 1:\n        # 特殊处理：返回固定错误信息\n        return \"批量下单只允许相同期权类型\"\n\n  \
          \  return None\n\n\ndef validate_order_type_params(item, unique_texts, errors_list):\n\
          \    \"\"\"根据建仓方式验证对应参数\"\"\"\n    order_type = item.get('orderType')\n\
          \    if is_empty_value(order_type):\n        return\n\n    order_type_str\
          \ = str(order_type).strip()\n\n    if order_type_str == '限价单':\n       \
          \ validate_limit_price_order(item, unique_texts, errors_list)\n    elif\
          \ order_type_str == '市价单':\n        validate_market_price_order(item, unique_texts,\
          \ errors_list)\n    elif order_type_str == 'POV':\n        validate_pov_order(item,\
          \ unique_texts, errors_list)\n    elif order_type_str == 'TWAP':\n     \
          \   validate_twap_order(item, unique_texts, errors_list)\n    else:\n  \
          \      error_dict = {'text': '有效建仓方式', 'example': '限价单/市价单/POV/TWAP'}\n\
          \        add_error_to_list(error_dict, unique_texts, errors_list)\n\n\n\
          def generate_order_error_message(errors_list):\n    \"\"\"生成建仓指令错误提示信息\"\
          \"\"\n    if not errors_list:\n        return 'ok'\n\n    texts = [error['text']\
          \ for error in errors_list]\n    examples = [f\"{error['text']}：{error['example']}\"\
          \ for error in errors_list]\n\n    message = f\"\"\"\n您的期权建仓指令参数不完整，请补充以下信息：{'，'.join(texts)}。\n\
          \n缺失参数说明：\n{chr(10).join(examples)}\n\n请引用本消息，补充完整的建仓指令参数。\n\"\"\"\n   \
          \ return message\n\n\ndef validate_order_params(order_list):\n    \"\"\"\
          验证建仓指令参数列表\"\"\"\n    # 首先验证期权类型一致性（优先检查）\n    consistency_error = validate_option_type_consistency(order_list)\n\
          \    if consistency_error:\n        return consistency_error\n\n    unique_error_texts\
          \ = set()\n    errors_list = []\n\n    for item in order_list:\n       \
