    - data:
        code: "def main(data):\n    \"\"\"验证期权数据的主函数\"\"\"\n    # 强制设置所有项的optionType为\"\
          欧式看涨\"\n    for item in data:\n        item['optionType'] = '欧式看涨'\n\n \
          \   result = validate_data(data)\n    return {\n        'result': result,\n\
          \        'code': 0 if result == 'ok' else 500\n    }\n\n\ndef is_empty_value(value):\n\
          \    \"\"\"检查值是否为空\"\"\"\n    if not value or value is None:\n        return\
          \ True\n    if isinstance(value, str) and value.strip() == '':\n       \
          \ return True\n    return False\n\n\ndef add_error_to_list(error_dict, unique_texts,\
          \ errors_list):\n    \"\"\"添加错误到列表中并去重\"\"\"\n    if error_dict['text']\
          \ not in unique_texts:\n        unique_texts.add(error_dict['text'])\n \
          \       errors_list.append(error_dict)\n\n\ndef validate_basic_fields(item,\
          \ unique_texts, errors_list):\n    \"\"\"验证基础字段\"\"\"\n    # 检查股票代码或名称\n\
          \    if is_empty_value(item.get('stockCode')) and is_empty_value(item.get('stockName')):\n\
          \        error_dict = {'text': '标的代码或名称', 'example': '300098.SZ'}\n    \
          \    add_error_to_list(error_dict, unique_texts, errors_list)\n\n    # 检查期权类型\n\
          \    if is_empty_value(item.get('optionType')):\n        error_dict = {'text':\
          \ '期权类型', 'example': '欧式看涨'}\n        add_error_to_list(error_dict, unique_texts,\
          \ errors_list)\n\n\ndef validate_snowball_fields(item, unique_texts, errors_list):\n\
          \    \"\"\"验证雪球类型期权的字段\"\"\"\n    snowball_config = {\n        'snowballKnockInLowerBarrierPct':\
          \ {'text': '雪球期初敲入价格百分比', 'example': '80%'},\n        'snowballKnockOutUpperBarrierPct':\
          \ {'text': '雪球期初敲出价格百分比', 'example': '100%'},\n        'snowballLockInPeriodMonths':\
          \ {'text': '雪球锁定期', 'example': '3个月'},\n        'snowballTenorMonths': {'text':\
          \ '雪球存续期', 'example': '3个月'},\n        'snowballAnnualizedCouponRatePct':\
          \ {'text': '雪球年化返息百分比', 'example': '0.5%'},\n        'snowballFeaturesText':\
          \ {'text': '雪球其他特性描述', 'example': '不追保降敲sd0.5%'}\n    }\n\n    for field_name,\
          \ error_info in snowball_config.items():\n        if is_empty_value(item.get(field_name)):\n\
          \            add_error_to_list(error_info, unique_texts, errors_list)\n\n\
          \ndef validate_regular_option_fields(item, unique_texts, errors_list):\n\
          \    \"\"\"验证普通期权的字段\"\"\"\n    if is_empty_value(item.get('strikePercentage')):\n\
          \        error_dict = {'text': '执行价格百分比', 'example': '102%'}\n        add_error_to_list(error_dict,\
          \ unique_texts, errors_list)\n\n    if is_empty_value(item.get('tenor')):\n\
          \        error_dict = {'text': '期权期限', 'example': '3个月'}\n        add_error_to_list(error_dict,\
          \ unique_texts, errors_list)\n\n\ndef generate_error_message(errors_list):\n\
          \    \"\"\"生成错误提示信息\"\"\"\n    if not errors_list:\n        return 'ok'\n\
          \n    texts = [error['text'] for error in errors_list]\n    examples = [f\"\
          {error['text']}：{error['example']}\" for error in errors_list]\n\n    message\
          \ = f\"已收到您的期权询价请求，请问您期望的{'，'.join(texts)}是？ \\n例：{'  '.join(examples)}\
          \  \\n请引用本消息，输入{'、'.join(texts)}\"\n    return message\n\n\ndef validate_data(data):\n\
          \    \"\"\"验证数据列表\"\"\"\n    unique_error_texts = set()\n    errors_list\
          \ = []\n\n    for item in data:\n        # 验证基础字段\n        validate_basic_fields(item,\
          \ unique_error_texts, errors_list)\n\n        # 根据期权类型验证不同字段\n        option_type\
          \ = item.get('optionType')\n        if option_type == '雪球':\n          \
          \  validate_snowball_fields(item, unique_error_texts, errors_list)\n   \
          \     else:\n            validate_regular_option_fields(item, unique_error_texts,\
          \ errors_list)\n\n    return generate_error_message(errors_list)\n\n\n#\
          \ # 示例用法\n# if __name__ == \"__main__\":\n#     # 测试数据示例\n#     test_data\
          \ = [\n#         # {\n#         #     'stockCode': '300098.SZ',\n#     \
          \    #     'stockName': '',\n#         #     'optionType': '欧式看涨',\n#  \
          \       #     # 'strikePercentage': '102%',\n#         #     # 'tenor':\
          \ '3个月'\n#         # },\n#         # {\n#         #     'stockCode': '300098.SZ',\n\
          #         #     'stockName': '高新兴',\n#         #     'optionType': '雪球',\n\
          #         #     'snowballKnockInLowerBarrierPct': '',\n#         #     'snowballKnockOutUpperBarrierPct':\
          \ '100%',\n#         #     'snowballLockInPeriodMonths': '3个月',\n#     \
          \    #     'snowballTenorMonths': '3个月',\n#         #     'snowballAnnualizedCouponRatePct':\
          \ '0.5%',\n#         #     'snowballFeaturesText': '不追保降敲sd0.5%'\n#    \
          \     # }\n#     ]\n#\n#     result = main(test_data)\n#     print(\"验证结果：\"\
          )\n#     print(f\"代码: {result['code']}\")\n#     print(f\"信息: {result['result']}\"\
          )"
