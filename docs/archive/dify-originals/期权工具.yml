          \ -> Dict[str, Any]:\n    \"\"\"\n    尝试把 JSON 字符串解析为 Python dict\n    \"\
          \"\"\n    if not llmText:\n        return {\"result\": {}}\n\n    try:\n\
          \        # 处理转义的JSON字符串\n        # 如果字符串中包含 \\\\\" 说明JSON的引号被转义了\n     \
          \   if '\\\\\"' in llmText:\n            # 将转义的引号还原\n            llmText\
          \ = llmText.replace('\\\\\"', '\"')\n        \n        data_dict = json.loads(llmText)\n\
          \        if not isinstance(data_dict, dict):\n            # 如果解析后不是 dict，比如是\
          \ list 或 str，也转为空 dict\n            data_dict = {}\n    except (json.JSONDecodeError,\
          \ TypeError):\n        data_dict = {}\n\n    return {\n        \"result\"\
          : data_dict,\n        \"operate\": \"询价\",\n        \"type\": \"new_inquiry\"\
          ,\n        \"orderList\": []\n    }"
