          \ {\n            // flag 可能是字符串 \"true\"/\"false\"，统一转为 boolean\n      \
          \      flagMap[item.id] = item.flag === true || item.flag === 'true';\n\
          \        }\n    }\n\n    var result = mergeData.map(function(group) {\n\
          \        if (!group || typeof group !== 'object') return group;\n      \
          \  var keywords = Array.isArray(group.keywords) ? group.keywords : [];\n\
          \        var newKeywords = keywords.map(function(kw) {\n            if (!kw\
          \ || typeof kw !== 'object') return kw;\n            var isFull = kw.id\
          \ != null && flagMap.hasOwnProperty(kw.id)\n                ? flagMap[kw.id]\n\
          \                : kw.isFull;\n            // 去除 id 字段\n            return\
          \ { keyword: kw.keyword, isFull: isFull };\n        });\n        return\
          \ { orgStr: group.orgStr, keywords: newKeywords };\n    });\n\n    return\
          \ { result: result, resultStr: JSON.stringify(result) };\n}\n"
