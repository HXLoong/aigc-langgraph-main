          \ str;\n    return str.replace(/^```[a-z]*\\s*/i, '').replace(/\\s*```$/,\
          \ '').trim();\n}\n\nfunction main({inferCodes, splitCodes}) {\n    try {\
          \ if (typeof inferCodes === 'string') inferCodes = JSON.parse(stripMarkdown(inferCodes));\
          \ } catch (e) { inferCodes = {}; }\n    try { if (typeof splitCodes ===\
          \ 'string') splitCodes = JSON.parse(stripMarkdown(splitCodes)); } catch\
          \ (e) { splitCodes = {}; }\n\n    if (!inferCodes || typeof inferCodes !==\
          \ 'object') inferCodes = {};\n    if (!splitCodes || typeof splitCodes !==\
          \ 'object') splitCodes = {};\n\n    // 合并两个来源的所有 key\n    var allKeys =\
          \ new Set([...Object.keys(inferCodes), ...Object.keys(splitCodes)]);\n\n\
          \    var result = [];\n    allKeys.forEach(function(orgStr) {\n        var\
          \ fromInfer = Array.isArray(inferCodes[orgStr]) ? inferCodes[orgStr] : [];\n\
          \        var fromSplit = Array.isArray(splitCodes[orgStr]) ? splitCodes[orgStr]\
          \ : [];\n\n        // 合并去重，过滤空值\n        var seen = {};\n        var keywords\
          \ = [];\n        var sources = fromInfer.concat(fromSplit);\n        for\
          \ (var i = 0; i < sources.length; i++) {\n            var val = sources[i];\n\
          \            if (val != null && val !== '' && !seen[val]) {\n          \
          \      seen[val] = true;\n                keywords.push(val);\n        \
          \    }\n        }\n\n        if (orgStr != null && orgStr !== '' && !seen[orgStr])\
          \ {\n            keywords.push(orgStr);\n        }\n\n        result.push({\
          \ orgStr: orgStr, keywords: keywords });\n    });\n\n    return { result:\
          \ result };\n}\n"
