# 提示词版本灰度配置（ADR 0003）
#
# 决定每个节点加载哪个 prompt 文件版本。
# - 默认全部走 v1（无配置时 = 加载 <category>/<name>.md）
# - v2+ 灰度：在 versions 列表中加 weight，按 conversation_id hash 分流
#   保证同一会话稳定路由到同一版本
# - 环境变量 OTC_PROMPT_<CATEGORY>_<NAME>_VERSION=v2 强制覆盖（开发调试用）
#
# 权重必须和为 1.0；空 weight 视为 1.0（独占）。

# 示例：swap.intent 灰度切 5% 流量到 v2 验证某修复
# swap.intent:
#   versions:
#     - name: intent       # → app/prompts/swap/intent.md (无后缀，v1)
#       weight: 0.95
#     - name: intent_v2    # → app/prompts/swap/intent_v2.md
#       weight: 0.05

# 当前灰度配置
#
# 2026-09-17（ADR 0024 D1）：git 为唯一真源后，零风险瘦身直接落 v1；历史灰度位
# intent_v2 / place_order_v2 / image_extract_v2 / excel_extract_v2 / image_ocr_v2 均已删除
# （git 历史与 tag dify-assets-frozen-20260917 可查）。需要灰度时按 ADR 0003 新建
# <name>_v{N}.md 并在下方登记 versions + weight，eval PASS 率 ≥ v1 基线后才允许放量。
overrides: {}
