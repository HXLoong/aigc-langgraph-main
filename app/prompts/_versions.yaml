# 提示词版本灰度配置（ADR 0003）
#
# 决定每个节点加载哪个 prompt 文件版本。
# - 默认全部走 v1（无配置时 = 加载 <category>/<name>.md）
# - v2+ 灰度：在 versions 列表中加 weight，按 conversation_id hash 分流
#   保证同一会话稳定路由到同一版本
# - 环境变量 OTC_PROMPT_<CATEGORY>_<NAME>_VERSION=v2 强制覆盖（开发调试用）
#
# 权重必须和为 1.0；空 weight 视为 1.0（独占）。

# 示例：swap.intent 灰度切 5% 流量到 v2 验证 g008 修复
# swap.intent:
#   versions:
#     - name: intent       # → app/prompts/swap/intent.md (无后缀，v1)
#       weight: 0.95
#     - name: intent_v2    # → app/prompts/swap/intent_v2.md
#       weight: 0.05

# 当前灰度配置
overrides:
  # swap.intent · g008 偶发误判修复（"swap 确认修改订单 H-..." → confirm_modify_order）
  # 5% 流量切 v2 验证修复效果，95% 保持 v1 生产基线
  swap.intent:
    versions:
      - name: intent       # → app/prompts/swap/intent.md (v1，生产基线)
        weight: 0.95
      - name: intent_v2    # → app/prompts/swap/intent_v2.md (修 g008，加冲突仲裁规则)
        weight: 0.05
