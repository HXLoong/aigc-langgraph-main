# 提示词清单真源（ADR 0022）。
#
# 每个 app/prompts/**/*.md 必须在此登记，CI 由 scripts/prompt_inventory.py --check 守护：
#   status: active    生产加载；loader = 引用它的 .py（相对仓库根），文件内必须出现字面量 "name"
#   status: gray      ADR 0003 灰度位（*_v2.md）；base = 对应 v1；base_system_sha256 = 切 v2 时
#                     v1 [system] 段的 sha256（python scripts/prompt_inventory.py 可算）。
#                     v1 之后被改动 → lint 报"漂移"，须重做 diff 并写 drift_acknowledged
#   status: inactive  无代码加载点的资产；reason 必填（保留理由 + 可删条件）
#   max_system_chars  可选，system 段字符预算，超出 lint fail
#
# 本文件替代 app/prompts/CLAUDE.md 里手写的"非活跃文件清单"。

prompts:
