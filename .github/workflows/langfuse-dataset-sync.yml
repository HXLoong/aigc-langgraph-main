name: langfuse-dataset-sync

on:
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - "tests/fixtures/intent/*.jsonl"
      - "tests/fixtures/categories/*.jsonl"
      - "tests/fixtures/nodes/*/*.jsonl"
      - "scripts/langfuse/upload_golden_to_langfuse.py"
      - "harness/golden.py"
      - ".github/workflows/langfuse-dataset-sync.yml"

concurrency:
  group: langfuse-dataset-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LANGFUSE_BASE_URL: ${{ vars.LANGFUSE_BASE_URL }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Langfuse configuration
        shell: bash
        run: |
          for key in LANGFUSE_BASE_URL LANGFUSE_PUBLIC_KEY LANGFUSE_SECRET_KEY; do
            if [ -z "${!key}" ]; then
              echo "::error::$key is required"
              exit 1
            fi
          done

      - name: Install sync dependencies
        run: python -m pip install "langfuse==4.15.0" "pydantic>=2,<3"

      - name: Sync datasets
        run: python scripts/langfuse/upload_golden_to_langfuse.py --sync-all
