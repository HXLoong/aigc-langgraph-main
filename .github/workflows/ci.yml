name: CI

# fast 执行 ruff、mypy 和 app 核心快速测试。
# slow 执行 app 核心全量 pytest；真实模型、Java 黄金集与真实数据库不进 CI。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # ADR 0014 D5: CI 中默认关闭 LangFuse（不跑 server，避免成本与脆弱性）
  ENABLE_LANGFUSE: "false"
  PYTHONUTF8: "1"
  USE_MYSQL_CHECKPOINTER: "false"
  MYSQL_URI: "mysql+aiomysql://ci:ci@127.0.0.1:1/ci"
  LLM_PROVIDER: "openai_compatible"
  LLM_API_BASE: "http://127.0.0.1:1/v1"
  LLM_API_KEY: "ci-placeholder"
  LLM_MODEL_STANDARD: "ci-placeholder"
  LLM_MODEL_THINKING: "ci-placeholder"
  LLM_MODEL_COMPLEX: "ci-placeholder"
  OTC_API_BASE_URL: "http://127.0.0.1:1"
  OTC_API_SECRET: "ci-placeholder"

jobs:
  fast:
    name: ruff + mypy + app 核心快速测试
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check app/ tests/ harness/ scripts/probe_goats/ scripts/langfuse/ scripts/goats_api_mock/

      - name: Type check (mypy)
        run: python -m mypy app/ harness/


      - name: Fast tests (pytest -k "not e2e")
        run: pytest tests/ -q -p no:cacheprovider -k "not e2e"

  slow:
    name: 全量测试（含 e2e）
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: fast
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Full tests（含 e2e；真实 MySQL 用例自动 skip）
        run: pytest tests/ -q -p no:cacheprovider
