name: CI

# 2026-05-12 曾暂停自动触发；2026-09-22 按 ADR 0024 D6 / D8 阶段 0 门槛恢复：
# fast job（每次 push / PR，< 2 min）守 lint + 一致性检查 + 快速测试，
# slow job（PR + main）跑全量 pytest（含 e2e）。真实 MySQL 用例（RUN_LOCAL_MYSQL_TESTS=1）
# 2026-09-24 起不再进 CI，只在本地 / 联调环境 opt-in 运行（docs/development/nodes-run.md）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # ADR 0014 D5: CI 中默认关闭 LangFuse（不跑 server，避免成本与脆弱性）
  ENABLE_LANGFUSE: "false"
  PYTHONUTF8: "1"

jobs:
  fast:
    name: lint + 一致性 + 快速测试
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      USE_MYSQL_CHECKPOINTER: "false"
      REQUEST_IDEMPOTENCY: "false"
      MYSQL_URI: "mysql+aiomysql://ci:ci@127.0.0.1:1/ci"
      QWEN_API_BASE: "http://127.0.0.1:1/v1"
      QWEN_API_KEY: "ci-placeholder"
      OTC_API_BASE_URL: "http://127.0.0.1:1"
      OTC_API_SECRET: "ci-placeholder"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check app/ tests/ harness/ scripts/probe_goats/

      - name: Type check (mypy)
        run: python -m mypy app/ harness/

      - name: ADR 0019 阈值一致性 (alerts.py ↔ ADR 0019 ↔ runbook)
        run: python scripts/check_alert_threshold_consistency.py

      - name: tests/fixtures 一致性（unified ⊇ golden + ADR 0015 锚点）
        run: python scripts/check_fixture_consistency.py

      - name: ADR 引用一致性（互引虚悬 + 代码路径存在性）
        run: python scripts/check_adr_refs.py

      - name: docs/ 存放规则（目录白名单 + 命名 + 报告归档 + 链接有效）
        run: python scripts/check_docs_layout.py

      - name: AGENTS.md / .agents 与 CLAUDE.md / .claude 同步
        run: python scripts/sync_agents_md.py --check

      - name: 无配置可导入（tests/test_import_without_env.py）
        # 不带 .env：模块级 get_settings() 一旦回潮，这一步先于全量测试失败
        run: pytest tests/test_import_without_env.py -q -p no:cacheprovider

      - name: Fast tests (pytest -k "not e2e")
        run: pytest tests/ -q -p no:cacheprovider -k "not e2e"

  slow:
    name: 全量测试（含 e2e）
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: fast
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    env:
      USE_MYSQL_CHECKPOINTER: "false"
      REQUEST_IDEMPOTENCY: "false"
      # 不连数据库：*_mysql.py 集成用例未设 RUN_LOCAL_MYSQL_TESTS 时自动 skip
      MYSQL_URI: "mysql+aiomysql://ci:ci@127.0.0.1:1/ci"
      QWEN_API_BASE: "http://127.0.0.1:1/v1"
      QWEN_API_KEY: "ci-placeholder"
      OTC_API_BASE_URL: "http://127.0.0.1:1"
      OTC_API_SECRET: "ci-placeholder"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Full tests（含 e2e；真实 MySQL 用例自动 skip）
        run: pytest tests/ -q -p no:cacheprovider
