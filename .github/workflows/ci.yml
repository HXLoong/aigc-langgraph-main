name: CI

on:
  # 2026-05-12 暂停自动 CI（M3 数据集 + 文档密集期，CI 临时关闭）
  # 恢复方法：取消下方 workflow_dispatch，恢复 push + pull_request 触发即可
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # ADR 0014 D8: CI 中默认关闭 LangFuse（不跑 server，避免成本与脆弱性）
      ENABLE_LANGFUSE: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        # M1 重写期允许有警告，但语法错误会失败
        run: ruff check app/ tests/ || echo "::warning::ruff issues (allowed during M1)"

      - name: Type check (mypy)
        # M1 重写期允许有类型错误（旧代码已删，新代码逐步补）
        run: mypy app/ || echo "::warning::mypy issues (allowed during M1)"

      - name: ADR 0019 阈值一致性 (alerts.py ↔ ADR 0019 ↔ runbook)
        # PR #102 / #103 / #104 / #106：3 处阈值同步是 F4 切流硬约束，
        # 任一不一致 → 此步骤 fail，详见 docs/adr/0019-incident-severity-thresholds.md §5
        run: python scripts/check_alert_threshold_consistency.py

      - name: tests/fixtures 一致性（unified ⊇ golden + ADR 0015 锚点）
        # PR #109：M2/M3 基线数据集职责矩阵 + 不变量
        # 详见 tests/fixtures/README.md §3
        run: python scripts/check_fixture_consistency.py

      - name: ADR 引用一致性（互引虚悬 + 代码路径存在性）
        # Issue #161（#152 裁决落地）：承接 AUDIT-2026-05-13 §4 复检能力，
        # 跳过 ~~删除线~~ 段；详见 docs/adr/README.md "卫生检查"
        run: python scripts/check_adr_refs.py

      - name: Run tests
        run: |
          if [ -d tests ] && [ -n "$(find tests -name 'test_*.py' -type f 2>/dev/null)" ]; then
            pytest tests/ -v
          else
            echo "No tests yet (M1 skeleton phase)"
          fi
