name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # 离线测试不读取开发机 .env，不连接数据库、LLM 或 Java 服务。
      ENABLE_LANGFUSE: "false"
      USE_MYSQL_CHECKPOINTER: "false"
      REQUEST_IDEMPOTENCY: "false"
      MYSQL_URI: "mysql+aiomysql://ci:ci@127.0.0.1:1/ci"
      QWEN_API_BASE: "http://127.0.0.1:1/v1"
      QWEN_API_KEY: "ci-placeholder"
      OTC_API_BASE_URL: "http://127.0.0.1:1"
      OTC_API_SECRET: "ci-placeholder"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check app/ tests/ harness/

      - name: Type check (mypy)
        run: mypy app/ harness/

      - name: 指令文件同步
        run: python scripts/sync_agents_md.py --check

      - name: ADR 0019 阈值一致性 (alerts.py ↔ ADR 0019 ↔ runbook)
        # PR #102 / #103 / #104 / #106：3 处阈值同步是 F4 切流硬约束，
        # 任一不一致 → 此步骤 fail，详见 docs/adr/0019-incident-severity-thresholds.md §5
        run: python scripts/check_alert_threshold_consistency.py

      - name: tests/fixtures 一致性（unified ⊇ golden + ADR 0015 锚点）
        # PR #109：M2/M3 基线数据集职责矩阵 + 不变量
        # 详见 tests/fixtures/README.md §3
        run: python scripts/check_fixture_consistency.py

      - name: ADR 引用一致性（互引虚悬 + 代码路径存在性）
        # Issue #161（#152 裁决落地）：承接 AUDIT-2026-05-13 §4 复检能力，
        # 跳过 ~~删除线~~ 段；详见 docs/adr/README.md "卫生检查"
        run: python scripts/check_adr_refs.py

      - name: Run tests
        run: pytest tests/ -v
