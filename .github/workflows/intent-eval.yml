name: intent-eval

# 意图集（tests/fixtures/intent/）评估：只依赖 LLM，不依赖 Java / GOATS 后端。两种模式并存（harness/intent_context.py）：
# - 冻结用例（每轮上下文写在 fixture）：只跑意图子链（harness/intent_runner.py），不调任何后端
# - 回放用例（quote_previous / {{previous_*}} 引用上一轮真实回复）：主图 + 仓库内 mock_api
#   （GOATS 22 + Java 10 端点的假实现）在 runner 上顶替后端；回放用例全部冻结后可删 mock_api 步骤
# 评分用 harness/evaluators 的确定性评估器在本地算，不需要 Langfuse。
# 业务集（tests/fixtures/categories/）依赖真实后端与授权账号，只在开发环境跑，绝不进这里。
#
# 仅手动触发：Actions → intent-eval → Run workflow（可改 fixture / limit / fail_under）。
# 不随 PR 自动运行——全量约 14 分钟且消耗 LLM 额度；改提示词 / 路由 / 意图节点后按需手动跑。
# 前置：仓库 secrets 配置 QWEN_API_BASE / QWEN_API_KEY（LLM 网关）；可选 variables
#       QWEN_MODEL_STANDARD / QWEN_MODEL_THINKING / QWEN_MODEL_COMPLEX 覆盖默认模型
# 未配置 secrets：直接失败，避免误以为跑过

on:
  workflow_dispatch:
    inputs:
      fixture:
        description: "意图集路径（文件或目录）"
        default: "tests/fixtures/intent"
        required: false
      concurrency:
        description: "并行数"
        default: "3"
        required: false
      limit:
        description: "只跑前 N 条（留空 = 全部）"
        default: ""
        required: false
      fail_under:
        description: "通过率门槛，低于则失败（0 = 只出报告不拦截）"
        default: "0.95"
        required: false

concurrency:
  group: intent-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  intent-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ENVIRONMENT: development
      ENABLE_LANGFUSE: "false"
      USE_MYSQL_CHECKPOINTER: "false"
      REQUEST_IDEMPOTENCY: "false"
      # 未启用持久化；persist 节点写库失败只打 warning，不影响评分
      MYSQL_URI: mysql://ci:ci@127.0.0.1:3306/ci_unused
      # 全部指向 runner 上的 mock_api，绝不指向 Java / GOATS
      OTC_API_BASE_URL: http://127.0.0.1:8099
      OTC_API_SECRET: mock-secret
      GOATS_BASE_URL: http://127.0.0.1:8099
      GOATS_CLIENT_ID: mock-client-id
      GOATS_CLIENT_SECRET: mock-client-secret
      GOATS_EXTAPP_SALT: mock-salt
      SECURITIES_INSTRUMENT_URL: http://127.0.0.1:8099/admin-api/integration/securities-instrument/select
      # LLM 网关（唯一外部依赖）
      QWEN_API_BASE: ${{ secrets.QWEN_API_BASE }}
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
      # secrets 上下文不能直接用于 step 的 if，先折算成布尔 env
      HAS_LLM_SECRETS: ${{ secrets.QWEN_API_BASE != '' && secrets.QWEN_API_KEY != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: 检查 LLM secrets
        run: |
          if [ "$HAS_LLM_SECRETS" = "true" ]; then
            echo "LLM secrets 已配置，执行完整评估"
            exit 0
          fi
          echo "::error::缺少 QWEN_API_BASE / QWEN_API_KEY secrets：意图集只依赖 LLM（不依赖 Java/GOATS），但必须配置模型网关"
          exit 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: fixture 一致性 lint（意图集格式门槛，不需要 LLM）
        run: python scripts/check_fixture_consistency.py

      - name: 可选模型覆盖（仓库 variables，未设置则用 app/config.py 默认）
        if: env.HAS_LLM_SECRETS == 'true'
        env:
          STANDARD: ${{ vars.QWEN_MODEL_STANDARD }}
          THINKING: ${{ vars.QWEN_MODEL_THINKING }}
          COMPLEX: ${{ vars.QWEN_MODEL_COMPLEX }}
        run: |
          if [ -n "$STANDARD" ]; then echo "QWEN_MODEL_STANDARD=$STANDARD" >> "$GITHUB_ENV"; fi
          if [ -n "$THINKING" ]; then echo "QWEN_MODEL_THINKING=$THINKING" >> "$GITHUB_ENV"; fi
          if [ -n "$COMPLEX" ]; then echo "QWEN_MODEL_COMPLEX=$COMPLEX" >> "$GITHUB_ENV"; fi

      - name: 启动 mock_api（仓库内假后端，顶替 Java + GOATS）
        if: env.HAS_LLM_SECRETS == 'true'
        run: |
          nohup python -m uvicorn mock_api.server:app --host 127.0.0.1 --port 8099 > mock_api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8099/ > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8099/ > /dev/null || { echo "::error::mock_api 未就绪"; cat mock_api.log; exit 1; }

      - name: 运行意图集评估（确定性评分，无 Judge）
        if: env.HAS_LLM_SECRETS == 'true'
        env:
          FIXTURE: ${{ github.event.inputs.fixture || 'tests/fixtures/intent' }}
          CONCURRENCY: ${{ github.event.inputs.concurrency || '3' }}
          LIMIT: ${{ github.event.inputs.limit || '' }}
          FAIL_UNDER: ${{ github.event.inputs.fail_under || '0.95' }}
        run: |
          python scripts/langfuse/langfuse_eval.py \
            --local "$FIXTURE" --suite intent \
            --concurrency "$CONCURRENCY" ${LIMIT:+--limit "$LIMIT"} \
            --fail-under "$FAIL_UNDER" \
            --report .harness-runs/intent-eval.json

      - name: 写 Step Summary（通过率 + 失败用例）
        if: always() && env.HAS_LLM_SECRETS == 'true'
        run: |
          python - <<'EOF'
          import json, os
          from pathlib import Path

          report = Path(".harness-runs/intent-eval.json")
          lines = ["## intent-eval 结果", ""]
          if not report.is_file():
              lines.append("评估未产出报告（评估步骤失败或被中断，见日志）。")
          else:
              data = json.loads(report.read_text(encoding="utf-8"))
              lines += [
                  f"- 套件：`{data.get('suite')}`  用例：{data.get('total')}  通过：{data.get('passed')}"
                  f"  通过率：**{data.get('pass_rate', 0) * 100:.1f}%**  耗时：{data.get('elapsed_seconds')}s",
                  "",
              ]
              failed = [c for c in data.get("cases", []) if not c.get("passed")]
              if failed:
                  lines += ["| 用例 | 评估器 | 说明 |", "|---|---|---|"]
                  for case in failed[:40]:
                      for ev in case.get("evaluations", []):
                          if ev.get("value", 0) < 1:
                              comment = str(ev.get("comment") or "").replace("|", "\\|")[:160]
                              lines.append(f"| `{case['id']}` | {ev['name']} | {comment} |")
                  if len(failed) > 40:
                      lines.append(f"| … | | 另有 {len(failed) - 40} 条失败，见 artifact intent-eval-report |")
              else:
                  lines.append("全部通过。")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("\n".join(lines) + "\n")
          EOF

      - name: 上传报告
        if: always() && env.HAS_LLM_SECRETS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: intent-eval-report
          path: |
            .harness-runs/intent-eval.json
            mock_api.log
          if-no-files-found: warn
