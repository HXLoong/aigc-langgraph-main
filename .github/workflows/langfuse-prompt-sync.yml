name: langfuse-prompt-sync

# 合并到 main 后，现役提示词的变更自动同步；仍可从 Actions 手动重跑。
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/prompts/option/*.md"
      - "app/prompts/option_close/*.md"
      - "app/prompts/swap/*.md"

concurrency:
  group: langfuse-prompt-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LANGFUSE_BASE_URL: ${{ vars.LANGFUSE_BASE_URL }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Langfuse configuration
        shell: bash
        run: |
          for key in LANGFUSE_BASE_URL LANGFUSE_PUBLIC_KEY LANGFUSE_SECRET_KEY; do
            if [ -z "${!key}" ]; then
              echo "::error::$key is required"
              exit 1
            fi
          done

      - name: Install sync dependencies
        run: python -m pip install "langfuse==4.15.0" "pydantic>=2,<3"

      - name: Sync prompts to staging
        run: python scripts/langfuse/upload_prompt_to_langfuse.py --sync-all
