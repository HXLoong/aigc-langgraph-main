# Windows + Docker Desktop 的可选回调入口。
# 与原 Compose 及原有 override 一起使用，不替换现有镜像版本配置。
services:
  eval-proxy:
    image: nginx:1.28-alpine
    restart: unless-stopped
    volumes:
      - ./eval-proxy.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # 不配置 ports：80 端口仅供同一 Compose 网络内的容器访问。

  langfuse-web:
    environment:
      # Remote Experiment 由 web 发起，此模式只放行代理的容器名。
      LANGFUSE_WEBHOOK_WHITELISTED_HOST: eval-proxy
