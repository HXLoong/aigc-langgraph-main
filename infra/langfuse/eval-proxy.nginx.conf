server {
    listen 80;
    server_name _;

    # 不改请求正文，保留 x-langfuse-signature，供应用校验原始请求的签名。
    location = /v1/webhooks/langfuse {
        proxy_pass http://host.docker.internal:8201;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # 代理只提供回调入口，不转发其它应用接口。
    location / {
        return 404;
    }
}
